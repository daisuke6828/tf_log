<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チームタイムライン</title>
  <style>
    body { background: #121212; color: #fff; font-family: sans-serif; padding: 12px; margin: 0; padding-bottom: 50px; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid #333; }
    .green { color: #00e5ff; }
    
    /* ヘッダー：1段目に中央揃えのTEAM TIMELINE、2段目に左右ボタン */
    .header-top { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .header-row-bottom { display: flex; justify-content: space-between; align-items: center; }
    
    /* フィルタータブ・リスト */
    .filter-group { display: flex; gap: 4px; background: #2a2a2a; padding: 4px; border-radius: 8px; margin-bottom: 12px; align-items: center; }
    .filter-btn { background: transparent; color: #aaa; border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; white-space: nowrap; }
    .filter-btn.active { background: #00e5ff; color: #000; }
    .filter-select { background: #1e1e1e; border: 1px solid #444; color: #fff; padding: 6px; border-radius: 6px; font-size: 11px; margin-left: auto; }

    /* タイムラインカード */
    .feed-card { background: #1e1e1e; border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid #333; }
    .feed-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .user-info { display: flex; align-items: center; gap: 8px; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: #00e5ff; color: #000; font-weight: bold; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .fatigue-badge { background: #333; color: #00e5ff; border: 1px solid #00e5ff; font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: bold; }
    
    .workout-box { background: #2a2a2a; padding: 10px; border-radius: 6px; margin: 8px 0; font-size: 13px; line-height: 1.5; border-left: 3px solid #00e5ff; }
    .memo-box { font-size: 12px; color: #ccc; margin: 6px 0; background: #222; padding: 8px; border-radius: 4px; }
    
    .feed-actions { display: flex; gap: 12px; margin-top: 10px; border-top: 1px solid #2e2e2e; padding-top: 8px; }
    .action-btn { background: #2a2a2a; color: #aaa; border: 1px solid #444; border-radius: 20px; padding: 4px 12px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .action-btn.active { background: #00e5ff; color: #000; font-weight: bold; border-color: #00e5ff; }

    /* コメントエリア */
    .comment-section { margin-top: 8px; border-top: 1px dashed #333; padding-top: 8px; display: none; }
    .comment-list { font-size: 11px; color: #ddd; margin-bottom: 6px; }
    .comment-input-row { display: flex; gap: 6px; }
    .comment-input { flex: 1; background: #252525; border: 1px solid #444; color: #fff; padding: 6px; border-radius: 4px; font-size: 11px; }
    .comment-btn { background: #00e5ff; color: #000; border: none; padding: 6px 10px; border-radius: 4px; font-weight: bold; font-size: 11px; cursor: pointer; }

    /* 設定エリア */
    .setting-box { background: #1c1c1c; padding: 16px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #555; display: none; }
  </style>

  <!-- Firebase v11.1.0 SDK 読み込み -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAb2u6KAqvesS0ruc8npdwZlDiWUpQywQQ",
      authDomain: "tf-log.firebaseapp.com",
      projectId: "tf-log",
      storageBucket: "tf-log.firebasestorage.app",
      messagingSenderId: "469720285191",
      appId: "1:469720285191:web:302849209f97b010b62aa2",
      measurementId: "G-NE1RQKENVR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let timelinePosts = [];
    let currentTeamId = null;
    let currentUserNickname = 'だいすけ';

    window.onload = async function() {
      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          try {
            await signInAnonymously(auth);
          } catch (e) {
            console.error("匿名ログイン失敗:", e);
          }
          return;
        }

        const userId = user.uid;

        try {
          // 1. users コレクションから自分のニックネームと所属 teamId を取得
          const userDocRef = doc(db, "users", userId);
          const userDocSnap = await getDoc(userDocRef);

          if (userDocSnap.exists()) {
            const userData = userDocSnap.data();
            if (userData.name) {
              currentUserNickname = userData.name;
            }
            currentTeamId = userData.teamId || null;
          }

          if (!currentTeamId) {
            document.getElementById('headerTeamName').innerText = '🏃‍♂️ チーム未所属';
            document.getElementById('headerMyParts').innerText = '(未設定)';
            return;
          }

          // 2. teams コレクションからチーム名とブロック情報を取得
          const teamDocRef = doc(db, "teams", currentTeamId);
          const teamDocSnap = await getDoc(teamDocRef);

          if (teamDocSnap.exists()) {
            const teamData = teamDocSnap.data();
            const teamName = teamData.teamName || 'チーム';
            document.getElementById('headerTeamName').innerText = `🏃‍♂️ ${teamName}`;

            // ブロック情報（配列など）をセレクトボックスに反映
            initFilterControls(teamData.blocks);
            document.getElementById('headerMyParts').innerText = teamData.blocks ? teamData.blocks.join(', ') : '-';
          }

          // 3. タイムライン投稿の読み込みと描画
          await loadPostsFromFirebase(currentTeamId);
          renderTimeline('all');

        } catch (e) {
          console.error("初期化データ取得エラー:", e);
        }
      });
    };

    window.toggleSettings = function() {
      const panel = document.getElementById('settingsPanel');
      panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    };

    function initFilterControls(blocks) {
      const selectList = document.getElementById('blockSelectList');
      selectList.innerHTML = '<option value="">-- ブロック選択 --</option>';

      if (!blocks || !Array.isArray(blocks)) return;

      blocks.forEach(block => {
        const opt = document.createElement('option');
        opt.value = block;
        opt.innerText = block;
        selectList.appendChild(opt);
      });
    }

    window.filterTimeline = function(type, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      
      document.getElementById('blockSelectList').value = "";
      renderTimeline(type);
    };

    window.filterBySelect = function(select) {
      const val = select.value;
      if (!val) return;

      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      renderTimeline(val);
    };

    // Firebaseからタイムライン投稿を読み込む
    async function loadPostsFromFirebase(teamId) {
      try {
        const querySnapshot = await getDocs(collection(db, "teams", teamId, "timeline"));
        timelinePosts = [];
        querySnapshot.forEach((docSnap) => {
          timelinePosts.push({ id: docSnap.id, ...docSnap.data() });
        });
        
        // 日付やタイムスタンプの新しい順に並び替え
        timelinePosts.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      } catch (e) {
        console.error("Firebaseからのタイムライン読み込み失敗:", e);
        timelinePosts = [];
      }
    }

    // 「ナイス！」の切り替えとクラウド同期
    window.toggleLike = async function(postId, btn) {
      if (!currentTeamId) return;
      const post = timelinePosts.find(p => p.id === postId);
      if (!post) return;

      if (!post.likedUsers) post.likedUsers = [];

      const alreadyLiked = post.likedUsers.includes(currentUserNickname);

      if (alreadyLiked) {
        post.likedUsers = post.likedUsers.filter(u => u !== currentUserNickname);
        post.likes = Math.max(0, (post.likes || 1) - 1);
      } else {
        post.likedUsers.push(currentUserNickname);
        post.likes = (post.likes || 0) + 1;
      }

      btn.classList.toggle('active', !alreadyLiked);
      btn.querySelector('.like-count').innerText = post.likes;

      try {
        await updateDoc(doc(db, "teams", currentTeamId, "timeline", String(postId)), {
          likes: post.likes,
          likedUsers: post.likedUsers
        });
      } catch (e) {
        console.error("ナイス！の同期エラー:", e);
      }
    };

    window.toggleComments = function(postId) {
      const section = document.getElementById(`comments-${postId}`);
      section.style.display = section.style.display === 'block' ? 'none' : 'block';
    };

    // コメントの追加とクラウド同期
    window.addComment = async function(postId) {
      if (!currentTeamId) return;
      const input = document.getElementById(`input-${postId}`);
      const text = input.value.trim();
      if (!text) return;

      const post = timelinePosts.find(p => p.id === postId);
      if (!post) return;

      if (!post.comments) post.comments = [];
      const newComment = { user: currentUserNickname, text: text, time: new Date().toISOString() };
      
      post.comments.push(newComment);

      try {
        await updateDoc(doc(db, "teams", currentTeamId, "timeline", String(postId)), {
          comments: post.comments
        });

        input.value = '';
        
        // 再描画
        const activeBtn = document.querySelector('.filter-btn.active');
        const selectVal = document.getElementById('blockSelectList').value;
        if (selectVal) {
          renderTimeline(selectVal);
        } else if (activeBtn && activeBtn.innerText === '自分の投稿') {
          renderTimeline('my');
        } else {
          renderTimeline('all');
        }
        
        document.getElementById(`comments-${postId}`).style.display = 'block';
      } catch (e) {
        console.error("コメントの同期エラー:", e);
        alert('コメントの送信に失敗しました。');
      }
    };

    function renderTimeline(filter = 'all') {
      const container = document.getElementById('timelineContainer');
      container.innerHTML = '';

      let filteredPosts = timelinePosts;

      if (filter === 'my') {
        filteredPosts = timelinePosts.filter(p => p.username === currentUserNickname);
      } else if (filter !== 'all') {
        filteredPosts = timelinePosts.filter(p => p.partName === filter);
      }

      if (filteredPosts.length === 0) {
        container.innerHTML = '<div class="card" style="text-align:center; color:#777; font-size:12px;">該当する投稿がまだありません。<br>個人ページから練習日誌やスケジュールを投稿してみよう！</div>';
        return;
      }

      filteredPosts.forEach(post => {
        const card = document.createElement('div');
        card.className = 'feed-card';

        const fatigueStyle = post.fatigueColor ? `color:${post.fatigueColor}; border-color:${post.fatigueColor};` : '';
        
        let fatigueHtml = '';
        if (post.fatigue !== undefined && post.fatigue !== null && post.fatigue !== '' && post.fatigue !== '-') {
          fatigueHtml = `<div class="fatigue-badge" style="${fatigueStyle}">疲労度 ${post.fatigue}</div>`;
        }
        
        let commentHtml = '';
        if (post.comments && post.comments.length > 0) {
          post.comments.forEach(c => {
            commentHtml += `<div style="margin-bottom:4px;"><strong>${c.user}:</strong> ${c.text}</div>`;
          });
        } else {
          commentHtml = '<span style="color:#777;">コメントはまだありません</span>';
        }

        const likedUsers = post.likedUsers || [];
        const isLikedByMe = likedUsers.includes(currentUserNickname);

        card.innerHTML = `
          <div class="feed-header">
            <div class="user-info">
              <div class="avatar" style="background:${post.avatarBg || '#00e5ff'};">${post.avatarText || '用'}</div>
              <div>
                <div style="font-weight:bold; font-size:13px;">${post.username} <span style="font-size:11px; color:#888;">(${post.partName || '全体'})</span></div>
                <div style="font-size:10px; color:#666;">${post.time} · ${post.type}</div>
              </div>
            </div>
            ${fatigueHtml}
          </div>

          <div class="workout-box">
            <strong>${post.contentTitle}</strong><br>
            ${post.contentText}
          </div>

          ${post.memo ? `<div class="memo-box">💬 <strong>メモ:</strong> ${post.memo}</div>` : ''}

          <div class="feed-actions">
            <button class="action-btn ${isLikedByMe ? 'active' : ''}" onclick="toggleLike('${post.id}', this)">
              👏 ナイス！ <span class="like-count">${post.likes || 0}</span>
            </button>
            <button class="action-btn" onclick="toggleComments('${post.id}')">
              💬 コメント <span style="color:#666;">(${post.comments ? post.comments.length : 0})</span>
            </button>
          </div>

          <div class="comment-section" id="comments-${post.id}">
            <div class="comment-list">${commentHtml}</div>
            <div class="comment-input-row">
              <input type="text" class="comment-input" id="input-${post.id}" placeholder="コメントを入力...">
              <button class="comment-btn" onclick="addComment('${post.id}')">送信</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
</head>
<body>

<!-- ヘッダー：TEAM TIMELINEを真ん中に配置 -->
<div class="header-top">
  <h3 class="green" style="margin:0; font-size:18px; text-align:center;">👥 TEAM TIMELINE</h3>
  <div class="header-row-bottom">
    <button style="background:#2a2a2a; color:#00e5ff; border:1px solid #00e5ff; padding:6px 12px; border-radius:6px; font-size:11px; font-weight:bold; cursor:pointer;" onclick="location.href='team_top.html'">← チームトップ</button>
    <button style="background:#2a2a2a; color:#aaa; border:1px solid #555; padding:6px 12px; border-radius:6px; font-size:11px; font-weight:bold; cursor:pointer;" onclick="toggleSettings()">⚙️表示設定</button>
  </div>
</div>

<!-- チーム情報簡易表示 -->
<div class="card" style="padding:10px 14px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
  <div style="font-weight:bold; font-size:13px;" id="headerTeamName">🏃‍♂️ チーム読み込み中...</div>
  <div style="font-size:11px; color:#aaa;">設定ブロック: <span id="headerMyParts" style="color:#00e5ff;">-</span></div>
</div>

<!-- ⚙️ 表示設定パネル -->
<div id="settingsPanel" class="setting-box">
  <div style="font-size:14px; font-weight:bold; margin-bottom:8px; color:#00e5ff;">⚙️ 表示設定</div>
  <div style="font-size:12px; color:#ccc; line-height:1.6; margin-bottom:12px;">
    チーム作成時に登録されたブロック情報が自動でフィルターに反映されます。<br>
    チーム機能側で登録・変更を行ってください。
  </div>
  <button style="width:100%; background:#2a2a2a; color:#fff; border:1px solid #777; padding:10px; border-radius:6px; font-weight:bold; font-size:12px; cursor:pointer;" onclick="toggleSettings()">閉じる</button>
</div>

<!-- 🔍 フィルター機能 -->
<div class="filter-group">
  <button class="filter-btn active" onclick="filterTimeline('all', this)">すべて</button>
  <button class="filter-btn" onclick="filterTimeline('my', this)">自分の投稿</button>
  
  <select id="blockSelectList" class="filter-select" onchange="filterBySelect(this)">
    <option value="">-- ブロック選択 --</option>
  </select>
</div>

<!-- タイムラインフィード表示エリア -->
<div id="timelineContainer"></div>

</body>
</html>
