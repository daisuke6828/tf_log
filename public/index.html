<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン / 新規登録</title>
  
  <style>
    body { background: #121212; color: #fff; font-family: sans-serif; padding: 16px; margin: 0; display: flex; flex-direction: column; justify-content: center; min-height: 100vh; box-sizing: border-box; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #333; }
    .green { color: #00ff88; }
    
    input { width: 100%; box-sizing: border-box; background: #252525; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 6px; margin: 6px 0 14px; font-size: 14px; }
    
    .btn-primary { background: #00ff88; color: #000; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 4px; }
    .btn-secondary { background: #2a2a2a; color: #00ff88; border: 1px solid #00ff88; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 4px; }
    
    .divider { text-align: center; color: #666; margin: 16px 0; font-size: 12px; position: relative; }
    .divider::before, .divider::after { content: ""; position: absolute; top: 50%; width: 40%; height: 1px; background: #333; }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
  </style>

  <!-- Firebase App & Auth のCDN（グローバル版 v11.1.0） -->
  <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-auth-compat.js"></script>
  
  <!-- さっきの共通設定ファイルを読み込み -->
  <script src="firebase-config.js"></script>

  <script>
    // 1. 既存ユーザーのメールログイン処理
    async function handleLogin() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        alert('メールアドレスとパスワードを入力してください！');
        return;
      }

      try {
        const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
        const user = userCredential.user;
        
        localStorage.setItem('user_id', user.uid);
        alert('ログイン成功しました！');
        location.href = 'personal.html';
      } catch (error) {
        console.error("ログインエラー:", error);
        alert('ログインに失敗しました。メールアドレスまたはパスワードが間違っています。');
      }
    }

    // 2. 新規ユーザー（はじめての方）の匿名認証スタート処理
    async function handleNewUser() {
      try {
        const userCredential = await firebase.auth().signInAnonymously();
        const user = userCredential.user;

        localStorage.setItem('user_id', user.uid);
        location.href = 'profile.html';
      } catch (e) {
        console.error("匿名ログイン失敗:", e);
        alert('新規セッションの作成に失敗しました。');
      }
    }
  </script>
</head>
<body>

<div style="text-align: center; margin-bottom: 24px;">
  <h2 class="green" style="margin: 0; font-size: 20px;">⚡ TF-LOG</h2>
  <p style="font-size: 12px; color: #888; margin-top: 4px;">陸上競技記録管理アプリ</p>
</div>

<!-- 【上側】既存ユーザー向け：ログインエリア -->
<div class="card">
  <div style="font-weight: bold; margin-bottom: 12px; font-size: 14px;">すでにアカウントをお持ちの方（機種変など）</div>

  <label style="font-size: 11px; color: #aaa;">メールアドレス</label>
  <input type="email" id="login-email" placeholder="example@email.com">

  <label style="font-size: 11px; color: #aaa;">パスワード</label>
  <input type="password" id="login-password" placeholder="パスワードを入力">

  <button class="btn-primary" onclick="handleLogin()">ログインして引き継ぐ</button>
</div>

<div class="divider">または</div>

<!-- 【下側】新規ユーザー向け：はじめての方エリア -->
<div class="card">
  <div style="font-weight: bold; margin-bottom: 8px; font-size: 14px;">はじめてご利用の方</div>
  <p style="font-size: 11px; color: #888; margin-bottom: 12px; line-height: 1.4;">
    面倒な登録なしですぐに始められます。後から設定画面でメールアドレスを登録することも可能です。
  </p>
  <button class="btn-secondary" onclick="handleNewUser()">新規スタートする</button>
</div>

</body>
</html>
