<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>陸上スケジュール登録・編集</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
    }

    /* 戻るボタン */
    .back-btn {
      display: inline-flex;
      align-items: center;
      background: transparent;
      border: 1px solid #00ff88;
      color: #00ff88;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
    }

    /* タイトル */
    .page-title {
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      color: #00ff88;
    }

    /* フォームカード */
    .form-card {
      background-color: #1c1c1e;
      border: 1px solid #2c2c2e;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .section-label {
      font-size: 13px;
      font-weight: bold;
      color: #00ff88;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      color: #aaa;
      margin-bottom: 6px;
    }

    .form-group label .required {
      color: #ff453a;
      margin-left: 4px;
    }

    .form-control {
      width: 100%;
      background-color: #2c2c2e;
      border: 1px solid #3a3a3c;
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }

    .form-control:focus {
      outline: none;
      border-color: #00ff88;
    }

    /* 2カラムレイアウト（日付と時間） */
    .row-2 {
      display: flex;
      gap: 12px;
    }
    .row-2 .form-group {
      flex: 1;
    }

    /* チェックボックス（試合用） */
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #ff453a;
      cursor: pointer;
    }

    /* 出場種目セクション */
    .events-section {
      margin-top: 16px;
      margin-bottom: 16px;
      display: none;
      background: #161618;
      border: 1px solid #2c2c2e;
      border-radius: 10px;
      padding: 14px;
    }

    .events-subtitle {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 10px;
    }

    .events-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .event-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #2c2c2e;
      border: 1px solid #3a3a3c;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      cursor: pointer;
    }

    .event-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #ff453a;
    }

    /* 保存ボタン */
    .save-btn {
      width: 100%;
      background-color: #00ff88;
      color: #000000;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 4px 12px rgba(0, 255, 136, 0.2);
    }

    .save-btn:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <!-- カレンダーへ戻るボタン -->
  <button type="button" class="back-btn" onclick="goBackToCalendar()">
    ◀ カレンダーへ戻る
  </button>

  <!-- タイトル -->
  <div class="page-title">
    📅 陸上スケジュール登録・編集
  </div>

  <!-- フォームコンテナ -->
  <div class="form-card">
    <div class="section-label">予定の基本情報</div>

    <!-- 予定名 -->
    <div class="form-group">
      <label>予定名 (大会・練習・ミーティング等)<span class="required">※必須</span></label>
      <input type="text" id="sched-name" class="form-control" placeholder="例: 〇〇選手権大会 / 坂道ダッシュ">
    </div>

    <!-- 試合フラグ -->
    <label class="checkbox-group">
      <input type="checkbox" id="sched-is-match" onchange="toggleEventsSection()">
      <span>🔥 試合</span>
    </label>

    <!-- 出場種目選択グリッド（試合チェック時のみ表示） -->
    <div id="events-section-container" class="events-section">
      <div class="events-subtitle">出場種目を選択 (複数選択可)</div>
      <div class="events-grid">
        <label class="event-item"><input type="checkbox" name="sched-event" value="100m"> 100m</label>
        <label class="event-item"><input type="checkbox" name="sched-event" value="200m"> 200m</label>
        <label class="event-item"><input type="checkbox" name="sched-event" value="400m"> 400m</label>
        <label class="event-item"><input type="checkbox" name="sched-event" value="800m"> 800m</label>
        <label class="event-item"><input type="checkbox" name="sched-event" value="1500m"> 1500m</label>
        <label class="event-item"><input type="checkbox" name="sched-event" value="走幅跳"> 走幅跳</label>
        <label class="event-item"><input type="checkbox" name="sched-event" value="三段跳"> 三段跳</label>
        <label class="event-item"><input type="checkbox" name="sched-event" value="走高跳"> 走高跳</label>
        <label class="event-item"><input type="checkbox" name="sched-event" value="やり投げ"> やり投げ</label>
        <label class="event-item"><input type="checkbox" name="sched-event" value="砲丸投げ"> 砲丸投げ</label>
        <label class="event-item"><input type="checkbox" name="sched-event" value="円盤投"> 円盤投</label>
        <label class="event-item"><input type="checkbox" name="sched-event" value="4×100mR"> 4×100mR</label>
        <label class="event-item"><input type="checkbox" name="sched-event" value="4×400mR"> 4×400mR</label>
      </div>
    </div>

    <!-- 日付と時間 -->
    <div class="row-2">
      <div class="form-group">
        <label>日付<span class="required">※必須</span></label>
        <input type="date" id="sched-date" class="form-control">
      </div>
      <div class="form-group">
        <label>時間</label>
        <input type="time" id="sched-time" class="form-control">
      </div>
    </div>

    <!-- 場所 -->
    <div class="form-group">
      <label>場所</label>
      <input type="text" id="sched-place" class="form-control" placeholder="例: ヤンマースタジアム長居">
    </div>

    <!-- メモ・内容 -->
    <div class="form-group" style="margin-bottom: 0;">
      <label>メモ・内容</label>
      <textarea id="sched-memo" class="form-control" rows="3" placeholder="目標や留意事項など"></textarea>
    </div>
  </div>

  <!-- 保存ボタン (type="button" を明記してリロードを完全に阻止) -->
  <button type="button" class="save-btn" onclick="saveSchedule()">
    【スケジュールを保存する】
  </button>

  <script>
    // 試合チェックボックス連動表示切り替え
    function toggleEventsSection() {
      const isMatch = document.getElementById('sched-is-match').checked;
      const container = document.getElementById('events-section-container');
      container.style.display = isMatch ? 'block' : 'none';
    }

    // ページ読み込み時にURLパラメータやLocalStorageからデータ復元
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const dateParam = urlParams.get('date');
      
      const targetDate = dateParam || new Date().toISOString().split('T')[0];
      document.getElementById('sched-date').value = targetDate;

      const storageKey = `track_log_${targetDate}`;
      const savedData = localStorage.getItem(storageKey);
      if (savedData) {
        try {
          const parsed = JSON.parse(savedData);
          if (parsed['陸上スケジュール']) {
            const s = parsed['陸上スケジュール'];
            document.getElementById('sched-name').value = s.name || '';
            document.getElementById('sched-is-match').checked = !!s.isMatch;
            toggleEventsSection();

            if (s.events && Array.isArray(s.events)) {
              document.querySelectorAll('input[name="sched-event"]').forEach(cb => {
                cb.checked = s.events.includes(cb.value);
              });
            }

            document.getElementById('sched-time').value = s.time || '';
            document.getElementById('sched-place').value = s.place || '';
            document.getElementById('sched-memo').value = s.memo || '';
          }
        } catch (e) {
          console.error('データ読み込みエラー', e);
        }
      }
    });

    // 確実にグローバルへ紐付ける保存処理
    window.saveSchedule = function() {
      try {
        const nameInput = document.getElementById('sched-name');
        const dateInput = document.getElementById('sched-date');

        if (!nameInput || !dateInput) {
          alert('フォーム要素が見つかりません。');
          return;
        }

        const name = nameInput.value.trim();
        const date = dateInput.value;

        if (!name) {
          alert('予定名を入力してください。');
          nameInput.focus();
          return;
        }
        if (!date) {
          alert('日付を選択してください。');
          dateInput.focus();
          return;
        }

        const storageKey = `track_log_${date}`;
        let dayData = {};
        const existing = localStorage.getItem(storageKey);
        if (existing) {
          try { dayData = JSON.parse(existing); } catch (e) { dayData = {}; }
        }

        const isMatch = document.getElementById('sched-is-match')?.checked || false;
        let selectedEvents = [];
        if (isMatch) {
          selectedEvents = Array.from(document.querySelectorAll('input[name="sched-event"]:checked')).map(cb => cb.value);
        }

        dayData['陸上スケジュール'] = {
          name: name,
          isMatch: isMatch,
          events: selectedEvents,
          date: date,
          time: document.getElementById('sched-time')?.value || '',
          place: document.getElementById('sched-place')?.value || '',
          memo: document.getElementById('sched-memo')?.value || ''
        };

        // ローカルストレージに保存
        localStorage.setItem(storageKey, JSON.stringify(dayData));

        // ボタンの見た目を一時的に変えて保存されたことを視覚的にわかりやすくする
        const saveBtn = document.querySelector('.save-btn');
        if (saveBtn) {
          saveBtn.style.backgroundColor = '#ffffff';
          saveBtn.style.color = '#000000';
          saveBtn.textContent = '✨ 保存完了！';
        }

        // 0.3秒後にカレンダーへ戻る
        setTimeout(() => {
          goBackToCalendar();
        }, 300);

      } catch (err) {
        console.error('保存処理エラー:', err);
        alert('保存中にエラーが発生しました: ' + err.message);
      }
    };

    function goBackToCalendar() {
      if (typeof showSubView === 'function') {
        showSubView('calendar');
      } else {
        history.back();
      }
    }
  </script>
</body>
</html>
