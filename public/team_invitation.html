<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>参加中のチーム</title>
  <style>
    body { background: #121212; color: #fff; font-family: sans-serif; padding: 12px; margin: 0; padding-bottom: 40px; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid #333; }
    
    .green { color: #00e5ff; }
    .danger { color: #ff4757; }
    
    .team-card { background: #252525; padding: 14px; border-radius: 10px; border-left: 4px solid #00e5ff; margin-bottom: 12px; }
    .btn-share { background: #00e5ff; color: #121212; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; margin: 10px 0; }
    .btn-unlink { background: transparent; color: #ff4757; border: 1px solid #ff4757; width: 100%; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; }
    
    .back-link { 
      font-size: 11px; 
      color: #00e5ff; 
      background: #1e1e1e; 
      border: 1px solid #00e5ff; 
      padding: 6px 14px; 
      border-radius: 8px; 
      text-decoration: none; 
      display: inline-flex; 
      align-items: center; 
      margin-bottom: 14px; 
      cursor: pointer; 
      font-weight: bold;
    }
    .back-link:hover {
      background: #252525;
    }

    .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 999; }
    .modal-content { background: #252525; padding: 20px; border-radius: 16px; text-align: center; max-width: 280px; border: 1px solid #444; }
    .qr-placeholder { background: #fff; width: 180px; height: 180px; margin: 12px auto; padding: 10px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; }
  </style>

  <!-- Firebase v11.1.0 SDK 読み込み -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAb2u6KAqvesS0ruc8npdwZlDiWUpQywQQ",
      authDomain: "tf-log.firebaseapp.com",
      projectId: "tf-log",
      storageBucket: "tf-log.firebasestorage.app",
      messagingSenderId: "469720285191",
      appId: "1:469720285191:web:302849209f97b010b62aa2",
      measurementId: "G-NE1RQKENVR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let activeTeamId = null;

    window.openQRModal = function() {
      document.getElementById('qr-modal').style.display = 'flex';
    };
    window.closeQRModal = function() {
      document.getElementById('qr-modal').style.display = 'none';
    };

    window.onload = async function() {
      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          try {
            await signInAnonymously(auth);
          } catch (e) {
            console.error("匿名ログイン失敗:", e);
          }
          return;
        }

        await loadTeamInfo(user.uid);
      });
    };

    async function loadTeamInfo(userId) {
      const container = document.getElementById('team-container');

      try {
        // 1. まず users コレクションから自分の所属 teamId を取得
        const userDocRef = doc(db, "users", userId);
        const userDocSnap = await getDoc(userDocRef);

        if (!userDocSnap.exists() || !userDocSnap.data().teamId) {
          container.innerHTML = `
            <div style="text-align:center; padding: 30px 10px; color: #aaa;">
              <div style="margin-bottom: 12px; font-size: 14px;">参加中のチームがありません</div>
              <a href="team_entry.html" style="background: #00e5ff; color: #121212; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px; display: inline-block;">チームを作成・参加する</a>
            </div>
          `;
          return;
        }

        activeTeamId = userDocSnap.data().teamId;
        localStorage.setItem('team_id', activeTeamId); // ローカル側も同期

        // 2. 所属している teamId をもとに teams コレクションを取得
        const teamRef = doc(db, "teams", activeTeamId);
        const teamSnap = await getDoc(teamRef);

        if (!teamSnap.exists()) {
          container.innerHTML = `
            <div style="text-align:center; padding: 30px 10px; color: #aaa;">
              <div style="margin-bottom: 12px; font-size: 14px;">チーム情報が見つからないか、削除された可能性があります。</div>
              <a href="team_entry.html" style="background: #00e5ff; color: #121212; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px; display: inline-block;">再参加・新規作成へ</a>
            </div>
          `;
          return;
        }

        const data = teamSnap.data();
        const fullTeamName = data.partName ? `${data.teamName} ${data.partName}` : data.teamName;
        const memberCount = Array.isArray(data.members) ? data.members.length : 1;
        const ownerName = data.owner || '未設定';

        document.getElementById('team-name-text').textContent = `🏃‍♂️ ${fullTeamName}`;
        document.getElementById('team-meta-text').textContent = `メンバー: ${memberCount}名 | リーダー: ${ownerName}`;
        document.getElementById('team-code-text').textContent = activeTeamId;
        document.getElementById('modal-code-text').textContent = `コード: ${activeTeamId}`;

        // ローカルストレージにも最新の名前を保存
        localStorage.setItem('team_name', data.teamName || '');
        if(data.partName) localStorage.setItem('team_part_name', data.partName);

      } catch (err) {
        console.error("チーム情報取得エラー:", err);
        container.innerHTML = `<div style="text-align:center; color:#ff4757; padding:20px;">チーム情報の取得に失敗しました。</div>`;
      }
    }

    window.leaveTeam = async function() {
      if (!confirm('本当にこのチームを脱退しますか？')) return;

      const user = auth.currentUser;
      if (!user || !activeTeamId) return;

      try {
        // 1. teams コレクションの members 配列から自分を削除
        const teamRef = doc(db, "teams", activeTeamId);
        const teamSnap = await getDoc(teamRef);
        if (teamSnap.exists()) {
          const data = teamSnap.data();
          const currentMembers = Array.isArray(data.members) ? data.members : [];
          const filteredMembers = currentMembers.filter(m => m.userId !== user.uid);
          await updateDoc(teamRef, { members: filteredMembers });
        }

        // 2. users コレクションの teamId や関連情報をクリア
        const userRef = doc(db, "users", user.uid);
        await updateDoc(userRef, {
          teamId: "",
          userRole: ""
        });

      } catch (e) {
        console.error("Firestore脱退処理エラー:", e);
      }

      // ローカルストレージのチーム関連情報もクリア
      localStorage.removeItem('team_name');
      localStorage.setItem('base_team_name', '');
      localStorage.setItem('team_part_name', '');
      localStorage.removeItem('team_id');
      localStorage.removeItem('user_role');
      localStorage.removeItem('team_members_list');

      alert('チームを脱退しました。');
      location.reload();
    };
  </script>
</head>
<body>

<a class="back-link" href="team_top.html">トップへ戻る</a>

<h3 class="green" style="text-align:center; margin-top:0;">👥 参加中のチーム</h3>

<div class="card" id="team-container">
  <div class="team-card">
    <div style="font-weight:bold; font-size:15px;" id="team-name-text">読み込み中...</div>
    <div style="font-size:11px; color:#aaa; margin-top:2px;" id="team-meta-text">メンバー: -名 | リーダー: -</div>
    
    <div style="background:#1e1e1e; padding:8px 12px; border-radius:6px; margin-top:10px; display:flex; justify-content:space-between; align-items:center;">
      <span style="font-size:12px; color:#aaa;">チームコード:</span>
      <strong style="font-size:15px; color:#00e5ff; letter-spacing:1px;" id="team-code-text">-</strong>
    </div>

    <button class="btn-share" onclick="openQRModal()">
      <span>📲 チーム招待QR・コードを表示する</span>
    </button>
  </div>

  <button class="btn-unlink" onclick="leaveTeam()">このチームを脱退する</button>
</div>

<div class="modal" id="qr-modal">
  <div class="modal-content">
    <div style="font-weight:bold; font-size:14px; margin-bottom:4px;">メンバー招待用QR</div>
    <div style="font-size:11px; color:#aaa;">後輩や新入生にこの画面を見せて読み込んでもらいましょう！</div>
    
    <div class="qr-placeholder">
      <div style="text-align:center;">
        <div style="font-size:40px;">📱</div>
        <div style="font-size:12px; color:#333;">[ QR CODE ]</div>
      </div>
    </div>

    <div style="font-size:16px; font-weight:bold; color:#00e5ff; margin-bottom:12px;" id="modal-code-text">コード: -</div>

    <button style="background:#444; color:#fff; border:none; padding:8px 20px; border-radius:20px; font-size:12px; cursor:pointer;" onclick="closeQRModal()">閉じる</button>
  </div>
</div>

</body>
</html>
