<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カレンダー＆予定管理</title>
  
  <!-- Firebase SDK の読み込み -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { background: #121212; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 12px; margin: 0; padding-bottom: 40px; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid #333; }
    .green { color: #00e676; }
    .cyan { color: #00d2d3; }
    h2, h3 { color: #00e676; text-align: center; margin: 0 0 16px; font-size: 18px; }
    
    .back-btn-container { margin-bottom: 12px; }
    .back-btn { display: inline-flex; align-items: center; gap: 4px; background: #1e1e1e; color: #00e676; border: 1px solid #00e676; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; text-decoration: none; cursor: pointer; }
    .back-btn:hover { background: #00e676; color: #121212; }

    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .calendar-header button { background: #262626; color: #00e676; border: 1px solid #444; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    
    .dow-cell { text-align: center; font-size: 11px; color: #888; padding-bottom: 6px; }
    .dow-cell:nth-child(6) { color: #528aff; } 
    .dow-cell:nth-child(7) { color: #ff5252; } 

    .day-cell { background: #222222; border: 1px solid #333333; border-radius: 8px; min-height: 58px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; cursor: pointer; color: #fff; font-size: 13px; transition: border-color 0.2s; }
    .day-cell.empty { background: transparent; border: none; cursor: default; }
    .day-cell.selected { border: 2px solid #00e676; background: #1a2e22; }
    .day-num { font-weight: bold; }
    .day-dots { display: flex; gap: 3px; justify-content: center; margin-top: 4px; min-height: 6px; }
    .dot { width: 4px; height: 4px; border-radius: 50%; }
    
    .dot-log { background: #00e676; }
    .dot-schedule { background: #528aff; }
    .dot-match-schedule { background: #ffa502; } 
    .dot-match-event { background: #ff5252; }    
    .dot-match { background: #d4af37; }          
    .dot-vital { background: #00d2d3; }          
    .dot-test { background: #e040fb; }
    
    .data-card { background: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid #333; }
    .empty-msg { color: #888; text-align: center; font-size: 13px; padding: 16px 0; }
    
    .item-block { background: #262626; border-left: 3px solid #00e676; padding: 12px 14px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; cursor: pointer; border-top: 1px solid #333; border-right: 1px solid #333; border-bottom: 1px solid #333; }
    .item-block.schedule { border-left-color: #528aff; }
    .item-block.match-event { border-left-color: #ffa502; } 
    .item-block.match { border-left-color: #d4af37; }
    .item-block.vital { border-left-color: #00d2d3; }
    .item-block.test { border-left-color: #e040fb; }
    .item-block.injury { border-left-color: #ff5252; }

    .detail-table { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; font-size: 12px; }
    .detail-row { display: flex; justify-content: space-between; background: #1e1e1e; padding: 6px 8px; border-radius: 4px; border: 1px solid #333; }
    .detail-label-item { color: #aaa; }
    .detail-val-item { color: #fff; font-weight: bold; text-align: right; }

    .action-panel { background: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid #333; }
    .action-panel-title { font-size: 13px; color: #00e676; margin-bottom: 12px; font-weight: bold; }
    .action-buttons-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    
    .action-btn { display: flex; align-items: center; justify-content: center; gap: 6px; background: #262626; color: #fff; border: 1px solid #444; border-left: 4px solid #528aff; padding: 12px 10px; border-radius: 8px; font-size: 13px; font-weight: bold; text-decoration: none; cursor: pointer; text-align: center; }
    .action-btn:hover { border-color: #00e676; }
    .action-btn.full-width { grid-column: span 2; }
  </style>
</head>
<body>

  <div class="back-btn-container">
    <a href="personal.html" id="back-to-top" class="back-btn">◀ トップへ戻る</a>
  </div>

  <h2 style="display:flex; align-items:center; justify-content:center; gap:6px;">📅 カレンダー＆予定管理</h2>

  <div class="card">
    <div class="calendar-header">
      <button onclick="changeMonth(-1)">◀ 前月</button>
      <span id="calendar-title" style="font-weight:bold; font-size:16px; color:#fff;"></span>
      <button onclick="changeMonth(1)">翌月 ▶</button>
    </div>

    <div class="calendar-grid" id="dow-grid">
      <div class="dow-cell">月</div>
      <div class="dow-cell">火</div>
      <div class="dow-cell">水</div>
      <div class="dow-cell">木</div>
      <div class="dow-cell">金</div>
      <div class="dow-cell">土</div>
      <div class="dow-cell">日</div>
    </div>

    <div class="calendar-grid" id="calendar-body" style="margin-top: 6px;"></div>
  </div>

  <div class="data-card">
    <div id="selected-date-header" style="font-weight:bold; font-size:14px; color:#00e676; margin-bottom:12px;">📌 選択日の記録・予定</div>
    <div id="day-data-list">
      <div class="empty-msg">読み込み中...</div>
    </div>
  </div>

  <div class="action-panel">
    <div class="action-panel-title" id="action-panel-label">＋ 新しい項目を追加・編集</div>
    <div class="action-buttons-grid">
      <a href="schedule.html" id="link-schedule" class="action-btn" style="border-left-color: #528aff;">📅 予定を追加</a>
      <a href="log.html" id="link-log" class="action-btn" style="border-left-color: #00e676;">🏃‍♂️ 練習日誌を追加</a>
      <a href="vital.html" id="link-vital" class="action-btn" style="border-left-color: #00d2d3;">⚖ バイタルを追加</a>
      <a href="match.html" id="link-match" class="action-btn" style="border-left-color: #d4af37;">🏆 試合結果を追加</a>
      <a href="test.html" id="link-test" class="action-btn full-width" style="border-left-color: #e040fb;">📈 コントロールテストを追加</a>
    </div>
  </div>

  <script>
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();
    let currentUserId = null;
    
    const urlParams = new URLSearchParams(window.location.search);
    let userId = urlParams.get('userId') || localStorage.getItem('track_current_user_id') || 'default_user';

    if (!urlParams.get('userId') && userId !== 'default_user') {
      urlParams.set('userId', userId);
      history.replaceState(null, '', `${window.location.pathname}?${urlParams.toString()}${window.location.hash}`);
    }

    const initialDateParam = urlParams.get('date');
    let selectedDateStr = initialDateParam || new Date().toISOString().split('T')[0];

    if (initialDateParam) {
      const p = initialDateParam.split('-');
      if (p.length === 3) {
        currentYear = parseInt(p[0], 10);
        currentMonth = parseInt(p[1], 10) - 1;
      }
    }

    const fatigueTexts = { 1: "1：疲労なし", 2: "2：軽く疲労を感じる", 3: "3：疲労を感じる", 4: "4：疲労を強く感じる", 5: "5：練習不可" };
    const painDescriptions = { 1: '1・違和感', 2: '2・弱い', 3: '3・中程度', 4: '4・強い', 5: '5・非常に強い' };

    const backBtn = document.getElementById('back-to-top');
    if (backBtn && userId !== 'default_user') {
      backBtn.href = `personal.html?userId=${encodeURIComponent(userId)}`;
    }

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUserId = user.uid;
        userId = user.uid;
      }
      await fetchMonthDataFromFirestore(currentYear, currentMonth, userId);
      renderCalendar(currentYear, currentMonth, userId);
      renderSelectedDayData(selectedDateStr, userId);
    });

    window.changeMonth = async function(delta) {
      currentMonth += delta;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      await fetchMonthDataFromFirestore(currentYear, currentMonth, userId);
      renderCalendar(currentYear, currentMonth, userId);
    };

    function updateActionLinks(dateStr, uid) {
      const query = uid ? `?date=${dateStr}&userId=${encodeURIComponent(uid)}` : `?date=${dateStr}`;
      document.getElementById('link-schedule').href = `schedule.html${query}`;
      document.getElementById('link-log').href = `log.html${query}`;
      document.getElementById('link-vital').href = `vital.html${query}`;
      document.getElementById('link-match').href = `match.html${query}`;
      document.getElementById('link-test').href = `test.html${query}`;
    }

    function getDayDataFromLocalStorage(uid, dateStr) {
      const storageKey = `track_log_${uid}_${dateStr}`;
      const savedDataStr = localStorage.getItem(storageKey);
      if (!savedDataStr || savedDataStr === '{}') return {};
      try {
        return JSON.parse(savedDataStr);
      } catch (e) {
        return {};
      }
    }

    async function fetchMonthDataFromFirestore(year, month, uid) {
      if (!uid || uid === 'default_user') return;
      try {
        const firstDayStr = `${year}-${String(month + 1).padStart(2, '0')}-01`;
        const lastDayObj = new Date(year, month + 1, 0);
        const lastDayStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(lastDayObj.getDate()).padStart(2, '0')}`;

        const snapshot = await db.collection('users').doc(uid).collection('track_logs')
          .where(firebase.firestore.FieldPath.documentId(), '>=', firstDayStr)
          .where(firebase.firestore.FieldPath.documentId(), '<=', lastDayStr)
          .get();

        snapshot.forEach(doc => {
          const dateKey = doc.id;
          const data = doc.data();
          const storageKey = `track_log_${uid}_${dateKey}`;
          localStorage.setItem(storageKey, JSON.stringify(data));
        });
      } catch (e) {
        console.error('月別データの同期に失敗しました:', e);
      }
    }

    function renderCalendar(year, month, uid) {
      const titleEl = document.getElementById('calendar-title');
      const bodyEl = document.getElementById('calendar-body');
      if (!titleEl || !bodyEl) return;

      titleEl.innerText = `${year}年 ${month + 1}月`;
      bodyEl.innerHTML = '';

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      
      let startDayOfWeek = firstDay.getDay() - 1;
      if (startDayOfWeek === -1) startDayOfWeek = 6;

      const totalDays = lastDay.getDate();

      for (let i = 0; i < startDayOfWeek; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-cell empty';
        bodyEl.appendChild(emptyCell);
      }

      for (let day = 1; day <= totalDays; day++) {
        const mStr = String(month + 1).padStart(2, '0');
        const dStr = String(day).padStart(2, '0');
        const dateStr = `${year}-${mStr}-${dStr}`;

        const parsed = getDayDataFromLocalStorage(uid, dateStr);
        let dotsHtml = '';
        
        if (Object.keys(parsed).length > 0) {
          if (parsed['陸上スケジュール']) {
            if (parsed['陸上スケジュール'].isMatch) {
              dotsHtml += `<span class="dot dot-match-schedule" title="試合予定"></span>`;
            } else {
              dotsHtml += `<span class="dot dot-schedule" title="予定"></span>`;
            }
          }
          if (parsed['練習日誌']) dotsHtml += `<span class="dot dot-log" title="練習日誌"></span>`;
          if (parsed['バイタル']) dotsHtml += `<span class="dot dot-vital" title="バイタル"></span>`;
          if (parsed['怪我・痛み']) dotsHtml += `<span class="dot dot-match-event" title="怪我・痛み"></span>`;
          if (parsed['試合結果']) dotsHtml += `<span class="dot dot-match" title="試合結果"></span>`;
          if (parsed['コントロールテスト']) dotsHtml += `<span class="dot dot-test" title="テスト"></span>`;
        }

        const cell = document.createElement('div');
        cell.className = `day-cell ${dateStr === selectedDateStr ? 'selected' : ''}`;
        cell.innerHTML = `<span class="day-num">${day}</span><div class="day-dots">${dotsHtml}</div>`;
        cell.onclick = async () => {
          selectedDateStr = dateStr;
          if (uid && uid !== 'default_user') {
            try {
              const doc = await db.collection('users').doc(uid).collection('track_logs').doc(dateStr).get();
              if (doc.exists) {
                localStorage.setItem(`track_log_${uid}_${dateStr}`, JSON.stringify(doc.data()));
              }
            } catch(e) {}
          }
          renderCalendar(currentYear, currentMonth, uid);
          renderSelectedDayData(selectedDateStr, uid);
        };
        bodyEl.appendChild(cell);
      }
    }

    function renderSelectedDayData(dateStr, uid) {
      document.getElementById('selected-date-header').innerText = `📌 ${dateStr} の記録・予定`;
      document.getElementById('action-panel-label').innerText = `＋ ${dateStr} に新しい項目を追加・編集`;

      updateActionLinks(dateStr, uid);

      const listEl = document.getElementById('day-data-list');
      listEl.innerHTML = '';

      const parsed = getDayDataFromLocalStorage(uid, dateStr);

      if (!parsed || Object.keys(parsed).length === 0) {
        listEl.innerHTML = `<div class="empty-msg">この日の登録データ・予定はありません</div>`;
        return;
      }

      try {
        let hasContent = false;
        const querySuffix = uid ? `&userId=${encodeURIComponent(uid)}` : '';
        
        // 1. 怪我・痛み
        if (parsed['怪我・痛み']) {
          hasContent = true;
          const injury = parsed['怪我・痛み'];
          const partName = injury.part || '部位未設定';
          const pNum = injury.painLevel || 3;
          const pText = painDescriptions[pNum] ? painDescriptions[pNum] : `${pNum} / 5`;
          const statusStr = injury.status || '治療中';

          listEl.innerHTML += `
            <div class="item-block injury" onclick="location.href='injury_add.html?date=${dateStr}${querySuffix}'">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <div style="font-weight:bold; color:#ff5252;">🩹 痛み・怪我の記録</div>
                <span style="font-size:11px; color:#ff5252; background:#222; padding:2px 6px; border-radius:4px;">${statusStr}</span>
              </div>
              <div class="detail-table">
                <div class="detail-row"><span class="detail-label-item">部位</span><span class="detail-val-item">${partName}</span></div>
                <div class="detail-row"><span class="detail-label-item">痛みレベル</span><span class="detail-val-item">${pText}</span></div>
                ${injury.memo ? `<div class="detail-row"><span class="detail-label-item">メモ</span><span class="detail-val-item">${injury.memo}</span></div>` : ''}
              </div>
              <div style="color:#888; font-size:11px; margin-top:6px; text-align:right;">（タップして編集）</div>
            </div>
          `;
        }

        // 2. 陸上スケジュール / 試合予定
        if (parsed['陸上スケジュール']) {
          hasContent = true;
          const s = parsed['陸上スケジュール'];
          const eventsStr = s.events && s.events.length > 0 ? s.events.join(', ') : 'なし';
          const titleText = s.isMatch ? `🔥 試合予定: ${s.name}` : `📅 予定: ${s.name}`;
          const blockClass = s.isMatch ? 'item-block match-event' : 'item-block schedule';
          
          let rowsHtml = '';
          if (s.time) rowsHtml += `<div class="detail-row"><span class="detail-label-item">時間</span><span class="detail-val-item">${s.time}</span></div>`;
          if (s.place) rowsHtml += `<div class="detail-row"><span class="detail-label-item">場所</span><span class="detail-val-item">${s.place}</span></div>`;
          if (s.isMatch) rowsHtml += `<div class="detail-row"><span class="detail-label-item">出場種目</span><span class="detail-val-item">${eventsStr}</span></div>`;
          if (s.memo) rowsHtml += `<div class="detail-row"><span class="detail-label-item">メモ</span><span class="detail-val-item">${s.memo}</span></div>`;

          listEl.innerHTML += `
            <div class="${blockClass}" onclick="location.href='schedule.html?date=${dateStr}${querySuffix}'">
              <div style="font-weight:bold; ${s.isMatch ? 'color:#ffa502;' : 'color:#528aff;'} margin-bottom:6px;">${titleText}</div>
              <div class="detail-table">${rowsHtml}</div>
              <div style="color:#888; font-size:11px; margin-top:6px; text-align:right;">（タップして編集）</div>
            </div>
          `;
        }

        // 3. 試合結果
        if (parsed['試合結果']) {
          hasContent = true;
          const m = parsed['試合結果'];
          const matchName = m.name || '大会名未設定';
          
          let eventDetailsHtml = '';
          if (m.events && m.events.length > 0) {
            m.events.forEach(ev => {
              let recStr = '-';
              if (ev.rounds && ev.rounds.length > 0) {
                recStr = ev.rounds.map(r => r.time).filter(Boolean).join(' / ');
              } else if (ev.trials && ev.trials.length > 0) {
                recStr = ev.trials.filter(Boolean).join(', ');
              } else if (ev.simpleRecord) {
                recStr = ev.simpleRecord;
              } else if (ev.time) {
                recStr = ev.time;
              }
              eventDetailsHtml += `<div class="detail-row"><span class="detail-label-item">${ev.type || '種目'}</span><span class="detail-val-item">${recStr}</span></div>`;
            });
          } else {
            eventDetailsHtml = `<div class="detail-row"><span class="detail-label-item">出場種目</span><span class="detail-val-item">なし</span></div>`;
          }

          let matchRowsHtml = '';
          if (m.place) matchRowsHtml += `<div class="detail-row"><span class="detail-label-item">会場</span><span class="detail-val-item">${m.place}</span></div>`;
          if (m.weather) matchRowsHtml += `<div class="detail-row"><span class="detail-label-item">天候</span><span class="detail-val-item">${m.weather}</span></div>`;

          listEl.innerHTML += `
            <div class="item-block match" onclick="location.href='match.html?date=${dateStr}${querySuffix}'">
              <div style="font-weight:bold; color:#d4af37; margin-bottom:6px;">🏆 試合結果: ${matchName}</div>
              <div class="detail-table">
                ${matchRowsHtml}
                ${eventDetailsHtml}
              </div>
              <div style="color:#888; font-size:11px; margin-top:6px; text-align:right;">（タップして編集）</div>
            </div>
          `;
        }

        // 4. 練習日誌
        if (parsed['練習日誌']) {
          hasContent = true;
          const logData = parsed['練習日誌'];
          const rpeVal = logData.rpe ? `RPE ${logData.rpe}` : 'RPE未設定';
          
          let menuRowsHtml = '';
          if (logData.menus && logData.menus.length > 0) {
            logData.menus.forEach(menu => {
              let detailText = menu.menuName || 'メニュー';
              if (menu.reps && menu.reps.length > 0) {
                detailText += ` (${menu.reps.join(', ')})`;
              } else if (menu.sets && menu.sets.length > 0) {
                let setSummary = menu.sets.map(s => `${s.weight || 0}kg×${s.repsCount !== undefined ? s.repsCount : (s.rep || s.reps || 0)}rep`).join(', ');
                detailText += ` [${setSummary}]`;
              }
              menuRowsHtml += `<div class="detail-row"><span class="detail-label-item">${menu.areaType || '練習'}</span><span class="detail-val-item">${detailText}</span></div>`;
            });
          } else {
            menuRowsHtml = `<div class="detail-row"><span class="detail-label-item">メニュー</span><span class="detail-val-item">登録なし</span></div>`;
          }

          listEl.innerHTML += `
            <div class="item-block" onclick="location.href='log.html?date=${dateStr}${querySuffix}'">
              <div style="font-weight:bold; color:#00e676; margin-bottom:6px;">🏃‍♂️ 練習日誌 (${rpeVal})</div>
              <div class="detail-table">
                ${menuRowsHtml}
                ${logData.memo ? `<div class="detail-row"><span class="detail-label-item">メモ</span><span class="detail-val-item">${logData.memo}</span></div>` : ''}
              </div>
              <div style="color:#888; font-size:11px; margin-top:6px; text-align:right;">（タップして編集）</div>
            </div>
          `;
        }

        // 5. バイタル
        if (parsed['バイタル']) {
          hasContent = true;
          const v = parsed['バイタル'];
          let rowsHtml = '';
          if (v.fatigue !== undefined && v.fatigue !== '') {
            rowsHtml += `<div class="detail-row"><span class="detail-label-item">⚡ 疲労度</span><span class="detail-val-item">${fatigueTexts[v.fatigue] || v.fatigue}</span></div>`;
          }
          if (v.sleep !== undefined && v.sleep !== '') {
            rowsHtml += `<div class="detail-row"><span class="detail-label-item">😴 睡眠時間</span><span class="detail-val-item">${v.sleep} 時間</span></div>`;
          }
          if ((v.weight !== undefined && v.weight !== '') || (v.fat !== undefined && v.fat !== '')) {
            rowsHtml += `<div class="detail-row"><span class="detail-label-item">⚖️ 体重 / 体脂肪率</span><span class="detail-val-item">${v.weight || '-'}kg / ${v.fat || '-'}%</span></div>`;
          }
          if (v.memo) {
            rowsHtml += `<div class="detail-row"><span class="detail-label-item">メモ</span><span class="detail-val-item">${v.memo}</span></div>`;
          }
          listEl.innerHTML += `
            <div class="item-block vital" onclick="location.href='vital.html?date=${dateStr}${querySuffix}'">
              <div style="font-weight:bold; color:#00d2d3; margin-bottom:6px;">⚖️ バイタル</div>
              <div class="detail-table">${rowsHtml}</div>
              <div style="color:#888; font-size:11px; margin-top:6px; text-align:right;">（タップして編集）</div>
            </div>
          `;
        }

        if (!hasContent) {
          listEl.innerHTML = `<div class="empty-msg">この日の登録データ・予定はありません</div>`;
        }
      } catch(e) {
        listEl.innerHTML = `<div class="empty-msg">データの読み込みに失敗しました</div>`;
      }
    }
  </script>
</body>
</html>
