<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MATCH RESULT LOG</title>
  
  <!-- Firebase SDK の読み込み (コンパット版) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <!-- 共通のFirebase設定ファイル -->
  <script src="firebase-config.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { background: #121212; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 12px; margin: 0; padding-bottom: 90px; width: 100%; max-width: 100%; overflow-x: hidden; }
    
    .back-btn-container { margin-bottom: 12px; }
    .back-btn { display: inline-flex; align-items: center; gap: 4px; background: #1e1e1e; color: #00e676; border: 1px solid #00e676; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; text-decoration: none; cursor: pointer; }
    .back-btn:hover { background: #00e676; color: #121212; }

    .card { background: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #333; width: 100%; }
    .section-title { font-size: 14px; font-weight: bold; margin-bottom: 10px; color: #fff; }
    
    input[type="date"] {
      -webkit-appearance: none;
      appearance: none;
      background-color: #222;
      color: #fff;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      width: 100%;
      height: 46px;
      box-sizing: border-box;
      outline: none;
      color-scheme: dark;
    }
    input[type="date"]:focus { border-color: #00e676; }

    .input-group { margin-bottom: 12px; }
    .input-label { font-size: 12px; color: #aaa; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    .required-tag { color: #ff5252; font-size: 11px; font-weight: bold; }
    
    input[type="text"], input[type="number"], select { background: #222; border: 1px solid #333; border-radius: 10px; padding: 12px; color: #fff; font-size: 15px; width: 100%; max-width: 100%; height: 46px; outline: none; box-sizing: border-box; }
    input[type="text"]:focus, input[type="number"]:focus, select:focus { border-color: #00e676; }

    /* スライダー用スタイル */
    .full-width-box { background: #222; border: 1px solid #333; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
    .slider-container { display: flex; flex-direction: column; gap: 8px; }
    .slider-range { width: 100%; accent-color: #00e676; cursor: pointer; height: 6px; background: #444; border-radius: 3px; outline: none; }
    .slider-info { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .fatigue-text { font-weight: bold; color: #00e676; }

    .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3col { display: grid; grid-template-columns: 1.2fr 1fr 0.8fr; gap: 6px; align-items: center; }
    .grid-3col .input-group { margin-bottom: 0 !important; }

    .event-block { background: #222; border: 1px solid #333; border-radius: 10px; padding: 14px; margin-bottom: 14px; position: relative; border-left: 3px solid #00e676; width: 100%; }
    .event-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; font-weight: bold; color: #00e676; }
    .delete-btn { background: transparent; border: none; color: #ff5252; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 2px; }

    .round-box { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .round-title { font-size: 12px; color: #00e676; font-weight: bold; margin-bottom: 8px; }

    .trial-grid-wind { display: grid; grid-template-columns: 55px 1fr 1fr 36px 36px; gap: 6px; align-items: center; margin-bottom: 6px; font-size: 12px; color: #ccc; }
    .trial-grid-wind input { background: #222; border: 1px solid #444; border-radius: 6px; padding: 8px; color: #fff; font-size: 14px; text-align: center; width: 100%; height: 38px; outline: none; box-sizing: border-box; }
    .trial-grid-wind input:focus { border-color: #00e676; }

    .trial-grid-throw { display: grid; grid-template-columns: 55px 1fr 36px 36px; gap: 6px; align-items: center; margin-bottom: 6px; font-size: 12px; color: #ccc; }
    .trial-grid-throw input { background: #222; border: 1px solid #444; border-radius: 6px; padding: 8px; color: #fff; font-size: 14px; text-align: center; width: 100%; height: 38px; outline: none; box-sizing: border-box; }
    .trial-grid-throw input:focus { border-color: #00e676; }
    
    .height-trial-row { display: grid; grid-template-columns: 90px 1fr 1fr 1fr 36px; gap: 6px; align-items: center; margin-bottom: 8px; font-size: 12px; color: #ccc; }
    .height-trial-row input { background: #222; border: 1px solid #444; border-radius: 6px; padding: 8px; color: #fff; font-size: 14px; text-align: center; width: 100%; height: 38px; outline: none; box-sizing: border-box; }
    .height-trial-row input:focus { border-color: #00e676; }

    .t-btn { background: #262626; border: 1px solid #444; color: #aaa; border-radius: 6px; height: 38px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; }
    .t-btn.active-circle { background: #1a2e22; border-color: #00e676; color: #00e676; }
    .t-btn.active-x { background: #3a1a1a; border-color: #ff5252; color: #ff5252; }
    .t-btn.active-dash { background: #2a2a2a; border-color: #888; color: #ccc; }
    .t-btn-simple-dash.active-dash { background: #1a2e22; border-color: #00e676; color: #00e676; }
    .t-btn-simple-x.active-x { background: #3a1a1a; border-color: #ff5252; color: #ff5252; }

    .action-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
    .sub-action-btn { background: transparent; border: 1px solid #d4af37; color: #d4af37; border-radius: 8px; padding: 6px 10px; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .sub-action-btn:hover { background: rgba(212, 175, 55, 0.1); }

    .add-round-btn, .add-event-btn { background: transparent; border: 1px dashed #00e676; color: #00e676; border-radius: 10px; padding: 12px; width: 100%; font-weight: bold; font-size: 13px; cursor: pointer; text-align: center; box-sizing: border-box; }
    .add-round-btn:hover, .add-event-btn:hover { background: rgba(0, 230, 118, 0.05); }
    .add-round-btn { border-style: dashed; border-color: #444; color: #aaa; margin-top: 8px; font-size: 12px; padding: 8px; }
    .add-round-btn:hover { border-color: #00e676; color: #00e676; }

    .mode-tabs { display: flex; background: #161616; border: 1px solid #333; border-radius: 8px; padding: 3px; margin-bottom: 10px; }
    .mode-tab { flex: 1; text-align: center; padding: 6px; font-size: 12px; font-weight: bold; color: #888; cursor: pointer; border-radius: 6px; }
    .mode-tab.active { background: #2e2e2e; color: #00e676; border: 1px solid #444; }

    .submit-fixed { position: fixed; bottom: 0; left: 0; right: 0; background: #121212; padding: 12px; border-top: 1px solid #222; z-index: 100; display: flex; justify-content: center; box-sizing: border-box; }
    .submit-btn { background: #00e676; color: #121212; border: none; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: bold; width: 100%; max-width: 500px; cursor: pointer; text-align: center; box-shadow: 0 4px 12px rgba(0,230,118,0.3); }
    .submit-btn:hover { background: #00c853; }
  </style>

  <script>
    // Firebaseの初期化 & 認証・DBの準備 (コンパット版)
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUserId = null;

    // 認証状態の監視（未ログイン時もリダイレクトせず、ローカル用として動かす）
    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUserId = user.uid;
        window.currentUserId = user.uid;
      } else {
        currentUserId = null;
        window.currentUserId = null;
        console.warn("未ログイン状態です。ローカルストレージモードで動作します。");
      }
      
      if (typeof window.initApp === 'function') {
        window.initApp(currentUserId);
      }
    });
  </script>
</head>
<body>

  <div class="back-btn-container">
    <a href="calendar.html" id="back-link" class="back-btn">◀ カレンダーへ戻る</a>
  </div>

  <div class="card">
    <div class="input-group" style="margin-bottom:0;">
      <div class="input-label"><span>試合日 (タップして変更可能)</span></div>
      <input type="date" id="match-date-input">
    </div>
  </div>

  <div class="card">
    <div class="section-title">1. 試合基本情報</div>
    <div class="input-group">
      <div class="input-label"><span>大会名</span> <span class="required-tag">※必須</span></div>
      <input type="text" id="m-name" placeholder="">
    </div>
    <div class="grid-2col">
      <div class="input-group">
        <div class="input-label"><span>会場</span></div>
        <input type="text" id="m-place" placeholder="">
      </div>
      <div class="input-group">
        <div class="input-label"><span>天気</span></div>
        <select id="m-weather">
          <option value="晴れ">晴れ</option>
          <option value="曇り">曇り</option>
          <option value="雨">雨</option>
        </select>
      </div>
    </div>
    
    <!-- コンディション・調子スライダー -->
    <div class="full-width-box" style="margin-top: 4px; margin-bottom: 0;">
      <div class="input-label" style="margin-bottom: 6px;"><span>⚡ 当日の調子（コンディション）</span></div>
      <div class="slider-container">
        <input type="range" min="1" max="5" step="1" value="3" id="m-condition" class="slider-range" oninput="window.updateConditionLabel(this.value)">
        <div class="slider-info">
          <span style="color: #aaa; font-size: 12px;">レベル <span id="condition-val-num" style="color:#fff; font-weight:bold;">3</span></span>
          <span class="fatigue-text" id="condition-label-text">普通 (疲労を少し感じる)</span>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">2. 出場種目・記録</div>
    <div id="events-container"></div>
    <button class="add-event-btn" onclick="window.addEventBlock()">＋ 種目を追加する</button>
  </div>

  <div class="submit-fixed">
    <button class="submit-btn" onclick="window.saveMatchData()">【 試合記録を保存 → PB自動更新 】</button>
  </div>

  <script>
    const conditionTexts = {
      1: "かなり悪い (ヘトヘト、怪我・痛みがある)",
      2: "悪い (疲労をかなり感じる)",
      3: "普通 (疲労を少し感じる)",
      4: "良好 (疲労を感じない)",
      5: "絶好調 (疲労・不安がない)"
    };

    window.updateConditionLabel = function(val) {
      document.getElementById('condition-val-num').innerText = val;
      document.getElementById('condition-label-text').innerText = conditionTexts[val] || "";
    };

    const availableEvents = [
      '100m', '200m', '400m', '800m', '1500m',
      '走幅跳', '三段跳',
      '走高跳', '棒高跳',
      'やり投げ', '円盤投', '砲丸投',
      '4×100m', '4×400m'
    ];

    let eventList = [];

    function isHorizontalJump(type) { return ['走幅跳', '三段跳'].includes(type); }
    function isThrowEvent(type) { return ['やり投げ', '円盤投', '砲丸投'].includes(type); }
    function isVerticalJump(type) { return ['走高跳', '棒高跳'].includes(type); }
    function isTrackIndividualEvent(type) { return ['100m', '200m', '400m', '800m', '1500m'].includes(type); }
    function isMiddleLongDistance(type) { return ['800m', '1500m'].includes(type); }
    function hasWindField(type) { return ['100m', '200m'].includes(type); }

    function formatMeterInput(val) {
      if (!val) return '';
      let clean = val.trim();
      if (clean === '' || clean === '-' || clean === '×') return clean;
      if (clean.includes('m')) return clean;

      if (clean.includes('.')) {
        let parts = clean.split('.');
        let meters = parts[0];
        let cm = parts[1] || '00';
        if (cm.length === 1) cm += '0';
        return `${meters}m${cm}`;
      }
      return clean;
    }

    function formatMiddleLongTime(val) {
      if (!val) return '';
      let clean = val.trim();
      if (clean === '' || clean === '-') return clean;
      if (clean.includes(':')) return clean;

      if (clean.includes('.')) {
        let parts = clean.split('.');
        if (parts.length >= 3) {
          let min = parts[0];
          let sec = parts[1].padStart(2, '0');
          let msec = parts[2].padEnd(2, '0').slice(0, 2);
          return `${min}:${sec}.${msec}`;
        } else if (parts.length === 2) {
          let min = parts[0];
          let sec = parts[1].padEnd(2, '0').slice(0, 2);
          return `${min}:${sec}.00`;
        }
      }
      return clean;
    }

    function timeToSeconds(timeStr) {
      if (!timeStr) return 999999;
      let clean = timeStr.toString().trim();
      try {
        if (clean.includes(':')) {
          let parts = clean.split(':');
          let min = parseFloat(parts[0]) || 0;
          let secParts = parts[1].split('.');
          let sec = parseFloat(secParts[0]) || 0;
          let msec = secParts[1] ? parseFloat('0.' + secParts[1]) : 0;
          return min * 60 + sec + msec;
        } else {
          return parseFloat(clean) || 999999;
        }
      } catch (e) {
        return 999999;
      }
    }

    function meterToValue(meterStr) {
      if (!meterStr) return 0;
      let clean = meterStr.toString().trim();
      if (clean.includes('m')) {
        let parts = clean.split('m');
        let m = parseFloat(parts[0]) || 0;
        let cm = parseFloat(parts[1]) || 0;
        return m + cm / 100;
      }
      return parseFloat(clean) || 0;
    }

    function parseWindValue(windStr) {
      if (!windStr) return 0;
      let clean = windStr.toString().trim().replace('+', '');
      return parseFloat(clean) || 0;
    }

    window.renderEvents = function() {
      const eventsContainer = document.getElementById('events-container');
      eventsContainer.innerHTML = '';
      eventList.forEach((ev, idx) => {
        const block = document.createElement('div');
        block.className = 'event-block';
        
        let innerHtml = `
          <div class="event-header">
            <span>種目ブロック #${idx + 1}</span>
            <button class="delete-btn" onclick="window.removeEvent(${idx})">🗑 削除</button>
          </div>
          <div class="input-group">
            <div class="input-label"><span>種目を選択</span></div>
            <select onchange="window.updateEventType(${idx}, this.value)">
              ${availableEvents.map(e => `<option value="${e}" ${ev.type === e ? 'selected' : ''}>${e}</option>`).join('')}
            </select>
          </div>
        `;

        if (isVerticalJump(ev.type)) {
          const mode = ev.jumpMode || 'simple';
          innerHtml += `
            <div class="input-group" style="margin-bottom:8px;">
              <div class="input-label"><span>順位</span></div>
              <input type="text" value="${ev.place || ''}" oninput="window.updateEventField(${idx}, 'place', this.value)" placeholder="例: 1位">
            </div>
            <div class="mode-tabs">
              <div class="mode-tab ${mode === 'simple' ? 'active' : ''}" onclick="window.setJumpMode(${idx}, 'simple')">簡易入力モード</div>
              <div class="mode-tab ${mode === 'detail' ? 'active' : ''}" onclick="window.setJumpMode(${idx}, 'detail')">詳細入力モード</div>
            </div>
          `;
          if (mode === 'simple') {
            innerHtml += `
              <div class="input-group" style="margin-bottom:0;">
                <div class="input-label"><span>最高記録（高さ / 例: 1.90）</span></div>
                <input type="text" value="${ev.simpleRecord || ''}" oninput="window.updateEventField(${idx}, 'simpleRecord', this.value)" placeholder="1.90">
              </div>
            `;
          } else {
            innerHtml += `
              <div class="action-row" style="margin-bottom:8px;">
                <span style="font-size:12px; color:#aaa;">高さごとの試技記録</span>
                <button class="sub-action-btn" onclick="window.addHeightRow(${idx})">＋ 高さを追加</button>
              </div>
              <div style="display: grid; grid-template-columns: 90px 1fr 1fr 1fr 36px; gap: 6px; font-size: 11px; color: #00e676; font-weight: bold; margin-bottom: 4px; text-align: center;">
                <span>高さ(例:1.70)</span><span>1本目</span><span>2本目</span><span>3本目</span><span></span>
              </div>
              <div style="display:flex; flex-direction:column; gap:6px;">
            `;
            if (!ev.heightRows || ev.heightRows.length === 0) {
              ev.heightRows = [{ height: '', trials: ['', '', ''] }];
            }
            ev.heightRows.forEach((row, hIdx) => {
              innerHtml += `
                <div class="height-trial-row">
                  <input type="text" value="${row.height || ''}" oninput="window.updateHeightVal(${idx}, ${hIdx}, this.value)" placeholder="1.70">
              `;
              for (let t = 0; t < 3; t++) {
                const val = row.trials[t] || '';
                let btnClass = 't-btn';
                if (val === '○') btnClass += ' active-circle';
                else if (val === '×') btnClass += ' active-x';
                else if (val === '-') btnClass += ' active-dash';
                innerHtml += `<button type="button" class="${btnClass}" onclick="window.cycleHeightTrial(${idx}, ${hIdx}, ${t})">${val || (t+1)}</button>`;
              }
              innerHtml += `<button type="button" class="delete-btn" onclick="window.removeHeightRow(${idx}, ${hIdx})" style="justify-content:center;">🗑</button></div>`;
            });
            innerHtml += `</div>`;
          }
        } else if (isHorizontalJump(ev.type)) {
          innerHtml += `
            <div class="input-group" style="margin-bottom:10px;">
              <div class="input-label"><span>順位</span></div>
              <input type="text" value="${ev.place || ''}" oninput="window.updateEventField(${idx}, 'place', this.value)" placeholder="例: 1位">
            </div>
            <div class="action-row" style="margin-bottom:8px;">
              <span style="font-size:12px; color:#aaa;">試技記録入力 (例: 7.55) ※風速+2.1以上は参考記録</span>
              <button class="sub-action-btn" onclick="window.expandTrials(${idx})">🏆 決勝進出 (6本へ切替)</button>
            </div>
            <div style="display: grid; grid-template-columns: 55px 1fr 1fr 36px 36px; gap: 6px; font-size: 11px; color: #00e676; font-weight: bold; margin-bottom: 4px; text-align: center;">
              <span></span><span>記録</span><span>風速</span><span></span><span></span>
            </div>
            <div style="display:flex; flex-direction:column; gap:6px;">
          `;
          const limit = ev.trialsCount || 3;
          for (let i = 0; i < limit; i++) {
            innerHtml += `
              <div class="trial-grid-wind">
                <span>${i + 1}本目</span>
                <input type="text" value="${ev.trials[i] || ''}" oninput="window.updateTrial(${idx}, ${i}, this.value)" placeholder="7.55">
                <input type="text" value="${ev.trialWinds && ev.trialWinds[i] ? ev.trialWinds[i] : ''}" oninput="window.updateTrialWind(${idx}, ${i}, this.value)" placeholder="+1.2">
                <button type="button" class="t-btn t-btn-simple-dash ${ev.trialFlags && ev.trialFlags[i] === '-' ? 'active-dash' : ''}" onclick="window.setTrialFlag(${idx}, ${i}, '-')">-</button>
                <button type="button" class="t-btn t-btn-simple-x ${ev.trialFlags && ev.trialFlags[i] === '×' ? 'active-x' : ''}" onclick="window.setTrialFlag(${idx}, ${i}, '×')">×</button>
              </div>
            `;
          }
          innerHtml += `</div>`;
        } else if (isThrowEvent(ev.type)) {
          innerHtml += `
            <div class="input-group" style="margin-bottom:10px;">
              <div class="input-label"><span>順位</span></div>
              <input type="text" value="${ev.place || ''}" oninput="window.updateEventField(${idx}, 'place', this.value)" placeholder="例: 1位">
            </div>
            <div class="action-row" style="margin-bottom:8px;">
              <span style="font-size:12px; color:#aaa;">試技記録入力 (例: 55.20)</span>
              <button class="sub-action-btn" onclick="window.expandTrials(${idx})">🏆 決勝進出 (6本へ切替)</button>
            </div>
            <div style="display: grid; grid-template-columns: 55px 1fr 36px 36px; gap: 6px; font-size: 11px; color: #00e676; font-weight: bold; margin-bottom: 4px; text-align: center;">
              <span></span><span>記録</span><span></span><span></span>
            </div>
            <div style="display:flex; flex-direction:column; gap:6px;">
          `;
          const limit = ev.trialsCount || 3;
          for (let i = 0; i < limit; i++) {
            innerHtml += `
              <div class="trial-grid-throw">
                <span>${i + 1}本目</span>
                <input type="text" value="${ev.trials[i] || ''}" oninput="window.updateTrial(${idx}, ${i}, this.value)" placeholder="55.20">
                <button type="button" class="t-btn t-btn-simple-dash ${ev.trialFlags && ev.trialFlags[i] === '-' ? 'active-dash' : ''}" onclick="window.setTrialFlag(${idx}, ${i}, '-')">-</button>
                <button type="button" class="t-btn t-btn-simple-x ${ev.trialFlags && ev.trialFlags[i] === '×' ? 'active-x' : ''}" onclick="window.setTrialFlag(${idx}, ${i}, '×')">×</button>
              </div>
            `;
          }
          innerHtml += `</div>`;
        } else if (isTrackIndividualEvent(ev.type)) {
          const rounds = ev.rounds || [{ round: '予選', time: '', wind: '', place: '' }];
          const showWind = hasWindField(ev.type);
          const isMidLong = isMiddleLongDistance(ev.type);

          innerHtml += `<div id="rounds-container-${idx}">`;
          rounds.forEach((r, rIdx) => {
            innerHtml += `
              <div class="round-box" style="position: relative;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                  <div class="round-title" style="margin-bottom: 0;">ラウンド ${rIdx + 1} ${showWind ? '(※風速+2.1以上は参考)' : ''}</div>
                  ${rounds.length > 1 ? `<button type="button" class="delete-btn" onclick="window.removeRound(${idx},${rIdx})" style="font-size: 14px; font-weight: bold; background: #2a1a1a; border: 1px solid #ff5252; border-radius: 4px; width: 22px; height: 22px; justify-content: center;">×</button>` : ''}
                </div>
                <div class="input-group" style="margin-bottom:8px;">
                  <select onchange="window.updateRoundField(${idx}, ${rIdx}, 'round', this.value)">
                    <option value="予選" ${r.round === '予選' ? 'selected' : ''}>予選</option>
                    <option value="準決勝" ${r.round === '準決勝' ? 'selected' : ''}>準決勝</option>
                    <option value="決勝" ${r.round === '決勝' ? 'selected' : ''}>決勝</option>
                    <option value="タイムレース決勝" ${r.round === 'タイムレース決勝' ? 'selected' : ''}>タイムレース決勝</option>
                  </select>
                </div>
            `;
            if (showWind) {
              innerHtml += `
                <div class="grid-3col">
                  <div class="input-group">
                    <div class="input-label"><span>タイム</span></div>
                    <input type="text" value="${r.time || ''}" oninput="window.updateRoundField(${idx}, ${rIdx}, 'time', this.value)" placeholder="10.85">
                  </div>
                  <div class="input-group">
                    <div class="input-label"><span>風速</span></div>
                    <input type="text" value="${r.wind || ''}" oninput="window.updateRoundField(${idx}, ${rIdx}, 'wind', this.value)" placeholder="+1.5">
                  </div>
                  <div class="input-group">
                    <div class="input-label"><span>着順</span></div>
                    <input type="text" value="${r.place || ''}" oninput="window.updateRoundField(${idx}, ${rIdx}, 'place', this.value)" placeholder="1着">
                  </div>
                </div>
              `;
            } else {
              innerHtml += `
                <div class="grid-2col" style="margin-bottom:0;">
                  <div class="input-group" style="margin-bottom:0;">
                    <div class="input-label"><span>タイム ${isMidLong ? '(例: 2.00.80)' : ''}</span></div>
                    <input type="text" value="${r.time || ''}" oninput="window.updateRoundField(${idx}, ${rIdx}, 'time', this.value)" placeholder="${isMidLong ? '2.00.80' : '48.20'}">
                  </div>
                  <div class="input-group" style="margin-bottom:0;">
                    <div class="input-label"><span>着順</span></div>
                    <input type="text" value="${r.place || ''}" oninput="window.updateRoundField(${idx}, ${rIdx}, 'place', this.value)" placeholder="1着">
                  </div>
                </div>
              `;
            }
            innerHtml += `</div>`;
          });
          innerHtml += `</div><button class="add-round-btn" onclick="window.addRound(${idx})">＋ ラウンドを追加</button>`;
        } else {
          innerHtml += `
            <div class="grid-2col">
              <div class="input-group">
                <div class="input-label"><span>ラウンド区分</span></div>
                <select onchange="window.updateEventField(${idx}, 'round', this.value)">
                  <option value="予選" ${ev.round === '予選' ? 'selected' : ''}>予選</option>
                  <option value="決勝" ${ev.round === '決勝' ? 'selected' : ''}>決勝</option>
                </select>
              </div>
              <div class="input-group">
                <div class="input-label"><span>チーム着順</span></div>
                <input type="text" value="${ev.place || ''}" oninput="window.updateEventField(${idx}, 'place', this.value)" placeholder="3位">
              </div>
            </div>
            <div class="input-group" style="margin-bottom:0;">
              <div class="input-label"><span>チームタイム (秒)</span></div>
              <input type="text" value="${ev.time || ''}" oninput="window.updateEventField(${idx}, 'time', this.value)" placeholder="41.20">
            </div>
          `;
        }

        block.innerHTML = innerHtml;
        eventsContainer.appendChild(block);
      });
    };

    window.addEventBlock = function() {
      eventList.push({
        type: '100m',
        trials: ['', '', ''],
        trialWinds: ['', '', ''],
        trialFlags: ['', '', ''],
        trialsCount: 3,
        jumpMode: 'simple',
        simpleRecord: '',
        heightRows: [{ height: '', trials: ['', '', ''] }],
        rounds: [{ round: '予選', time: '', wind: '', place: '' }],
        round: '予選',
        time: '',
        place: ''
      });
      window.renderEvents();
    };

    window.removeEvent = function(idx) {
      eventList.splice(idx, 1);
      window.renderEvents();
    };

    window.updateEventType = function(idx, val) {
      eventList[idx].type = val;
      window.renderEvents();
    };

    window.updateEventField = function(idx, field, val) {
      eventList[idx][field] = val;
    };

    window.setJumpMode = function(idx, mode) {
      eventList[idx].jumpMode = mode;
      window.renderEvents();
    };

    window.addHeightRow = function(idx) {
      if (!eventList[idx].heightRows) eventList[idx].heightRows = [];
      eventList[idx].heightRows.push({ height: '', trials: ['', '', ''] });
      window.renderEvents();
    };

    window.removeHeightRow = function(idx, hIdx) {
      eventList[idx].heightRows.splice(hIdx, 1);
      window.renderEvents();
    };

    window.removeRound = function(idx, rIdx) {
      if (eventList[idx].rounds && eventList[idx].rounds.length > 1) {
        eventList[idx].rounds.splice(rIdx, 1);
        window.renderEvents();
      } else {
        alert('ラウンドは最低1つ必要です');
      }
    };

    window.updateHeightVal = function(idx, hIdx, val) {
      if (eventList[idx].heightRows && eventList[idx].heightRows[hIdx]) {
        eventList[idx].heightRows[hIdx].height = val;
      }
    };

    window.cycleHeightTrial = function(idx, hIdx, tIdx) {
      const current = eventList[idx].heightRows[hIdx].trials[tIdx];
      let next = '';
      if (current === '') next = '○';
      else if (current === '○') next = '×';
      else if (current === '×') next = '-';
      else next = '';
      eventList[idx].heightRows[hIdx].trials[tIdx] = next;
      window.renderEvents();
    };

    window.updateTrial = function(idx, tIdx, val) {
      eventList[idx].trials[tIdx] = val;
      eventList[idx].trialFlags[tIdx] = '';
    };

    window.updateTrialWind = function(idx, tIdx, val) {
      if (!eventList[idx].trialWinds) eventList[idx].trialWinds = [];
      eventList[idx].trialWinds[tIdx] = val;
    };

    window.setTrialFlag = function(idx, tIdx, flag) {
      const current = eventList[idx].trialFlags[tIdx];
      eventList[idx].trialFlags[tIdx] = (current === flag) ? '' : flag;
      if (eventList[idx].trialFlags[tIdx]) {
        eventList[idx].trials[tIdx] = '';
      }
      window.renderEvents();
    };

    window.expandTrials = function(idx) {
      eventList[idx].trialsCount = 6;
      if (!eventList[idx].trialWinds) eventList[idx].trialWinds = [];
      while(eventList[idx].trials.length < 6) {
        eventList[idx].trials.push('');
        eventList[idx].trialWinds.push('');
        eventList[idx].trialFlags.push('');
      }
      window.renderEvents();
    };

    window.addRound = function(idx) {
      if (!eventList[idx].rounds) eventList[idx].rounds = [];
      eventList[idx].rounds.push({ round: '決勝', time: '', wind: '', place: '' });
      window.renderEvents();
    };

    window.updateRoundField = function(idx, rIdx, field, val) {
      if (eventList[idx].rounds && eventList[idx].rounds[rIdx]) {
        eventList[idx].rounds[rIdx][field] = val;
      }
    };

    let targetDateStr = "";

    window.initApp = function(userId) {
      const urlParams = new URLSearchParams(window.location.search);
      const dateParam = urlParams.get('date');
      const fromParam = urlParams.get('from');
      
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const localTodayStr = `${year}-${month}-${day}`;

      targetDateStr = dateParam || localTodayStr;
      
      const dateInput = document.getElementById('match-date-input');
      dateInput.value = targetDateStr;

      const backLink = document.getElementById('back-link');
      if (fromParam === 'personal') {
        backLink.href = 'personal.html';
        backLink.innerHTML = '◀ トップへ戻る';
      } else {
        backLink.href = `calendar.html?date=${targetDateStr}`;
        backLink.innerHTML = '◀ カレンダーへ戻る';
      }

      dateInput.addEventListener('change', (e) => {
        if (e.target.value) {
          targetDateStr = e.target.value;
          if (fromParam !== 'personal') {
            backLink.href = `calendar.html?date=${targetDateStr}`;
          }
          loadDataForCurrentDate(userId);
        }
      });

      loadDataForCurrentDate(userId);
    };

    function loadDataForCurrentDate(userId) {
      // 未ログイン（userIdがnull）のときはローカルストレージのキーに 'guest' を使用する
      const storageUserPrefix = userId || 'guest';
      const storageKey = `track_log_${storageUserPrefix}_${targetDateStr}`;
      
      document.getElementById('m-name').value = '';
      document.getElementById('m-place').value = '';
      document.getElementById('m-weather').value = '晴れ';
      
      const conditionInput = document.getElementById('m-condition');
      conditionInput.value = '3';
      window.updateConditionLabel('3');

      eventList = [];

      const saved = localStorage.getItem(storageKey);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          const m = parsed['試合結果'] || parsed['試合结果'];
          if (m) {
            if (m.name) document.getElementById('m-name').value = m.name;
            if (m.place) document.getElementById('m-place').value = m.place;
            if (m.weather) document.getElementById('m-weather').value = m.weather;
            if (m.condition) {
              conditionInput.value = String(m.condition);
              window.updateConditionLabel(String(m.condition));
            }
            if (Array.isArray(m.events)) eventList = m.events;
          }
        } catch(e) {}
      }
      if (eventList.length === 0) {
        window.addEventBlock();
      } else {
        window.renderEvents();
      }
    }

    function extractBestRecord(ev) {
      let rawVal = null;
      let displayVal = null;
      let windVal = '';
      let isTime = false;

      if (isTrackIndividualEvent(ev.type)) {
        isTime = true;
        let bestSec = 999999;
        const checkWind = hasWindField(ev.type);

        if (ev.rounds) {
          ev.rounds.forEach(r => {
            if (r.time) {
              if (checkWind && r.wind) {
                let wVal = parseWindValue(r.wind);
                if (wVal >= 2.1) return;
              }

              let sec = timeToSeconds(r.time);
              if (sec < bestSec) {
                bestSec = sec;
                displayVal = r.time;
                rawVal = sec;
                windVal = r.wind || '';
              }
            }
          });
        }
      } else if (isHorizontalJump(ev.type)) {
        isTime = false;
        let bestVal = -1;
        if (ev.trials) {
          ev.trials.forEach((t, i) => {
            if (t) {
              let wStr = (ev.trialWinds && ev.trialWinds[i]) ? ev.trialWinds[i] : '';
              if (wStr) {
                let wVal = parseWindValue(wStr);
                if (wVal >= 2.1) return;
              }

              let val = meterToValue(t);
              if (val > bestVal) {
                bestVal = val;
                displayVal = formatMeterInput(t);
                rawVal = val;
                windVal = wStr;
              }
            }
          });
        }
      } else if (isThrowEvent(ev.type)) {
        isTime = false;
        let bestVal = -1;
        if (ev.trials) {
          ev.trials.forEach((t, i) => {
            if (t) {
              let val = meterToValue(t);
              if (val > bestVal) {
                bestVal = val;
                displayVal = formatMeterInput(t);
                rawVal = val;
              }
            }
          });
        }
      } else if (isVerticalJump(ev.type)) {
        isTime = false;
        let bestVal = -1;
        if (ev.jumpMode === 'simple' && ev.simpleRecord) {
          bestVal = meterToValue(ev.simpleRecord);
          displayVal = formatMeterInput(ev.simpleRecord);
          rawVal = bestVal;
        } else if (ev.heightRows) {
          ev.heightRows.forEach(row => {
            if (row.height) {
              let hasSuccess = row.trials.some(t => t === '○');
              if (hasSuccess) {
                let val = meterToValue(row.height);
                if (val > bestVal) {
                  bestVal = val;
                  displayVal = formatMeterInput(row.height);
                  rawVal = val;
                }
              }
            }
          });
        }
      }

      if (rawVal === null) return null;
      return { type: ev.type, rawVal, displayVal, wind: windVal, isTime };
    }

    window.saveMatchData = async function() {
      const userId = currentUserId;

      const nameVal = document.getElementById('m-name').value;
      if (!nameVal) {
        alert('大会名は必須です');
        return;
      }

      eventList.forEach(ev => {
        if (isHorizontalJump(ev.type) || isThrowEvent(ev.type)) {
          if (ev.trials) ev.trials = ev.trials.map(t => formatMeterInput(t));
        } else if (isVerticalJump(ev.type)) {
          if (ev.jumpMode === 'simple') {
            ev.simpleRecord = formatMeterInput(ev.simpleRecord);
          } else if (ev.heightRows) {
            ev.heightRows.forEach(row => { row.height = formatMeterInput(row.height); });
          }
        } else if (isTrackIndividualEvent(ev.type) && isMiddleLongDistance(ev.type)) {
          if (ev.rounds) {
            ev.rounds.forEach(r => { if (r.time) r.time = formatMiddleLongTime(r.time); });
          }
        }
      });

      const conditionVal = parseInt(document.getElementById('m-condition').value) || 3;
      const placeVal = document.getElementById('m-place').value;
      const weatherVal = document.getElementById('m-weather').value;

      const storageUserPrefix = userId || 'guest';
      const storageKey = `track_log_${storageUserPrefix}_${targetDateStr}`;
      let dayData = {};
      const existing = localStorage.getItem(storageKey);
      if (existing) {
        try { dayData = JSON.parse(existing); } catch(e) {}
      }

      dayData['試合結果'] = {
        name: nameVal,
        place: placeVal,
        weather: weatherVal,
        condition: conditionVal,
        events: eventList
      };

      localStorage.setItem(storageKey, JSON.stringify(dayData));

      // ログインしている場合のみFirestoreへ同期（track_logsコレクションに統一）
      if (userId) {
        try {
          await db.collection('users').doc(userId).collection('track_logs').doc(targetDateStr).set({
            '試合結果': {
              name: nameVal,
              place: placeVal,
              weather: weatherVal,
              condition: conditionVal,
              events: eventList,
              updatedAt: new Date().toISOString()
            }
          }, { merge: true });
        } catch (e) {
          console.error("Firebase track_logs 保存エラー: ", e);
        }
      }

      const pbStorageKey = `track_my_pbs_${storageUserPrefix}`;
      let pbSaved = localStorage.getItem(pbStorageKey);
      let pbList = [];
      if (pbSaved) {
        try { pbList = JSON.parse(pbSaved); } catch(e) {}
      }

      let updatedMessages = [];

      for (let ev of eventList) {
        let matchBest = extractBestRecord(ev);
        if (!matchBest) continue;

        let existingPbIndex = pbList.findIndex(p => p.event === matchBest.type);
        let isNewRecord = false;
        let oldDisplay = '';

        if (existingPbIndex !== -1) {
          let currentPb = pbList[existingPbIndex];
          oldDisplay = currentPb.recordDisplay || currentPb.record;
          let currentRaw = currentPb.isTime ? timeToSeconds(currentPb.record) : meterToValue(currentPb.record);

          if (matchBest.isTime) {
            if (matchBest.rawVal < currentRaw) isNewRecord = true;
          } else {
            if (matchBest.rawVal > currentRaw) isNewRecord = true;
          }
        } else {
          isNewRecord = true;
          oldDisplay = 'なし';
        }

        if (isNewRecord) {
          const newEntry = {
            event: matchBest.type,
            record: matchBest.displayVal,
            recordDisplay: matchBest.displayVal,
            wind: matchBest.wind,
            date: targetDateStr,
            competition: nameVal,
            place: placeVal,
            isTime: matchBest.isTime,
            updatedAt: new Date().toISOString()
          };

          if (existingPbIndex !== -1) {
            pbList[existingPbIndex] = newEntry;
          } else {
            pbList.push(newEntry);
          }

          if (userId) {
            try {
              await db.collection('users').doc(userId).collection('personal_bests').doc(matchBest.type).set(newEntry);
            } catch(e) {
              console.error("PBのFirebase保存エラー: ", e);
            }
          }

          updatedMessages.push(`【${matchBest.type}】\n${oldDisplay} ▶︎ ${matchBest.displayVal}`);
        }
      }

      localStorage.setItem(pbStorageKey, JSON.stringify(pbList));

      if (updatedMessages.length > 0) {
        const msg = `保存完了！\n自己ベスト更新しました！\n\n` + updatedMessages.join('\n\n') + `\n\nおめでとう🎉\n※MY記録庫・分析データも更新されました。`;
        alert(msg);
      } else {
        alert('試合記録を保存しました！');
      }

      const urlParams = new URLSearchParams(window.location.search);
      const fromParam = urlParams.get('from');
      if (fromParam === 'personal') {
        window.location.href = 'personal.html';
      } else {
        window.location.href = `calendar.html?date=${targetDateStr}`;
      }
    };
  </script>
