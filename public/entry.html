<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>試合エントリー</title>
  
  <!-- Firebase SDK の読み込み（コンパト版で統一） -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <style>
    body { background: #121212; color: #fff; font-family: sans-serif; padding: 12px; margin: 0; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid #333; }
    .green { color: #00ff88; }
    .orange { color: #ff9f43; }
    .cyan { color: #00e5ff; }
    
    .event-card { background: #252525; border-radius: 10px; padding: 12px; border-left: 4px solid #ff9f43; }
    
    .btn-group { display: flex; gap: 8px; margin: 8px 0; }
    .btn-choice { flex: 1; padding: 8px; border: 1px solid #444; background: #1e1e1e; color: #aaa; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
    .btn-choice.selected-yes { background: #00e5ff; color: #000; border-color: #00e5ff; }

    .events-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin: 6px 0 10px; max-height: 220px; overflow-y: auto; padding-right: 4px; }
    .event-checkbox-label { background: #1e1e1e; border: 1px solid #444; padding: 8px; border-radius: 6px; font-size: 11px; color: #ddd; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .event-checkbox-label:has(input:checked) { border-color: #00e5ff; background: #142e33; color: #00e5ff; font-weight: bold; }
    .event-checkbox-label input { accent-color: #00e5ff; }

    .record-input-box { background: #181818; border: 1px solid #00e5ff; padding: 10px; border-radius: 8px; margin-bottom: 8px; }
    .req-badge { background: #ff4757; color: #fff; font-size: 9px; padding: 2px 4px; border-radius: 3px; font-weight: bold; margin-left: 4px; }
    .relay-badge { background: #00e5ff; color: #000; font-size: 9px; padding: 2px 4px; border-radius: 3px; font-weight: bold; margin-left: 4px; }

    input[type="text"], input[type="number"] { width: 100%; box-sizing: border-box; background: #252525; border: 1px solid #555; color: #fff; padding: 8px; border-radius: 6px; font-size: 12px; margin-top: 4px; }
    
    .readonly-box { width: 100%; box-sizing: border-box; background: #181818; border: 1px solid #444; color: #00e5ff; padding: 8px; border-radius: 6px; font-size: 12px; margin-top: 4px; font-weight: bold; }

    .btn-submit { background: #00e5ff; color: #000; border: none; width: 100%; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; margin-top: 8px; }
    
    .entry-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 6px; }
    .entry-table th { background: #333; color: #00e5ff; text-align: left; padding: 6px; }
    .entry-table td { padding: 6px; border-bottom: 1px solid #333; color: #ddd; vertical-align: middle; }
    
    .relay-summary-card { background: #1a262b; border: 1px solid #00e5ff; padding: 10px; border-radius: 8px; margin-top: 10px; }
    .relay-member-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; min-height: 24px; }
    .member-chip { background: #252525; border: 1px solid #00e5ff; color: #fff; font-size: 11px; padding: 4px 8px; border-radius: 12px; }
    .member-chip.rep { border-color: #00e5ff; background: #00e5ff22; color: #00e5ff; font-weight: bold; }

    .match-select-item { background: #252525; border: 1px solid #444; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .match-select-item:hover { border-color: #ff9f43; background: #2a221b; }
    
    .btn-back-top { background: #00e5ff33; color: #00e5ff; border: 1px solid #00e5ff; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; margin-bottom: 10px; }
    .btn-back-top:hover { background: #00e5ff55; color: #fff; }
  </style>
</head>
<body>

<div>
  <a href="team_top.html" class="btn-back-top" id="backLink">← トップへ戻る</a>
</div>

<h3 class="cyan" style="text-align:center; margin-top:0;" id="pageMainTitle">📅 試合エントリー</h3>

<!-- 試合選択画面 -->
<div id="matchSelectView" style="display:none;">
  <div class="card">
    <div style="font-weight:bold; font-size:13px; color:#aaa; margin-bottom:10px;">📌 エントリーする試合を選択してください</div>
    <div id="matchListContainer">読み込み中...</div>
  </div>
</div>

<!-- 個別エントリー入力・集計画面 -->
<div id="matchEntryView" style="display:none;">
  <div class="card">
    <div style="font-weight:bold; font-size:13px; color:#aaa; margin-bottom:8px;" id="matchTitleDisplay">📌 読み込み中...</div>
    
    <div class="event-card">
      <div style="background:#1e1e1e; padding:10px; border-radius:8px; border:1px solid #333;">
        <div style="font-weight:bold; font-size:12px; color:var(--cyan, #00e5ff);">✍️ エントリー回答</div>
        
        <div class="btn-group">
          <button class="btn-choice selected-yes" id="btnParticipate" onclick="toggleParticipation(true)">⭕️ 出場する</button>
          <button class="btn-choice" id="btnNotParticipate" onclick="toggleParticipation(false)">❌ 欠場する</button>
        </div>

        <div id="entry-fields">
          <div style="margin-top:8px;">
            <label style="font-size:10px; color:#aaa; display:block;">名前（大会エントリー用・team_profiles連携）<span class="req-badge">必須</span></label>
            <div id="display-entry-name" class="readonly-box">読み込み中...</div>
          </div>

          <div style="margin-top:8px;">
            <label style="font-size:10px; color:#aaa; display:block;">ゼッケン番号（編集可能）<span class="req-badge">必須</span></label>
            <input type="text" id="entry-bib" placeholder="例: A-123 または 58">
          </div>

          <label style="font-size:10px; color:#aaa; font-weight:bold; display:block; margin-top:10px;">1. 種目を選択（複数選択可）</label>
          <div class="events-grid">
            <label class="event-checkbox-label"><input type="checkbox" name="events" value="100m" onclick="onEventSelectionChange()"> 100m</label>
            <label class="event-checkbox-label"><input type="checkbox" name="events" value="200m" onclick="onEventSelectionChange()"> 200m</label>
            <label class="event-checkbox-label"><input type="checkbox" name="events" value="300m" onclick="onEventSelectionChange()"> 300m</label>
            <label class="event-checkbox-label"><input type="checkbox" name="events" value="400m" onclick="onEventSelectionChange()"> 400m</label>
            <label class="event-checkbox-label"><input type="checkbox" name="events" value="800m" onclick="onEventSelectionChange()"> 800m</label>
            <label class="event-checkbox-label"><input type="checkbox" name="events" value="1500m" onclick="onEventSelectionChange()"> 1500m</label>
            <label class="event-checkbox-label"><input type="checkbox" name="events" value="100mH" onclick="onEventSelectionChange()"> 100mH</label>
            <label class="event-checkbox-label"><input type="checkbox" name="events" value="110mH" onclick="onEventSelectionChange()"> 110mH</label>
            <label class="event-checkbox-label"><input type="checkbox" name="events" value="300mH" onclick="onEventSelectionChange()"> 300mH</label>
            <label class="event-checkbox-label"><input type="checkbox" name="events" value="400mH" onclick="onEventSelectionChange()"> 400mH</label>
            <label class="event-checkbox-label"><input type="checkbox" name="events" value="走幅跳" onclick="onEventSelectionChange()"> 走幅跳</label>
            <label class="event-checkbox-label"><input type="checkbox" name="events" value="三段跳" onclick="onEventSelectionChange()"> 三段跳</label>
            <label class="event-checkbox-label"><input type="checkbox" name="events" value="走高跳" onclick="onEventSelectionChange()"> 走高跳</label>
            <label class="event-checkbox-label"><input type="checkbox" name="events" value="棒高跳" onclick="onEventSelectionChange()"> 棒高跳</label>
            <label class="event-checkbox-label"><input type="checkbox" name="events" value="やり投" onclick="onEventSelectionChange()"> やり投</label>
            <label class="event-checkbox-label"><input type="checkbox" name="events" value="円盤投" onclick="onEventSelectionChange()"> 円盤投</label>
            <label class="event-checkbox-label"><input type="checkbox" name="events" value="砲丸投" onclick="onEventSelectionChange()"> 砲丸投</label>
            <label class="event-checkbox-label"><input type="checkbox" name="events" value="4×100mR" onclick="onEventSelectionChange()"> 4×100mR</label>
            <label class="event-checkbox-label"><input type="checkbox" name="events" value="4×400mR" onclick="onEventSelectionChange()"> 4×400mR</label>
          </div>

          <label style="font-size:10px; color:#00e5ff; font-weight:bold; display:block; margin-top:10px; margin-bottom:4px;">
            2. 申請記録入力（自己ベストまたは前回入力値が反映されます）
          </label>
          <div id="dynamic-record-inputs"></div>

          <div style="margin-top:10px; background:#181818; border:1px solid #444; padding:10px; border-radius:8px;">
            <label style="font-size:11px; font-weight:bold; color:#ff9f43;">
              💰 エントリー代合計額（自動計算・手動修正可）
            </label>
            <input type="number" inputmode="numeric" id="entry-fee" placeholder="例: 3000">
          </div>

          <label style="font-size:10px; color:#aaa; display:block; margin-top:8px;">備考（任意）</label>
          <input type="text" id="entry-comment" placeholder="例: マイルは2走希望です">
        </div>

        <button class="btn-submit" onclick="submitEntry()">エントリーを送信（完了）</button>
      </div>

      <div style="margin-top:14px; border-top:1px dashed #444; padding-top:10px;">
        <div style="font-weight:bold; font-size:12px; color:#ff9f43;">📊 チーム集計結果</div>

        <div style="font-size:11px; font-weight:bold; color:#aaa; margin-top:6px;">👤 個人種目一覧（入力状況）</div>
        <table class="entry-table">
          <thead>
            <tr>
              <th style="width: 25%;">名前</th>
              <th style="width: 40%;">種目＆記録</th>
              <th style="width: 20%;">状態</th>
              <th style="width: 15%;">金額</th>
            </tr>
          </thead>
          <tbody id="summary-tbody">
            <tr><td colspan="4" style="text-align:center; color:#777;">読み込み中...</td></tr>
          </tbody>
        </table>

        <div class="relay-summary-card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:bold; font-size:12px; color:#00e5ff;">🏃‍♂️ 4×100mR 登録状況</span>
          </div>
          <div id="r100-record-display" style="font-size:11px; color:#ff9f43; margin-top:4px; font-weight:bold;">申請タイム: 未設定</div>
          <div class="relay-member-list" id="r100-member-list">
            <span style="font-size:10px; color:#777;">メンバー未登録</span>
          </div>
        </div>

        <div class="relay-summary-card" style="border-color:#00e5ff;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:bold; font-size:12px; color:#00e5ff;">🏃‍♂️ 4×400mR（マイル）登録状況</span>
          </div>
          <div id="r400-record-display" style="font-size:11px; color:#ff9f43; margin-top:4px; font-weight:bold;">申請タイム: 未設定</div>
          <div class="relay-member-list" id="r400-member-list">
            <span style="font-size:10px; color:#777;">メンバー未登録</span>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>

<script>
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentUser = null;
  let currentMatchId = null;
  let currentTeamId = null;
  let username = "";
  let userPersonalBests = {};
  let currentMatchData = null; 
  let savedEntryData = null; // 既存のエントリーデータを一時保存する変数

  auth.onAuthStateChanged(async (user) => {
    if (!user) {
      alert('ログインセッションが切れました。再度ログインしてください。');
      window.location.href = 'index.html';
      return;
    }
    currentUser = user;

    try {
      // 1. usersコレクションから所属チームIDを取得
      const userDoc = await db.collection("users").doc(user.uid).get();
      if (!userDoc.exists || !userDoc.data().teamId) {
        alert('所属チーム情報が見つかりません。チーム参加画面へ移動します。');
        window.location.href = 'team_entry.html';
        return;
      }

      const userData = userDoc.data();
      currentTeamId = userData.teamId;
      
      // 2. team_profiles から大会エントリー用の名前やゼッケン、PBを取得
      const profileDoc = await db.collection("team_profiles").doc(user.uid).get();
      const pData = profileDoc.exists ? profileDoc.data() : {};
      
      username = pData.username || userData.name || user.displayName || 'だいすけ';
      const savedBib = pData.bib || userData.bib || "";
      userPersonalBests = pData.personalBests || {};

      if (!savedBib) {
        alert('大会エントリー用のゼッケン番号が未設定です。設定画面へ移動します。');
        window.location.href = 'team_profile.html';
        return;
      }

      document.getElementById('display-entry-name').innerText = username;
      document.getElementById('entry-bib').value = savedBib;

      // 3. URLパラメータの取得
      const params = new URLSearchParams(window.location.search);
      currentMatchId = params.get('id');
      const matchName = params.get('name');
      const matchDate = params.get('date');

      if (!currentMatchId) {
        document.getElementById('matchSelectView').style.display = 'block';
        document.getElementById('matchEntryView').style.display = 'none';
        renderMatchSelectionList();
      } else {
        document.getElementById('matchSelectView').style.display = 'none';
        document.getElementById('matchEntryView').style.display = 'block';

        const titleDisplay = document.getElementById('matchTitleDisplay');

        // 4. Firestoreの schedules パスから最新の試合データ（金額設定含む）を取得
        try {
          const matchDoc = await db.collection("teams").doc(currentTeamId).collection("schedules").doc(currentMatchId).get();
          if (matchDoc.exists) {
            currentMatchData = matchDoc.data();
            const dateStr = currentMatchData.rawDate || matchDate || '';
            const dateParts = dateStr.split('-');
            const titleDateStr = dateParts.length >= 3 ? `${parseInt(dateParts[1])}月${parseInt(dateParts[2])}日 ` : '';
            titleDisplay.innerText = `📌 ${titleDateStr}${currentMatchData.name}`;
          } else {
            currentMatchData = {
              feeIndividual: Number(params.get('feeInd')) || 0,
              feeRelay: Number(params.get('feeRel')) || 0,
              name: matchName || '試合情報'
            };
            titleDisplay.innerText = `📌 ${matchName || '試合情報'}`;
          }
        } catch(err) {
          console.error("試合データ取得エラー:", err);
          currentMatchData = { feeIndividual: 0, feeRelay: 0 };
          titleDisplay.innerText = `📌 ${matchName || '試合情報'}`;
        }

        // 5. ★ すでに自分がこの試合にエントリーしていれば、そのデータを取得してフォームに復元する
        try {
          const entryDocId = `${currentMatchId}_${currentUser.uid}`;
          const entryDoc = await db.collection("teams").doc(currentTeamId).collection("match_entries").doc(entryDocId).get();
          if (entryDoc.exists) {
            savedEntryData = entryDoc.data();
          }
        } catch(e) {
          console.error("既存エントリーデータ取得エラー:", e);
        }

        // フォーム初期化と復元処理の実行
        initFormWithSavedData();
        loadEntriesFromFirebase();
      }

    } catch (e) {
      console.error("初期化エラー:", e);
      alert('データの読み込みに失敗しました。');
    }
  });

  // 既存データがある場合にフォームを復元する関数
  function initFormWithSavedData() {
    if (!savedEntryData) {
      // 保存データがない場合はデフォルトの初期表示（全チェックなしで自己ベスト反映など）
      renderRecordInputs();
      calculateFee();
      return;
    }

    // 欠場かどうかの判定
    let isAbsent = false;
    if (savedEntryData.status === 'absent') {
      isAbsent = true;
    } else {
      savedEntryData.events.forEach(ev => {
        if (ev.eventName === 'status' && ev.recordValue === '欠場') isAbsent = true;
      });
    }

    if (isAbsent) {
      toggleParticipation(false);
    } else {
      toggleParticipation(true);

      // ゼッケン番号の復元
      if (savedEntryData.bib) {
        document.getElementById('entry-bib').value = savedEntryData.bib;
      }

      // 備考欄の復元
      if (savedEntryData.comment) {
        document.getElementById('entry-comment').value = savedEntryData.comment;
      }

      // 種目のチェックボックスを復元
      const eventCheckboxes = document.querySelectorAll('input[name="events"]');
      eventCheckboxes.forEach(cb => {
        const found = savedEntryData.events.find(ev => ev.eventName === cb.value);
        if (found) {
          cb.checked = true;
        }
      });
    }

    // 種目ごとの入力欄（記録・リレー役割）をレンダリング
    renderRecordInputs();

    // 記録やリレー役割の値を復元
    if (!isAbsent && savedEntryData.events) {
      savedEntryData.events.forEach(ev => {
        if (ev.eventName.includes('R')) {
          // リレーの場合、代表・メンバーのラジオボタンを選択
          const roleRadio = document.querySelector(`input[name="role-${ev.eventName}"][value="${ev.role || 'normal'}"]`);
          if (roleRadio) {
            roleRadio.checked = true;
            toggleRelayRole(ev.eventName, ev.role === 'rep');
          }
        }
        // 申請記録の値を流し込む
        const recordInput = document.querySelector(`.record-field[data-event="${ev.eventName}"]`);
        if (recordInput && ev.recordValue) {
          recordInput.value = ev.recordValue;
        }
      });
    }

    // 金額の復元（保存されていればそれを、なければ自動計算）
    if (savedEntryData.rawFeeNum !== undefined) {
      document.getElementById('entry-fee').value = savedEntryData.rawFeeNum;
    } else {
      calculateFee();
    }
  }

  async function renderMatchSelectionList() {
    const container = document.getElementById('matchListContainer');
    container.innerHTML = '読み込み中...';

    try {
      const snapshot = await db.collection("teams").doc(currentTeamId).collection("schedules").get();
      let matches = [];
      snapshot.forEach(docSnap => {
        const d = docSnap.data();
        if (d.isMatch) {
          matches.push({ id: docSnap.id, ...d });
        }
      });

      if (matches.length === 0) {
        container.innerHTML = '<div style="font-size: 11px; color: #888; text-align: center; padding: 20px;">登録されている試合がありません。<br>スケジュール画面から試合を追加してください。</div>';
        return;
      }

      matches.sort((a, b) => (a.rawDate || '').localeCompare(b.rawDate || ''));
      container.innerHTML = '';

      matches.forEach(match => {
        const dateParts = (match.rawDate || '').split('-');
        const displayDateStr = dateParts.length >= 3 ? `${parseInt(dateParts[1])}月${parseInt(dateParts[2])}日` : match.rawDate;

        const item = document.createElement('div');
        item.className = 'match-select-item';
        item.innerHTML = `
          <div>
            <div class="orange" style="font-weight:bold; font-size:12px;">🔥 ${displayDateStr} ${match.name}</div>
            <div style="color:#aaa; font-size:10px; margin-top:2px;">場所: ${match.location || '未設定'} / 締切: ${match.deadline || '未設定'}</div>
          </div>
          <div style="font-size:11px; background:#00e5ff; color:#121212; padding:6px 10px; border-radius:6px; font-weight:bold;">選択 ➡</div>
        `;
        item.onclick = function() {
          window.location.href = `entry.html?id=${match.id}&name=${encodeURIComponent(match.name)}&date=${match.rawDate}&feeInd=${match.feeIndividual || 0}&feeRel=${match.feeRelay || 0}`;
        };
        container.appendChild(item);
      });
    } catch (e) {
      console.error("試合一覧の取得エラー:", e);
      container.innerHTML = '<div style="font-size: 11px; color: #ff4757; text-align: center; padding: 20px;">試合一覧の読み込みに失敗しました。</div>';
    }
  }

  window.toggleParticipation = function(isParticipating) {
    const btnYes = document.getElementById('btnParticipate');
    const btnNo = document.getElementById('btnNotParticipate');
    const fields = document.getElementById('entry-fields');

    if (isParticipating) {
      btnYes.className = 'btn-choice selected-yes';
      btnNo.className = 'btn-choice';
      fields.style.display = 'block';
      calculateFee();
    } else {
      btnYes.className = 'btn-choice';
      btnNo.className = 'btn-choice selected-yes';
      fields.style.display = 'none';
      document.getElementById('entry-fee').value = '0';
    }
  }

  window.onEventSelectionChange = function() {
    renderRecordInputs();
    calculateFee();
  }

  window.renderRecordInputs = function() {
    const container = document.getElementById('dynamic-record-inputs');
    const checkedBoxes = document.querySelectorAll('input[name="events"]:checked');
    
    const currentValues = {};
    document.querySelectorAll('.record-field').forEach(input => {
      currentValues[input.dataset.event] = input.value;
    });

    container.innerHTML = '';

    checkedBoxes.forEach(cb => {
      const eventName = cb.value;
      
      // 既存データがあればそれを優先、次に現在入力中の値、最後に自己ベスト
      let defaultRecord = '';
      if (currentValues[eventName] !== undefined) {
        defaultRecord = currentValues[eventName];
      } else if (savedEntryData && savedEntryData.events) {
        const foundEv = savedEntryData.events.find(e => e.eventName === eventName);
        if (foundEv && foundEv.recordValue) {
          defaultRecord = foundEv.recordValue;
        }
      }
      if (!defaultRecord) {
        defaultRecord = userPersonalBests[eventName] || '';
      }

      // リレーの役割のデフォルト判定
      let isRepChecked = true;
      if (savedEntryData && savedEntryData.events) {
        const foundEv = savedEntryData.events.find(e => e.eventName === eventName);
        if (foundEv && foundEv.role === 'member') {
          isRepChecked = false;
        }
      }

      const box = document.createElement('div');
      box.className = 'record-input-box';

      if (eventName.includes('R')) {
        box.innerHTML = `
          <div style="font-size:11px; font-weight:bold; color:#00e5ff; display:flex; justify-content:space-between;">
            <span>🤝 ${eventName} エントリー</span>
            <span class="relay-badge">リレー種目</span>
          </div>
          <div style="margin-top:6px; font-size:11px; color:#ccc;">
            <label style="margin-right:12px;"><input type="radio" name="role-${eventName}" value="rep" ${isRepChecked ? 'checked' : ''} onclick="toggleRelayRole('${eventName}', true)"> 代表（記録記入）</label>
            <label><input type="radio" name="role-${eventName}" value="member" ${!isRepChecked ? 'checked' : ''} onclick="toggleRelayRole('${eventName}', false)"> メンバー追加</label>
          </div>
          <div id="relay-input-wrap-${eventName}" style="margin-top:6px; display: ${isRepChecked ? 'block' : 'none'};">
            <label style="font-size:10px; color:#aaa;">申請記録（編集可能）</label>
            <input type="text" class="record-field" data-event="${eventName}" value="${defaultRecord}" placeholder="例: 42.50">
          </div>
        `;
      } else {
        box.innerHTML = `
          <div style="font-size:11px; font-weight:bold; color:#fff;">
            🏆 ${eventName} の申請記録 <span class="req-badge">必須</span> <span style="font-size:9px; color:#00e5ff; font-weight:normal;">(自己ベスト自動反映・編集可)</span>
          </div>
          <input type="text" class="record-field" data-event="${eventName}" value="${defaultRecord}" placeholder="例: 10.90 / 7.15">
        `;
      }
      container.appendChild(box);
    });
  }

  function calculateFee() {
    if (!currentMatchData) return;

    const feeIndividual = Number(currentMatchData.feeIndividual) || 0;
    const feeRelay = Number(currentMatchData.feeRelay) || 0;

    let individualCount = 0;
    let relayFeeToAdd = 0;

    const checkedBoxes = document.querySelectorAll('input[name="events"]:checked');
    checkedBoxes.forEach(cb => {
      if (cb.value.includes('R')) {
        const repRadio = document.querySelector(`input[name="role-${cb.value}"][value="rep"]`);
        if (repRadio && repRadio.checked) {
          relayFeeToAdd += feeRelay;
        }
      } else {
        individualCount++;
      }
    });

    const total = (individualCount * feeIndividual) + relayFeeToAdd;
    document.getElementById('entry-fee').value = total;
  }

  window.toggleRelayRole = function(eventName, isRep) {
    const wrap = document.getElementById(`relay-input-wrap-${eventName}`);
    if (wrap) {
      wrap.style.display = isRep ? 'block' : 'none';
    }
    calculateFee();
  }

  window.submitEntry = async function() {
    const bib = document.getElementById('entry-bib').value.trim();
    if (!username) {
      alert('プロフィール情報（名前）が不足しています。');
      return;
    }
    if (!bib) {
      alert('ゼッケン番号を入力してください。');
      return;
    }

    const isParticipating = document.getElementById('btnParticipate').classList.contains('selected-yes');
    let entryDataList = [];
    let feeDisplay = '¥0';

    if (!isParticipating) {
      entryDataList.push({ eventName: 'status', recordValue: '欠場', role: 'absent' });
    } else {
      let rawFee = document.getElementById('entry-fee').value.trim();
      if (rawFee === '') rawFee = '0';
      feeDisplay = `¥${Number(rawFee).toLocaleString()}`;
      
      const checkedBoxes = document.querySelectorAll('input[name="events"]:checked');
      if (checkedBoxes.length === 0) {
        alert('出場する種目を少なくとも1つ選択してください。');
        return;
      }

      checkedBoxes.forEach(cb => {
        const eventName = cb.value;
        const recordInput = document.querySelector(`.record-field[data-event="${eventName}"]`);
        const recordValue = recordInput ? recordInput.value.trim() : '';
        let role = 'normal';
        
        if (eventName.includes('R')) {
          const repRadio = document.querySelector(`input[name="role-${eventName}"][value="rep"]`);
          const isRep = repRadio ? repRadio.checked : true;
          role = isRep ? 'rep' : 'member';
        }
        entryDataList.push({ eventName, recordValue, role });
      });
    }

    const comment = document.getElementById('entry-comment').value.trim();

    const entryPayload = {
      matchId: currentMatchId,
      username: username,
      bib: bib,
      status: isParticipating ? 'completed' : 'absent',
      isCompleted: true,
      fee: isParticipating ? feeDisplay : '¥0',
      rawFeeNum: isParticipating ? Number(document.getElementById('entry-fee').value) || 0 : 0,
      comment: comment,
      events: entryDataList,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    try {
      const docId = `${currentMatchId}_${currentUser.uid}`;
      await db.collection("teams").doc(currentTeamId).collection("match_entries").doc(docId).set(entryPayload, { merge: true });

      alert(isParticipating ? 'エントリー内容を変更（保存）しました！' : '「欠場」として登録しました。');
      loadEntriesFromFirebase();
    } catch (e) {
      console.error("Firebase保存エラー: ", e);
      alert('保存に失敗しました。ネットワーク状況を確認してください。');
    }
  }

  async function loadEntriesFromFirebase() {
    const tbody = document.getElementById('summary-tbody');
    const r100List = document.getElementById('r100-member-list');
    const r400List = document.getElementById('r400-member-list');
    const r100RecordDisplay = document.getElementById('r100-record-display');
    const r400RecordDisplay = document.getElementById('r400-record-display');
    
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#777;">読み込み中...</td></tr>';

    try {
      const querySnapshot = await db.collection("teams").doc(currentTeamId).collection("match_entries")
        .where("matchId", "==", currentMatchId)
        .get();

      tbody.innerHTML = '';
      r100List.innerHTML = '';
      r400List.innerHTML = '';
      r100RecordDisplay.innerText = '申請タイム: 未設定';
      r400RecordDisplay.innerText = '申請タイム: 未設定';

      if (querySnapshot.empty) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#777;">まだエントリーはありません</td></tr>';
        r100List.innerHTML = '<span style="font-size:10px; color:#777;">メンバー未登録</span>';
        r400List.innerHTML = '<span style="font-size:10px; color:#777;">メンバー未登録</span>';
        return;
      }

      let r100Members = [];
      let r400Members = [];
      let r100Record = '';
      let r400Record = '';
      let matchEntries = [];

      querySnapshot.forEach(docSnap => {
        matchEntries.push(docSnap.data());
      });

      matchEntries.forEach(entry => {
        let isAbsent = false;
        let normalEvents = [];

        entry.events.forEach(ev => {
          if (ev.eventName === 'status' && ev.recordValue === '欠場') {
            isAbsent = true;
          } else if (!ev.eventName.includes('R')) {
            normalEvents.push(ev);
          } else {
            if (ev.eventName === '4×100mR') {
              r100Members.push({ name: entry.username, role: ev.role });
              if (ev.role === 'rep' && ev.recordValue) {
                r100Record = ev.recordValue;
              }
            }
            if (ev.eventName === '4×400mR') {
              r400Members.push({ name: entry.username, role: ev.role });
              if (ev.role === 'rep' && ev.recordValue) {
                r400Record = ev.recordValue;
              }
            }
          }
        });

        let statusHtml = '';
        if (isAbsent) {
          statusHtml = '<span style="color:#ff4757; font-weight:bold;">❌ 欠場</span>';
        } else if (entry.isCompleted) {
          statusHtml = '<span style="color:#00ff88; font-size:10px; font-weight:bold;">入力完了</span>';
        } else {
          statusHtml = '<span style="color:#ff9f43; font-size:10px;">⏳ 未完了</span>';
        }

        let personalEventsText = '';
        if (isAbsent) {
          personalEventsText = '<span style="color:#ff4757; font-weight:bold;">欠場</span>';
        } else {
          normalEvents.forEach((ev) => {
            personalEventsText += `<strong style="color:#00e5ff;">${ev.eventName}:</strong> ${ev.recordValue || '記録なし'}<br>`;
          });
          if (normalEvents.length === 0) {
            personalEventsText = '<span style="color:#777;">個人種目なし</span>';
          }
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${entry.username}</strong><br><span style="color:#aaa; font-size:9px;">No.${entry.bib || '---'}</span></td>
          <td>${personalEventsText}</td>
          <td>${statusHtml}</td>
          <td style="color:#ff9f43;">${entry.fee}</td>
        `;
        tbody.appendChild(tr);
      });

      if (r100Record) {
        r100RecordDisplay.innerText = `申請タイム: ${r100Record}`;
      } else {
        r100RecordDisplay.innerText = '申請タイム: 未設定';
      }

      if (r100Members.length === 0) {
        r100List.innerHTML = '<span style="font-size:10px; color:#777;">メンバー未登録</span>';
      } else {
        r100Members.forEach(m => {
          const span = document.createElement('span');
          span.className = m.role === 'rep' ? 'member-chip rep' : 'member-chip';
          span.innerText = m.role === 'rep' ? `★ ${m.name} (代表)` : m.name;
          r100List.appendChild(span);
        });
      }

      if (r400Record) {
        r400RecordDisplay.innerText = `申請タイム: ${r400Record}`;
      } else {
        r400RecordDisplay.innerText = '申請タイム: 未設定';
      }

      if (r400Members.length === 0) {
        r400List.innerHTML = '<span style="font-size:10px; color:#777;">メンバー未登録</span>';
      } else {
        r400Members.forEach(m => {
          const span = document.createElement('span');
          span.className = m.role === 'rep' ? 'member-chip rep' : 'member-chip';
          span.innerText = m.role === 'rep' ? `★ ${m.name} (代表)` : m.name;
          r400List.appendChild(span);
        });
      }

    } catch (e) {
      console.error("データ読み込みエラー: ", e);
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#ff4757;">データの読み込みに失敗しました</td></tr>';
    }
  }
</script>
