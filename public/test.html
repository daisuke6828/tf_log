<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONTROL TEST LOG</title>

  <!-- 💡 最新の firebase-init.js（Firestore）をモジュールとして読み込み -->
  <script type="module" src="firebase-init.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { background: #121212; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 12px; margin: 0; padding-bottom: 90px; }
    
    /* シンプルな1つの戻るボタン */
    .back-btn-container { margin-bottom: 12px; }
    .back-btn { display: inline-flex; align-items: center; gap: 4px; background: #1e1e1e; color: #00e676; border: 1px solid #00e676; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; text-decoration: none; cursor: pointer; }
    .back-btn:hover { background: #00e676; color: #121212; }

    .page-title { display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: bold; color: #00e676; margin-bottom: 16px; justify-content: center; }

    .card { background: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #333; }
    .section-title { font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #fff; }
    .section-note { font-size: 11px; color: #00e676; margin-bottom: 12px; }
    
    /* 日付入力欄のスタイル */
    input[type="date"] {
      -webkit-appearance: none;
      appearance: none;
      background-color: #222;
      color: #fff;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      width: 100%;
      height: 46px;
      box-sizing: border-box;
      outline: none;
      color-scheme: dark;
    }
    input[type="date"]:focus { border-color: #00e676; }

    .input-group { margin-bottom: 14px; }
    .input-label { font-size: 12px; color: #aaa; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    
    select, input[type="text"], input[type="number"] { background: #222; border: 1px solid #333; border-radius: 10px; padding: 12px; color: #fff; font-size: 15px; width: 100%; outline: none; }
    select:focus, input:focus { border-color: #00e676; }

    /* カテゴリー見出し */
    .category-header { font-size: 13px; font-weight: bold; color: #00e676; margin: 16px 0 10px 0; display: flex; align-items: center; gap: 6px; }
    
    /* 項目ごとの入力カード */
    .test-item-card { background: #222; border: 1px solid #333; border-left: 3px solid #00e676; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .test-item-label { font-size: 12px; color: #aaa; margin-bottom: 6px; }
    .test-item-card input { background: #1a1a1a; border: 1px solid #444; border-radius: 8px; padding: 10px; color: #fff; font-size: 15px; width: 100%; outline: none; text-align: left; }
    .test-item-card input:focus { border-color: #00e676; }

    /* 固定保存ボタン */
    .submit-fixed { position: fixed; bottom: 0; left: 0; right: 0; background: #121212; padding: 12px; border-top: 1px solid #222; z-index: 100; display: flex; justify-content: center; }
    .submit-btn { background: #00e676; color: #121212; border: none; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: bold; width: 100%; max-width: 500px; cursor: pointer; text-align: center; box-shadow: 0 4px 12px rgba(0,230,118,0.3); }
    .submit-btn:hover { background: #00c853; }
  </style>
</head>
<body>

  <div class="back-btn-container">
    <a href="#" id="back-link" class="back-btn">◀ 戻る</a>
  </div>

  <div class="page-title">
    <span>📊</span> CONTROL TEST LOG
  </div>

  <div class="card">
    <div class="input-label" style="margin-bottom:6px;">測定日 (タップして変更可能)</div>
    <input type="date" id="test-date-input">

    <div class="section-title" style="margin-top:16px;">1. 測定情報</div>
    <div class="input-group" style="margin-bottom:8px;">
      <div class="input-label">期分け</div>
      <select id="t-period" onchange="handlePeriodChange()">
        <option value="冬季1次強化期">冬季1次強化期</option>
        <option value="冬季2次強化期">冬季2次強化期</option>
        <option value="移行期">移行期</option>
        <option value="試合期（前半）">試合期（前半）</option>
        <option value="試合期（後半）">試合期（後半）</option>
        <option value="手入力">✏️ 手入力する</option>
      </select>
    </div>
    <div class="input-group" id="period-custom-group" style="display: none; margin-bottom:0;">
      <div class="input-label">期分け（自由入力）</div>
      <input type="text" id="t-period-custom" placeholder="例: 夏季強化期 など">
    </div>
  </div>

  <div class="card">
    <div class="section-title">2. 測定結果</div>
    <div class="section-note">※入力は数字と . のみ。単位は自動で表示されます。</div>

    <!-- 跳躍・バネ系 -->
    <div class="category-header">🦘 跳躍・バネ系</div>
    <div class="test-item-card"><div class="test-item-label">RJ index</div><input type="text" id="t-rj-index" placeholder="例: 3.2" oninput="validateNumberInput(this)"></div>
    <div class="test-item-card"><div class="test-item-label">垂直跳 (cm)</div><input type="text" id="t-vertical-jump" placeholder="例: 65" oninput="validateNumberInput(this)"></div>
    <div class="test-item-card"><div class="test-item-label">立幅跳</div><input type="text" id="t-standing-jump" placeholder="例: 3.25" oninput="validateNumberInput(this)"></div>
    <div class="test-item-card"><div class="test-item-label">立三段跳</div><input type="text" id="t-standing-triple" placeholder="例: 9.80" oninput="validateNumberInput(this)"></div>
    <div class="test-item-card"><div class="test-item-label">立五段跳</div><input type="text" id="t-standing-5jump" placeholder="例: 16.50" oninput="validateNumberInput(this)"></div>
    <div class="test-item-card"><div class="test-item-label">立七段跳</div><input type="text" id="t-standing-7jump" placeholder="例: 23.40" oninput="validateNumberInput(this)"></div>
    <div class="test-item-card"><div class="test-item-label">助走付五段跳</div><input type="text" id="t-approach-5jump" placeholder="例: 18.20" oninput="validateNumberInput(this)"></div>

    <!-- スプリント系 -->
    <div class="category-header">⚡ スプリント系</div>
    <div class="test-item-card"><div class="test-item-label">30m (秒)</div><input type="text" id="t-30m" placeholder="例: 3.85" oninput="validateNumberInput(this)"></div>
    <div class="test-item-card"><div class="test-item-label">60m (秒)</div><input type="text" id="t-60m" placeholder="例: 7.20" oninput="validateNumberInput(this)"></div>
    <div class="test-item-card"><div class="test-item-label">100m (秒)</div><input type="text" id="t-100m" placeholder="例: 11.20" oninput="validateNumberInput(this)"></div>
    <div class="test-item-card"><div class="test-item-label">150m (秒)</div><input type="text" id="t-150m" placeholder="例: 16.50" oninput="validateNumberInput(this)"></div>
    <div class="test-item-card"><div class="test-item-label">300w (秒)</div><input type="text" id="t-300w" placeholder="例: 35.00" oninput="validateNumberInput(this)"></div>
    <div class="test-item-card"><div class="test-item-label">30mフライ走 (秒)</div><input type="text" id="t-fly30m" placeholder="例: 2.75" oninput="validateNumberInput(this)"></div>

    <!-- 投てき・パワー系 -->
    <div class="category-header">💣 投てき・パワー系</div>
    <div class="test-item-card"><div class="test-item-label">メディシンボール投(前)</div><input type="text" id="t-med-front" placeholder="例: 14.50" oninput="validateNumberInput(this)"></div>
    <div class="test-item-card"><div class="test-item-label">メディシンボール投(後)</div><input type="text" id="t-med-back" placeholder="例: 16.20" oninput="validateNumberInput(this)"></div>

    <!-- ウエイト1RM -->
    <div class="category-header">🏋️‍♂️ ウエイト1RM</div>
    <div class="test-item-card"><div class="test-item-label">ベンチプレス</div><input type="text" id="t-bench-press" placeholder="例: 80" oninput="validateNumberInput(this)"></div>
    <div class="test-item-card"><div class="test-item-label">スナッチ</div><input type="text" id="t-snatch" placeholder="例: 70" oninput="validateNumberInput(this)"></div>
    <div class="test-item-card"><div class="test-item-label">クリーン</div><input type="text" id="t-clean" placeholder="例: 90" oninput="validateNumberInput(this)"></div>
    <div class="test-item-card"><div class="test-item-label">ハイフルスクワット</div><input type="text" id="t-high-full-squat" placeholder="例: 120" oninput="validateNumberInput(this)"></div>
    <div class="test-item-card" style="margin-bottom:0;"><div class="test-item-label">デッドリフト</div><input type="text" id="t-deadlift" placeholder="例: 150" oninput="validateNumberInput(this)"></div>
  </div>

  <div class="submit-fixed">
    <button class="submit-btn" onclick="saveTestData()">【 CT結果を一括保存 】</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const dateParam = urlParams.get('date');
    
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    const localTodayStr = `${year}-${month}-${day}`;

    let targetDateStr = dateParam || localTodayStr;

    const dateInput = document.getElementById('test-date-input');
    dateInput.value = targetDateStr;

    const returnParam = urlParams.get('return');
    const savedReturnUrl = localStorage.getItem('test_return_url');
    let finalReturnUrl = returnParam || savedReturnUrl || `calendar.html?date=${targetDateStr}`;

    const backLinkEl = document.getElementById('back-link');
    backLinkEl.href = finalReturnUrl;

    if (finalReturnUrl.includes('personal.html')) {
      backLinkEl.innerText = '◀ トップへ戻る';
    } else {
      backLinkEl.innerText = '◀ カレンダーへ戻る';
    }

    dateInput.addEventListener('change', (e) => {
      if (e.target.value) {
        targetDateStr = e.target.value;
        if (!returnParam && !savedReturnUrl) {
          finalReturnUrl = `calendar.html?date=${targetDateStr}`;
          backLinkEl.href = finalReturnUrl;
        }
        loadDataForCurrentDate();
      }
    });

    function validateNumberInput(inputEl) {
      inputEl.value = inputEl.value.replace(/[^0-9.]/g, '');
    }

    function formatMeterInput(val) {
      if (!val) return '';
      let clean = val.trim();
      if (clean === '' || clean === '-' || clean === '×') return clean;
      if (clean.includes('m')) return clean;

      if (clean.includes('.')) {
        let parts = clean.split('.');
        let meters = parts[0];
        let cm = parts[1] || '00';
        if (cm.length === 1) cm += '0';
        return `${meters}m${cm}`;
      }
      return clean;
    }

    function formatUnitMs(val) {
      if (!val) return '';
      let clean = val.trim();
      if (clean === '' || clean.includes('m/s')) return clean;
      return `${clean}m/s`;
    }

    function formatUnitKg(val) {
      if (!val) return '';
      let clean = val.trim();
      if (clean === '' || clean.includes('kg')) return clean;
      return `${clean}kg`;
    }

    function clearInputs() {
      document.getElementById('t-period').value = '冬季1次強化期';
      document.getElementById('period-custom-group').style.display = 'none';
      document.getElementById('t-period-custom').value = '';

      const inputIds = [
        't-rj-index', 't-vertical-jump', 't-standing-jump', 't-standing-triple', 
        't-standing-5jump', 't-standing-7jump', 't-approach-5jump', 't-30m', 
        't-60m', 't-100m', 't-150m', 't-300w', 't-fly30m', 't-med-front', 
        't-med-back', 't-bench-press', 't-snatch', 't-clean', 't-high-full-squat', 't-deadlift'
      ];
      inputIds.forEach(id => {
        document.getElementById(id).value = '';
      });
    }

    function loadDataToInputs(dataObj) {
      if (!dataObj || !dataObj['コントロールテスト']) return;
      const t = dataObj['コントロールテスト'];
      
      const periodSelect = document.getElementById('t-period');
      let matched = false;
      for (let i = 0; i < periodSelect.options.length; i++) {
        if (periodSelect.options[i].value === t.period) {
          periodSelect.value = t.period;
          matched = true;
          break;
        }
      }
      if (!matched && t.period) {
        periodSelect.value = '手入力';
        document.getElementById('period-custom-group').style.display = 'block';
        document.getElementById('t-period-custom').value = t.period;
      } else {
        handlePeriodChange();
      }

      function parseBackToInput(val, type) {
        if (!val) return '';
        if (type === 'meter') {
          if (val.includes('m')) {
            let parts = val.split('m');
            return parts[0] + '.' + (parts[1] || '00');
          }
        } else if (type === 'ms') {
          return val.replace('m/s', '').trim();
        } else if (type === 'kg') {
          return val.replace('kg', '').trim();
        }
        return val;
      }

      if (t.rjIndex) document.getElementById('t-rj-index').value = parseBackToInput(t.rjIndex, 'ms');
      if (t.verticalJump) document.getElementById('t-vertical-jump').value = t.verticalJump;
      if (t.standingJump) document.getElementById('t-standing-jump').value = parseBackToInput(t.standingJump, 'meter');
      if (t.standingTriple) document.getElementById('t-standing-triple').value = parseBackToInput(t.standingTriple, 'meter');
      if (t.standing5Jump) document.getElementById('t-standing-5jump').value = parseBackToInput(t.standing5Jump, 'meter');
      if (t.standing7Jump) document.getElementById('t-standing-7jump').value = parseBackToInput(t.standing7Jump, 'meter');
      if (t.approach5Jump) document.getElementById('t-approach-5jump').value = parseBackToInput(t.approach5Jump, 'meter');
      
      if (t.s30m) document.getElementById('t-30m').value = t.s30m;
      if (t.s60m) document.getElementById('t-60m').value = t.s60m;
      if (t.s100m) document.getElementById('t-100m').value = t.s100m;
      if (t.s150m) document.getElementById('t-150m').value = t.s150m;
      if (t.s300w) document.getElementById('t-300w').value = t.s300w;
      if (t.fly30m) document.getElementById('t-fly30m').value = t.fly30m;
      
      if (t.medFront) document.getElementById('t-med-front').value = parseBackToInput(t.medFront, 'meter');
      if (t.medBack) document.getElementById('t-med-back').value = parseBackToInput(t.medBack, 'meter');
      
      if (t.benchPress) document.getElementById('t-bench-press').value = parseBackToInput(t.benchPress, 'kg');
      if (t.snatch) document.getElementById('t-snatch').value = parseBackToInput(t.snatch, 'kg');
      if (t.clean) document.getElementById('t-clean').value = parseBackToInput(t.clean, 'kg');
      if (t.highFullSquat) document.getElementById('t-high-full-squat').value = parseBackToInput(t.highFullSquat, 'kg');
      if (t.deadlift) document.getElementById('t-deadlift').value = parseBackToInput(t.deadlift, 'kg');
    }

    // 💡 Firestore対応の読み込み処理
    async function loadDataForCurrentDate() {
      clearInputs();
      const storageKey = `track_log_${targetDateStr}`;
      const docId = targetDateStr.replace(/-/g, '');

      // まずローカルから表示
      const savedLocal = localStorage.getItem(storageKey);
      if (savedLocal) {
        try { loadDataToInputs(JSON.parse(savedLocal)); } catch(e) {}
      }

      // Firestoreからデータ取得
      if (window.db && window.firestoreOps) {
        try {
          const docRef = window.firestoreOps.doc(window.db, "track_logs", docId);
          const docSnap = await window.firestoreOps.getDoc(docRef);
          if (docSnap.exists()) {
            const fbData = docSnap.data();
            localStorage.setItem(storageKey, JSON.stringify(fbData));
            loadDataToInputs(fbData);
          }
        } catch(err) {
          console.log('Firestore fetch skipped/failed', err);
        }
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadDataForCurrentDate();
    });

    window.handlePeriodChange = function() {
      const selectEl = document.getElementById('t-period');
      const customGroup = document.getElementById('period-custom-group');
      if (selectEl.value === '手入力') {
        customGroup.style.display = 'block';
      } else {
        customGroup.style.display = 'none';
        document.getElementById('t-period-custom').value = '';
      }
    };

    // 💡 Firestore対応の保存処理
    window.saveTestData = async function() {
      const storageKey = `track_log_${targetDateStr}`;
      const docId = targetDateStr.replace(/-/g, '');

      const periodSelectVal = document.getElementById('t-period').value;
      const finalPeriod = (periodSelectVal === '手入力') ? document.getElementById('t-period-custom').value : periodSelectVal;

      let dayData = {};
      const existing = localStorage.getItem(storageKey);
      if (existing) {
        try { dayData = JSON.parse(existing); } catch(e) {}
      }

      dayData['コントロールテスト'] = {
        period: finalPeriod,
        rjIndex: formatUnitMs(document.getElementById('t-rj-index').value),
        verticalJump: document.getElementById('t-vertical-jump').value,
        standingJump: formatMeterInput(document.getElementById('t-standing-jump').value),
        standingTriple: formatMeterInput(document.getElementById('t-standing-triple').value),
        standing5Jump: formatMeterInput(document.getElementById('t-standing-5jump').value),
        standing7Jump: formatMeterInput(document.getElementById('t-standing-7jump').value),
        approach5Jump: formatMeterInput(document.getElementById('t-approach-5jump').value),
        s30m: document.getElementById('t-30m').value,
        s60m: document.getElementById('t-60m').value,
        s100m: document.getElementById('t-100m').value,
        s150m: document.getElementById('t-150m').value,
        s300w: document.getElementById('t-300w').value,
        fly30m: document.getElementById('t-fly30m').value,
        medFront: formatMeterInput(document.getElementById('t-med-front').value),
        medBack: formatMeterInput(document.getElementById('t-med-back').value),
        benchPress: formatUnitKg(document.getElementById('t-bench-press').value),
        snatch: formatUnitKg(document.getElementById('t-snatch').value),
        clean: formatUnitKg(document.getElementById('t-clean').value),
        highFullSquat: formatUnitKg(document.getElementById('t-high-full-squat').value),
        deadlift: formatUnitKg(document.getElementById('t-deadlift').value)
      };

      // ローカル保存
      localStorage.setItem(storageKey, JSON.stringify(dayData));

      const redirectAfterSave = () => {
        window.location.href = finalReturnUrl;
      };

      // Firestore保存（セット）
      if (window.db && window.firestoreOps) {
        try {
          const docRef = window.firestoreOps.doc(window.db, "track_logs", docId);
          await window.firestoreOps.setDoc(docRef, dayData, { merge: true });
          alert('コントロールテスト結果を保存・同期しました！');
          redirectAfterSave();
        } catch (error) {
          console.error('Firestore save error:', error);
          alert('ローカルには保存されましたが、Firestoreの同期に失敗しました。');
          redirectAfterSave();
        }
      } else {
        alert('コントロールテスト結果を保存しました！');
        redirectAfterSave();
      }
    };
  </script>
</body>
</html>
