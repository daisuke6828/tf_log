<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BODY VITAL LOG</title>
  
  <!-- Firebase SDK の読み込み (Auth機能も追加) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <!-- 共通のFirebase設定ファイルがあれば読み込む -->
  <script src="firebase-config.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { background: #121212; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 12px; margin: 0; padding-bottom: 90px; }
    
    .back-btn-container { margin-bottom: 12px; }
    .back-btn { display: inline-flex; align-items: center; gap: 4px; background: #1e1e1e; color: #00e676; border: 1px solid #00e676; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; text-decoration: none; cursor: pointer; }
    .back-btn:hover { background: #00e676; color: #121212; }

    h2 { color: #00e676; text-align: center; margin: 16px 0; font-size: 18px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    
    .section-label { font-size: 14px; font-weight: bold; margin-bottom: 10px; color: #fff; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #333; }
    
    input[type="date"] {
      -webkit-appearance: none;
      appearance: none;
      background-color: #222;
      color: #fff;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      width: 100%;
      height: 46px;
      box-sizing: border-box;
      outline: none;
      color-scheme: dark;
    }
    input[type="date"]:focus { border-color: #00e676; }

    .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .input-box { background: #222; border: 1px solid #333; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
    .input-box.required { border-color: #00e676; }
    .input-label { font-size: 12px; color: #aaa; display: flex; justify-content: space-between; align-items: center; }
    .required-tag { color: #ff5252; font-size: 11px; font-weight: bold; }
    .input-row { display: flex; align-items: baseline; gap: 6px; }
    .input-row input { background: transparent; border: none; color: #fff; font-size: 18px; font-weight: bold; width: 100%; outline: none; }
    .input-unit { font-size: 13px; color: #888; }

    .full-width-box { background: #222; border: 1px solid #333; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }

    .slider-container { display: flex; flex-direction: column; gap: 8px; }
    .slider-range { width: 100%; accent-color: #00e676; cursor: pointer; height: 6px; background: #444; border-radius: 3px; outline: none; }
    .slider-info { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .fatigue-text { font-weight: bold; color: #00e676; }

    .injury-card { border-radius: 10px; padding: 14px; margin-top: 8px; cursor: pointer; text-decoration: none; display: block; transition: 0.2s; }
    .injury-card:hover { opacity: 0.9; }

    .submit-fixed { position: fixed; bottom: 0; left: 0; right: 0; background: #121212; padding: 12px; border-top: 1px solid #222; z-index: 100; display: flex; justify-content: center; }
    .submit-btn { background: #00e676; color: #121212; border: none; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: bold; width: 100%; max-width: 500px; cursor: pointer; text-align: center; }
    .submit-btn:hover { background: #00c853; }
  </style>
</head>
<body>

  <div class="back-btn-container">
    <a href="calendar.html" id="back-link" class="back-btn">◀ カレンダーへ戻る</a>
  </div>

  <h2>⚖️ BODY VITAL LOG</h2>

  <div class="card">
    <div class="section-label" style="margin-bottom: 8px;">記録日 (タップして変更可能)</div>
    <input type="date" id="vital-date-input">
  </div>

  <div class="card">
    <div class="section-label">本日の身体バイタル</div>
    
    <div class="grid-2col">
      <div class="input-box required">
        <div class="input-label"><span>体重</span> <span class="required-tag">※必須</span></div>
        <div class="input-row"><input type="number" step="0.1" id="v-weight" placeholder="0.0"><span class="input-unit">kg</span></div>
      </div>
      <div class="input-box">
        <div class="input-label"><span>体脂肪率</span></div>
        <div class="input-row"><input type="number" step="0.1" id="v-fat" placeholder="0.0"><span class="input-unit">%</span></div>
      </div>
    </div>

    <div class="grid-2col">
      <div class="input-box">
        <div class="input-label"><span>筋肉量</span></div>
        <div class="input-row"><input type="number" step="0.1" id="v-muscle" placeholder="0.0"><span class="input-unit">kg</span></div>
      </div>
      <div class="input-box">
        <div class="input-label"><span>基礎代謝量</span></div>
        <div class="input-row"><input type="number" step="integer" id="v-bmr" placeholder="0"><span class="input-unit">kcal</span></div>
      </div>
    </div>

    <div class="full-width-box" style="margin-top: 10px;">
      <div class="input-label"><span>😴 睡眠時間</span></div>
      <div class="input-row"><input type="number" step="0.5" id="v-sleep" placeholder="0.0"><span class="input-unit">時間</span></div>
    </div>

    <div class="full-width-box" style="margin-top: 10px; margin-bottom: 0;">
      <div class="input-label"><span>⚡ 疲労度コンディション</span></div>
      <div class="slider-container" style="margin-top: 6px;">
        <input type="range" min="1" max="5" step="1" value="1" id="v-fatigue" class="slider-range" oninput="updateFatigueLabel(this.value)">
        <div class="slider-info">
          <span style="color: #aaa; font-size: 12px;">レベル: <span id="fatigue-val-num" style="color:#fff; font-weight:bold;">1</span></span>
          <span class="fatigue-text" id="fatigue-label-text">1：疲労なし</span>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-label" style="display:flex; align-items:center; gap:6px;"><span>🩹</span> 痛み・怪我の記録</div>
    <div id="injury-display-area">
    </div>
  </div>

  <div class="submit-fixed">
    <button class="submit-btn" onclick="saveVitalData()">身体バイタルを記録する</button>
  </div>

  <script>
    // Firebase初期化 & 認証・DBの準備
    if (!firebase.apps.length) {
      // 必要に応じた設定
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUserId = null;

    const urlParams = new URLSearchParams(window.location.search);
    const dateParam = urlParams.get('date');
    const fromParam = urlParams.get('from');
    
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    const localTodayStr = `${year}-${month}-${day}`;

    let targetDateStr = (dateParam && dateParam.trim() !== "") ? dateParam : localTodayStr;

    const dateInput = document.getElementById('vital-date-input');
    dateInput.value = targetDateStr;

    const backLink = document.getElementById('back-link');
    if (backLink) {
      if (fromParam === 'personal') {
        backLink.href = 'personal.html';
        backLink.innerHTML = '🏠 トップへ戻る';
      } else {
        backLink.href = `calendar.html?date=${targetDateStr}`;
        backLink.innerHTML = '◀ カレンダーへ戻る';
      }
    }

    dateInput.addEventListener('change', (e) => {
      if (e.target.value) {
        targetDateStr = e.target.value;
        if (fromParam !== 'personal') {
          backLink.href = `calendar.html?date=${targetDateStr}`;
        }
        loadDataForCurrentDate();
      }
    });

    const fatigueTexts = {
      1: "1：疲労なし",
      2: "2：軽く疲労を感じる",
      3: "3：疲労を感じる",
      4: "4：疲労を強く感じる",
      5: "5：練習不可"
    };

    function updateFatigueLabel(val) {
      document.getElementById('fatigue-val-num').innerText = val;
      document.getElementById('fatigue-label-text').innerText = fatigueTexts[val] || "";
    }

    // フォームを一度クリアする関数
    function clearForm() {
      document.getElementById('v-weight').value = '';
      document.getElementById('v-fat').value = '';
      document.getElementById('v-muscle').value = '';
      document.getElementById('v-bmr').value = '';
      document.getElementById('v-sleep').value = '';
      document.getElementById('v-fatigue').value = 1;
      updateFatigueLabel(1);
    }

    // 取得したデータオブジェクトをフォームとローカルストレージに反映する共通関数
    function applyDataToForm(dayData) {
      clearForm();
      if (dayData && dayData['バイタル']) {
        const v = dayData['バイタル'];
        if (v.weight !== undefined && v.weight !== '') document.getElementById('v-weight').value = v.weight;
        if (v.fat !== undefined && v.fat !== '') document.getElementById('v-fat').value = v.fat;
        if (v.muscle !== undefined && v.muscle !== '') document.getElementById('v-muscle').value = v.muscle;
        if (v.bmr !== undefined && v.bmr !== '') document.getElementById('v-bmr').value = v.bmr;
        if (v.sleep !== undefined && v.sleep !== '') document.getElementById('v-sleep').value = v.sleep;
        if (v.fatigue !== undefined && v.fatigue !== '') {
          document.getElementById('v-fatigue').value = v.fatigue;
          updateFatigueLabel(v.fatigue);
        }
      }
      renderInjurySection(dayData);
    }

    // ▼ 【修正・追加】Firestoreからデータを引っ張ってきてフォームに反映する処理
    async function loadDataForCurrentDate() {
      const storageKey = `track_log_${targetDateStr}`;
      
      // まずは即座にローカルストレージを確認してあれば表示（オフライン対策・高速化）
      let cachedData = null;
      const saved = localStorage.getItem(storageKey);
      if (saved) {
        try {
          cachedData = JSON.parse(saved);
          applyDataToForm(cachedData);
        } catch(e) {
          console.error('Data parse error', e);
        }
      } else {
        clearForm();
        renderInjurySection(null);
      }

      // ユーザーIDが分かっている場合は、Firestoreから最新データを取得し直す
      if (currentUserId) {
        try {
          const docRef = db.collection('users').doc(currentUserId).collection('track_logs').doc(targetDateStr);
          const doc = await docRef.get();
          if (doc.exists) {
            const firestoreData = doc.data();
            // ローカルストレージ側もFirestoreの最新データで更新
            localStorage.setItem(storageKey, JSON.stringify(firestoreData));
            // フォームと画面を最新データに反映
            applyDataToForm(firestoreData);
            console.log('Firestoreからデータを正常にロードしました:', targetDateStr);
          }
        } catch (error) {
          console.error('Firestoreからのデータ取得に失敗しました:', error);
        }
      }
    }

    // 認証状態を監視し、ログイン完了後にユーザーIDを確定させてからデータを読み込む
    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUserId = user.uid;
        loadDataForCurrentDate();
      } else {
        // 未ログインの場合のフォールバック
        console.warn('ユーザーがログインしていません');
        loadDataForCurrentDate();
      }
    });

    window.goToInjuryAdd = function(event) {
      if (event) event.preventDefault();

      const storageKey = `track_log_${targetDateStr}`;
      const weightVal = document.getElementById('v-weight').value;
      const fatVal = document.getElementById('v-fat').value;
      const muscleVal = document.getElementById('v-muscle').value;
      const bmrVal = document.getElementById('v-bmr').value;
      const sleepVal = document.getElementById('v-sleep').value;
      const fatigueVal = document.getElementById('v-fatigue').value;

      let dayData = {};
      const existing = localStorage.getItem(storageKey);
      if (existing) {
        try { dayData = JSON.parse(existing); } catch(e) { dayData = {}; }
      }

      dayData['バイタル'] = {
        weight: weightVal ? parseFloat(weightVal) : '',
        fat: fatVal ? parseFloat(fatVal) : '',
        muscle: muscleVal ? parseFloat(muscleVal) : '',
        bmr: bmrVal ? parseInt(bmrVal, 10) : '',
        sleep: sleepVal ? parseFloat(sleepVal) : '',
        fatigue: parseInt(fatigueVal, 10)
      };

      localStorage.setItem(storageKey, JSON.stringify(dayData));

      const fromQuery = fromParam === 'personal' ? '&from=personal' : '';
      window.location.href = `injury_add.html?date=${targetDateStr}${fromQuery}`;
    };

    function renderInjurySection(dayDataParam) {
      const area = document.getElementById('injury-display-area');
      const storageKey = `track_log_${targetDateStr}`;
      
      let hasAnyInjuryEver = false;
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && key.startsWith('track_log_')) {
            const val = localStorage.getItem(key);
            if (val) {
              const parsed = JSON.parse(val);
              if (parsed['怪我・痛み']) {
                hasAnyInjuryEver = true;
                break;
              }
            }
          }
        }
      } catch (e) {
        console.error("Injury check error", e);
      }

      let todayInjuryData = null;
      if (dayDataParam && dayDataParam['怪我・痛み']) {
        todayInjuryData = dayDataParam['怪我・痛み'];
      } else {
        const currentSaved = localStorage.getItem(storageKey);
        if (currentSaved) {
          try {
            const parsedCurrent = JSON.parse(currentSaved);
            if (parsedCurrent['怪我・痛み']) {
              todayInjuryData = parsedCurrent['怪我・痛み'];
            }
          } catch(e) {}
        }
      }

      let htmlContent = '';

      if (hasAnyInjuryEver) {
        const injuryListFrom = fromParam === 'personal' ? 'personal' : 'vital';
        htmlContent += `
          <div style="margin-bottom: 12px;">
            <div style="font-size: 11px; color: #aaa; margin-bottom: 6px;">過去に登録された怪我の経過管理はこちら</div>
            <a href="injury.html?from=${injuryListFrom}&date=${targetDateStr}" style="display: flex; align-items: center; justify-content: space-between; background: #262626; border: 1px solid #ff9800; border-radius: 10px; padding: 12px 14px; text-decoration: none; color: #fff; transition: 0.2s;">
              <div style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 16px;">📋</span>
                <div>
                  <div style="font-size: 13px; font-weight: bold; color: #ff9800;">怪我の経過を入力する (INJURY LIST)</div>
                  <div style="font-size: 11px; color: #888; margin-top: 2px;">一覧から選択して本日の経過や状態を更新する</div>
                </div>
              </div>
              <span style="color: #ff9800; font-size: 16px; font-weight: bold;">›</span>
            </a>
          </div>
        `;
      }

      if (todayInjuryData) {
        const status = todayInjuryData.status || '治療中';
        let statusColor = '#ff5252';
        let iconSymbol = '🔴';
        if (status === '回復中') {
          statusColor = '#ffa502';
          iconSymbol = '🟠';
        } else if (status === '完治') {
          statusColor = '#00ff88';
          iconSymbol = '🟢';
        }
        const painText = todayInjuryData.painLevel ? `痛み ${todayInjuryData.painLevel}` : '';

        htmlContent += `
          <div style="font-size: 11px; color: #aaa; margin-bottom: 6px;">この日の怪我・痛みデータ</div>
          <a href="#" onclick="goToInjuryAdd(event)" class="injury-card" style="border: 1px solid ${statusColor}; background: rgba(30, 30, 30, 0.9); margin-top: 0;">
            <div style="display: flex; align-items: center; justify-content: space-between;">
              <div style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 14px; color: ${statusColor};">${iconSymbol}</span>
                <div>
                  <div style="font-size: 14px; font-weight: bold; color: #fff;">${todayInjuryData.part || '部位未設定'}</div>
                  <div style="font-size: 11px; color: ${statusColor}; margin-top: 2px;">${status} ・ ${todayInjuryData.date || targetDateStr}</div>
                </div>
              </div>
              <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 11px; color: #aaa; background: #222; padding: 4px 8px; border-radius: 6px;">${painText}</span>
                <span style="color: #666; font-size: 14px;">›</span>
              </div>
            </div>
          </a>
        `;
      } else {
        htmlContent += `
          <div style="font-size: 12px; color: #aaa; margin-bottom: 8px;">
            新しい痛みや部位の状態を登録する
          </div>
          <a href="#" onclick="goToInjuryAdd(event)" style="display: flex; align-items: center; justify-content: space-between; background: #262626; border: 1px solid #00e676; border-radius: 10px; padding: 12px 14px; text-decoration: none; color: #fff; transition: 0.2s;">
            <div style="display: flex; align-items: center; gap: 10px;">
              <span style="font-size: 16px;">➕</span>
              <div>
                <div style="font-size: 13px; font-weight: bold; color: #00e676;">痛み、怪我を記録する</div>
                <div style="font-size: 11px; color: #888; margin-top: 2px;">新規の痛みや異変を記録する</div>
              </div>
            </div>
            <span style="color: #00e676; font-size: 16px; font-weight: bold;">›</span>
          </a>
        `;
      }

      area.innerHTML = htmlContent;
    }

    window.saveVitalData = async function() {
      const weightVal = document.getElementById('v-weight').value;
      if (!weightVal) {
        alert('体重は必須です');
        return;
      }

      const fatVal = document.getElementById('v-fat').value;
      const muscleVal = document.getElementById('v-muscle').value;
      const bmrVal = document.getElementById('v-bmr').value;
      const sleepVal = document.getElementById('v-sleep').value;
      const fatigueVal = document.getElementById('v-fatigue').value;

      const storageKey = `track_log_${targetDateStr}`;
      let dayData = {};
      const existing = localStorage.getItem(storageKey);
      if (existing) {
        try { 
          dayData = JSON.parse(existing); 
        } catch(e) {
          dayData = {};
        }
      }

      dayData['バイタル'] = {
        weight: parseFloat(weightVal),
        fat: fatVal ? parseFloat(fatVal) : '',
        muscle: muscleVal ? parseFloat(muscleVal) : '',
        bmr: bmrVal ? parseInt(bmrVal, 10) : '',
        sleep: sleepVal ? parseFloat(sleepVal) : '',
        fatigue: parseInt(fatigueVal, 10)
      };

      // 1. ローカルストレージに保存
      localStorage.setItem(storageKey, JSON.stringify(dayData));

      // 2. ユーザーIDに紐づけたFirestoreのパスへ保存・同期
      try {
        if (!currentUserId) {
          const currentUser = auth.currentUser;
          if (currentUser) {
            currentUserId = currentUser.uid;
          }
        }

        if (currentUserId) {
          await db.collection('users').doc(currentUserId).collection('track_logs').doc(targetDateStr).set(dayData, { merge: true });
          console.log('Firebaseへのユーザー別同期成功:', currentUserId, targetDateStr);
        } else {
          console.warn('ログインユーザーが特定できませんでしたが、ローカルには保存されました');
        }
      } catch (error) {
        console.error('Firebaseへの同期に失敗しました: ', error);
        alert('ローカルには保存されましたが、クラウド(Firebase)への同期に失敗しました。ネット接続を確認してください。');
      }

      alert('身体バイタルを保存・同期しました！');

      if (fromParam === 'personal') {
        window.location.href = 'personal.html';
      } else {
        window.location.href = `calendar.html?date=${targetDateStr}`;
      }
    };
  </script>
</body>
</html>
