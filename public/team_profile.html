<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile settings for team features</title>
  
  <!-- Firebase SDK の読み込み（コンパト版で統一） -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <style>
    body { background: #121212; color: #fff; font-family: sans-serif; padding: 12px; margin: 0; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid #333; }
    .cyan { color: #00e5ff; }
    
    .event-card { background: #252525; border-radius: 10px; padding: 12px; border-left: 4px solid #00e5ff; }
    .req-badge { background: #ff4757; color: #fff; font-size: 9px; padding: 2px 4px; border-radius: 3px; font-weight: bold; margin-left: 4px; }

    input[type="text"] { width: 100%; box-sizing: border-box; background: #252525; border: 1px solid #555; color: #fff; padding: 8px; border-radius: 6px; font-size: 12px; margin-top: 4px; }
    
    .readonly-box { width: 100%; box-sizing: border-box; background: #181818; border: 1px solid #444; color: #00e5ff; padding: 8px; border-radius: 6px; font-size: 12px; margin-top: 4px; font-weight: bold; cursor: not-allowed; }

    .pb-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 6px; }
    .pb-item { background: #1e1e1e; border: 1px solid #444; padding: 8px; border-radius: 6px; }
    .pb-item label { font-size: 10px; color: #aaa; display: block; }
    .pb-item input { margin-top: 2px; }

    .btn-submit { background: #00e5ff; color: #000; border: none; width: 100%; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; margin-top: 14px; }
    .btn-back-top { background: #00e5ff33; color: #00e5ff; border: 1px solid #00e5ff; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; margin-bottom: 10px; }
    .btn-back-top:hover { background: #00e5ff55; color: #fff; }
  </style>
</head>
<body>

<div>
  <a href="team_top.html" class="btn-back-top">← チームトップへ戻る</a>
</div>

<h3 class="cyan" style="text-align:center; margin-top:0; font-size:15px; white-space:nowrap;">⚙️ Profile settings for team features</h3>

<div class="card">
  <div class="event-card">
    <div style="background:#1e1e1e; padding:10px; border-radius:8px; border:1px solid #333;">
      <div style="font-weight:bold; font-size:12px; color:#00e5ff;">大会エントリー用設定</div>

      <div style="margin-top:10px;">
        <label style="font-size:10px; color:#aaa; display:block;">アプリ内使用のニックネーム</label>
        <div id="display-nickname" class="readonly-box">読み込み中...</div>
      </div>

      <div style="margin-top:10px;">
        <label style="font-size:10px; color:#aaa; display:block;">フルネーム（大会エントリー時使用）<span class="req-badge">必須</span></label>
        <input type="text" id="profile-username" placeholder="例: 山田 太郎">
      </div>

      <div style="margin-top:10px;">
        <label style="font-size:10px; color:#aaa; display:block;">ゼッケン番号（チーム内・大会用）<span class="req-badge">必須</span></label>
        <input type="text" id="profile-bib" placeholder="例: A-123 または 58">
      </div>

      <div style="margin-top:14px; border-top:1px dashed #444; padding-top:10px;">
        <label style="font-size:11px; font-weight:bold; color:#00e5ff; display:block;">🏆 各種目の持ち記録（自己ベスト）事前登録</label>
        <span style="font-size:9px; color:#aaa; display:block; margin-top:2px;">ここに入力しておくと、試合エントリー時に自動で記録欄に反映されます。</span>
        
        <div class="pb-grid" id="pb-inputs-container">
          <!-- JSで動的生成 -->
        </div>
      </div>

      <button class="btn-submit" onclick="saveProfile()">設定を保存</button>
    </div>
  </div>
</div>

<script>
  const auth = firebase.auth();
  const db = firebase.firestore();

  // 登録対象の種目リスト
  const eventList = [
    "100m", "200m", "300m", "400m", "800m", "1500m",
    "100mH", "110mH", "300mH", "400mH",
    "走幅跳", "三段跳", "走高跳", "棒高跳",
    "やり投", "円盤投", "砲丸投"
  ];

  // 種目ごとのプレースホルダー（数字のみの表記に統一）
  function getPlaceholder(ev) {
    if (ev === "800m" || ev === "1500m") {
      return "例: 2:05.30";
    } else {
      return "例: 10.90 / 7.15";
    }
  }

  // 起動時の初期化処理（Firestoreからデータを直接取得）
  auth.onAuthStateChanged(async (user) => {
    if (user) {
      // ユーザーの認証情報（displayNameなど）をニックネームとして表示
      document.getElementById('display-nickname').innerText = user.displayName || user.email || '未設定';

      try {
        const docRef = db.collection("team_profiles").doc(user.uid);
        const docSnap = await docRef.get();
        
        let personalBests = {};
        if (docSnap.exists) {
          const data = docSnap.data();
          if (data.username) {
            document.getElementById('profile-username').value = data.username;
          }
          if (data.bib) {
            document.getElementById('profile-bib').value = data.bib;
          }
          if (data.personalBests) {
            personalBests = data.personalBests;
          }
        }
        // Firestoreから取得した持ち記録を反映して入力欄を生成
        renderPbInputs(personalBests);
      } catch (e) {
        console.error("Firebaseからのデータ取得エラー:", e);
        renderPbInputs({});
      }
    } else {
      document.getElementById('display-nickname').innerText = '未ログイン';
      renderPbInputs({});
    }
  });

  // 持ち記録の入力グリッドを生成する関数
  function renderPbInputs(savedPbs = {}) {
    const container = document.getElementById('pb-inputs-container');
    container.innerHTML = '';

    eventList.forEach(ev => {
      const val = savedPbs[ev] || '';
      const ph = getPlaceholder(ev);
      const div = document.createElement('div');
      div.className = 'pb-item';
      div.innerHTML = `
        <label>${ev}</label>
        <input type="text" class="pb-field" data-event="${ev}" value="${val}" placeholder="${ph}">
      `;
      container.appendChild(div);
    });
  }

  // 設定保存処理（Firestoreへ直接書き込み）
  window.saveProfile = async function() {
    const user = auth.currentUser;
    if (!user) {
      alert('ログインセッションが切れました。再度ログインしてください。');
      return;
    }

    const username = document.getElementById('profile-username').value.trim();
    const bib = document.getElementById('profile-bib').value.trim();

    if (!username) {
      alert('フルネームを入力してください。');
      return;
    }
    if (!bib) {
      alert('ゼッケン番号を入力してください。');
      return;
    }

    let personalBests = {};
    document.querySelectorAll('.pb-field').forEach(input => {
      const ev = input.getAttribute('data-event');
      const val = input.value.trim();
      if (val) {
        personalBests[ev] = val;
      }
    });

    try {
      const profileData = {
        uid: user.uid,
        username: username,
        bib: bib,
        personalBests: personalBests,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      // ローカルストレージを一切使わず、Firestoreへ直接保存
      await db.collection("team_profiles").doc(user.uid).set(profileData, { merge: true });
      alert('設定（自己ベスト含む）をクラウドへ保存しました！');
      window.location.href = 'team_top.html';
    } catch (e) {
      console.error("Firebase保存エラー: ", e);
      alert('保存に失敗しました。ネットワーク状況を確認してください。');
    }
  };
</script>

</body>
</html>
