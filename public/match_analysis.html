<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>試合結果 ＆ 練習数値 逆算分析</title>
  <!-- Chart.js CDNの読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { background: #121212; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 12px; margin: 0; padding-bottom: 30px; }
    
    .back-btn-area { margin-bottom: 16px; }
    .back-btn { background: #1e1e1e; border: 1px solid #444; color: #00e5ff; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
    .back-btn:hover { background: #2a2a2a; }

    .page-title { display: flex; align-items: center; gap: 6px; font-size: 18px; font-weight: bold; color: #00e5ff; justify-content: center; margin-bottom: 16px; }

    .filter-card { background: #1e1e1e; border-radius: 12px; padding: 14px; margin-bottom: 16px; border: 1px solid #333; display: flex; flex-direction: column; gap: 10px; }
    .filter-row { display: flex; gap: 8px; align-items: center; }
    .filter-group { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .filter-label { font-size: 11px; color: #aaa; font-weight: bold; }
    
    select, input[type="date"] { background: #222; border: 1px solid #444; border-radius: 8px; padding: 10px; color: #fff; font-size: 14px; width: 100%; outline: none; -webkit-appearance: none; appearance: none; }
    select:focus, input[type="date"]:focus { border-color: #00e5ff; }

    .sub-filter-box { background: #252525; border: 1px solid #3d3d3d; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }

    .control-panel { background: #252525; border: 1px solid #444; padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 11px; }
    .control-row { margin-bottom: 8px; }
    
    .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
    .checkbox-group label { display: flex; align-items: center; gap: 4px; cursor: pointer; color: #ddd; font-size: 11px; }

    .chart-card { background: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #333; }
    .chart-title { font-size: 14px; font-weight: bold; color: #00e5ff; margin-bottom: 10px; }
    .chart-container { position: relative; width: 100%; height: 260px; }

    .empty-message { text-align: center; color: #777; padding: 40px 0; font-size: 14px; }
  </style>
</head>
<body>

  <div class="back-btn-area">
    <a href="match_deep_dive.html" class="back-btn">‹ 戻る</a>
  </div>

  <div class="page-title">
    <span>🏆</span> 試合結果 ＆ 練習数値 逆算分析
  </div>

  <div class="filter-card">
    <div class="filter-row">
      <div class="filter-group">
        <span class="filter-label">試合の絞り込みモード</span>
        <select id="filter-target-mode" onchange="toggleMatchMode(); renderAnalysis();">
          <option value="single">特定の試合（1大会）を指定</option>
          <option value="range">期間（シーズン・月単位）で指定</option>
        </select>
      </div>
    </div>

    <!-- モード：特定の試合 -->
    <div id="mode-single-box" class="filter-row">
      <div class="filter-group">
        <span class="filter-label">対象の試合を選択</span>
        <select id="filter-match-single" onchange="renderAnalysis()">
          <option value="">試合を選択してください</option>
        </select>
      </div>
    </div>

    <!-- モード：期間指定 -->
    <div id="mode-range-box" class="sub-filter-box" style="display: none;">
      <div style="font-size: 11px; font-weight: bold; color: #00e5ff;">📅 試合日の範囲指定</div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <div class="filter-group">
          <span class="filter-label">開始日</span>
          <input type="date" id="filter-match-start" onchange="renderAnalysis()">
        </div>
        <span style="color: #aaa; margin-top: 16px;">〜</span>
        <div class="filter-group">
          <span class="filter-label">終了日</span>
          <input type="date" id="filter-match-end" onchange="renderAnalysis()">
        </div>
      </div>
    </div>

    <div class="filter-row">
      <div class="filter-group">
        <span class="filter-label">分析する試合種目</span>
        <select id="filter-match-event" onchange="renderAnalysis()">
          <option value="">種目を選択してください</option>
        </select>
      </div>
    </div>

    <div class="filter-row">
      <div class="filter-group">
        <span class="filter-label">逆算する期間（試合日から遡る日数）</span>
        <select id="filter-period-range" onchange="renderAnalysis()">
          <option value="2weeks">試合前の 2週間以内</option>
          <option value="1month" selected>試合前の 1ヶ月以内</option>
          <option value="2months">試合前の 2ヶ月以内</option>
        </select>
      </div>
    </div>

    <div class="filter-row">
      <div class="filter-group">
        <span class="filter-label">ぶつける練習メニュー（スプリント・ウエイト・坂など）</span>
        <select id="filter-training-menu" onchange="renderAnalysis()">
          <option value="">メニューを選択してください</option>
        </select>
      </div>
    </div>

    <div class="filter-row">
      <div class="filter-group">
        <span class="filter-label">試合側の表示指標（Y軸）</span>
        <select id="filter-match-metric" onchange="renderAnalysis()">
          <option value="max" selected>大会中の最高記録</option>
          <option value="avg">大会中の平均記録</option>
        </select>
      </div>
    </div>
  </div>

  <div class="chart-card">
    <div class="chart-title">📊 試合結果 vs 練習数値（逆算統計）の散布図</div>
    
    <div class="control-panel">
      <div class="control-row" style="font-weight:bold; color:#aaa;">練習側の統計指標を表示する選択:</div>
      <div class="checkbox-group">
        <label><input type="checkbox" id="chk-max" checked onchange="renderAnalysis()"> 最高</label>
        <label><input type="checkbox" id="chk-mid" checked onchange="renderAnalysis()"> 中間</label>
        <label><input type="checkbox" id="chk-min" checked onchange="renderAnalysis()"> 最低</label>
        <label><input type="checkbox" id="chk-avg" checked onchange="renderAnalysis()"> 平均</label>
      </div>
    </div>

    <div class="chart-container">
      <canvas id="matchScatterChart"></canvas>
    </div>
  </div>

  <div id="analysis-result-container">
    <div class="empty-message">条件を選択してください</div>
  </div>

  <!-- Firebase初期化スクリプトの読み込み -->
  <script type="module" src="firebase-init.js"></script>

  <script type="module">
    import { db, firestoreOps } from './firebase-init.js';
    const { collection, getDocs } = firestoreOps;

    let scatterInstance = null;
    let cachedMatches = [];
    let cachedLogs = [];

    window.addEventListener('DOMContentLoaded', async () => {
      await loadData();
      initFilters();
      renderAnalysis();
    });

    async function loadData() {
      try {
        const matchSnap = await getDocs(collection(db, "match_entries"));
        let matchMap = {};
        matchSnap.forEach(docSnap => {
          const data = docSnap.data();
          if (data.matchId && data.events) {
            if (!matchMap[data.matchId]) {
              matchMap[data.matchId] = { matchId: data.matchId, entries: [] };
            }
            matchMap[data.matchId].entries.push(data);
          }
        });
        
        let scheduledEvents = [];
        try { scheduledEvents = JSON.parse(localStorage.getItem('team_events') || '[]'); } catch(e){}
        
        cachedMatches = Object.values(matchMap).map(m => {
          const found = scheduledEvents.find(ev => ev.id === m.matchId);
          return {
            matchId: m.matchId,
            name: found ? found.name : '試合',
            date: found ? found.rawDate : '2026-01-01',
            entries: m.entries
          };
        });
        // 日付順にソート
        cachedMatches.sort((a, b) => a.date.localeCompare(b.date));

        const logSnap = await getDocs(collection(db, "track_logs"));
        cachedLogs = [];
        logSnap.forEach(docSnap => {
          const dateStr = docSnap.id;
          const data = docSnap.data();
          if (data && data['練習日誌']) {
            cachedLogs.push({ date: dateStr, log: data['練習日誌'] });
          }
        });
        cachedLogs.sort((a, b) => a.date.localeCompare(b.date));

      } catch (e) {
        console.error("データ取得エラー: ", e);
      }
    }

    function initFilters() {
      const matchSingleSel = document.getElementById('filter-match-single');
      const matchEventSel = document.getElementById('filter-match-event');
      const trainingMenuSel = document.getElementById('filter-training-menu');
      const startInput = document.getElementById('filter-match-start');
      const endInput = document.getElementById('filter-match-end');

      // 特定の試合セレクトボックス初期化
      matchSingleSel.innerHTML = '<option value="">試合を選択してください</option>';
      cachedMatches.forEach(m => {
        matchSingleSel.add(new Option(`${m.name} (${m.date})`, m.matchId));
      });
      if (cachedMatches.length > 0) {
        matchSingleSel.selectedIndex = 1;
      }

      // デフォルトの期間指定（今年全体くらいをカバー）
      if (cachedMatches.length > 0) {
        startInput.value = cachedMatches[0].date;
        endInput.value = cachedMatches[cachedMatches.length - 1].date;
      } else {
        startInput.value = '2026-01-01';
        endInput.value = '2026-12-31';
      }

      // 種目のセレクトボックス初期化
      const matchEvents = new Set();
      cachedMatches.forEach(m => {
        m.entries.forEach(entry => {
          entry.events.forEach(ev => {
            if (ev.eventName && ev.eventName !== 'status') {
              matchEvents.add(ev.eventName);
            }
          });
        });
      });

      matchEventSel.innerHTML = '<option value="">種目を選択してください</option>';
      Array.from(matchEvents).sort().forEach(evName => {
        matchEventSel.add(new Option(evName, evName));
      });
      if (matchEvents.size > 0) {
        matchEventSel.selectedIndex = 1;
      }

      // 練習メニューのセレクトボックス初期化
      const trainingMenus = new Set();
      cachedLogs.forEach(item => {
        if (item.log.menus) {
          item.log.menus.forEach(m => {
            if (m.menuName) {
              trainingMenus.add(m.menuName);
            }
          });
        }
      });

      trainingMenuSel.innerHTML = '<option value="">メニューを選択してください</option>';
      Array.from(trainingMenus).sort().forEach(mName => {
        trainingMenuSel.add(new Option(mName, mName));
      });
      if (trainingMenus.size > 0) {
        trainingMenuSel.selectedIndex = 1;
      }
    }

    window.toggleMatchMode = function() {
      const mode = document.getElementById('filter-target-mode').value;
      const singleBox = document.getElementById('mode-single-box');
      const rangeBox = document.getElementById('mode-range-box');

      if (mode === 'single') {
        singleBox.style.display = 'flex';
        rangeBox.style.display = 'none';
      } else {
        singleBox.style.display = 'none';
        rangeBox.style.display = 'flex';
      }
    };

    function getDaysDifference(dateStr1, dateStr2) {
      const d1 = new Date(dateStr1);
      const d2 = new Date(dateStr2);
      return (d2 - d1) / (1000 * 60 * 60 * 24);
    }

    function calculateTrainingStats(targetMatchDate, rangeType, menuName) {
      let limitDays = 14;
      if (rangeType === '1month') limitDays = 30;
      if (rangeType === '2months') limitDays = 60;

      let values = [];

      cachedLogs.forEach(item => {
        const diff = getDaysDifference(item.date, targetMatchDate);
        if (diff > 0 && diff <= limitDays) {
          if (item.log.menus) {
            item.log.menus.forEach(m => {
              if (m.menuName === menuName) {
                let val = null;
                if (m.sets && m.sets.length > 0) {
                  const weights = m.sets.map(s => parseFloat(s.weight)).filter(w => !isNaN(w) && w > 0);
                  if (weights.length > 0) val = Math.max(...weights);
                } else if (m.reps && m.reps.length > 0) {
                  const firstStr = String(m.reps[0] || "");
                  const match = firstStr.match(/[\d.]+/);
                  if (match) val = parseFloat(match[0]);
                }

                if (val !== null && !isNaN(val)) {
                  values.push(val);
                }
              }
            });
          }
        }
      });

      if (values.length === 0) return null;

      values.sort((a, b) => a - b);
      const min = values[0];
      const max = values[values.length - 1];
      const avg = Number((values.reduce((a, b) => a + b, 0) / values.length).toFixed(2));
      const mid = values[Math.floor(values.length / 2)];

      return { max, mid, min, avg, count: values.length };
    }

    function extractMatchRecordValues(ev) {
      const rawStr = String(ev.recordValue || "");
      const matches = rawStr.match(/[\d.]+/g);
      if (!matches) return [];
      return matches.map(m => parseFloat(m)).filter(n => !isNaN(n));
    }

    window.renderAnalysis = function() {
      const mode = document.getElementById('filter-target-mode').value;
      const singleMatchId = document.getElementById('filter-match-single').value;
      const startDate = document.getElementById('filter-match-start').value;
      const endDate = document.getElementById('filter-match-end').value;

      const selectedMatchEvent = document.getElementById('filter-match-event').value;
      const periodRange = document.getElementById('filter-period-range').value;
      const selectedTrainingMenu = document.getElementById('filter-training-menu').value;
      const matchMetric = document.getElementById('filter-match-metric').value;
      const container = document.getElementById('analysis-result-container');

      if (!selectedMatchEvent) {
        container.innerHTML = '<div class="empty-message">分析する試合種目を選択してください</div>';
        if (scatterInstance) scatterInstance.destroy();
        return;
      }

      if (!selectedTrainingMenu) {
        container.innerHTML = '<div class="empty-message">比較する練習メニューを選択してください</div>';
        if (scatterInstance) scatterInstance.destroy();
        return;
      }

      if (mode === 'single' && !singleMatchId) {
        container.innerHTML = '<div class="empty-message">対象の試合を選択してください</div>';
        if (scatterInstance) scatterInstance.destroy();
        return;
      }

      let scatterDatasetsData = { max: [], mid: [], min: [], avg: [] };
      let totalPoints = 0;

      cachedMatches.forEach(match => {
        // 絞り込み条件に合致するか判定
        if (mode === 'single') {
          if (match.matchId !== singleMatchId) return;
        } else {
          if (startDate && match.date < startDate) return;
          if (endDate && match.date > endDate) return;
        }

        match.entries.forEach(entry => {
          entry.events.forEach(ev => {
            if (ev.eventName && ev.eventName !== 'status') {
              if (ev.eventName === selectedMatchEvent) {
                
                const matchValues = extractMatchRecordValues(ev);
                if (matchValues.length > 0) {
                  let targetMatchVal = null;
                  if (matchMetric === 'max') {
                    targetMatchVal = Math.max(...matchValues);
                  } else if (matchMetric === 'avg') {
                    const sum = matchValues.reduce((a, b) => a + b, 0);
                    targetMatchVal = Number((sum / matchValues.length).toFixed(2));
                  }

                  if (targetMatchVal !== null) {
                    const stats = calculateTrainingStats(match.date, periodRange, selectedTrainingMenu);
                    if (stats) {
                      const matchLabel = `${match.name} (${match.date})`;
                      scatterDatasetsData.max.push({ x: stats.max, y: targetMatchVal, label: matchLabel, user: entry.username });
                      scatterDatasetsData.mid.push({ x: stats.mid, y: targetMatchVal, label: matchLabel, user: entry.username });
                      scatterDatasetsData.min.push({ x: stats.min, y: targetMatchVal, label: matchLabel, user: entry.username });
                      scatterDatasetsData.avg.push({ x: stats.avg, y: targetMatchVal, label: matchLabel, user: entry.username });
                      totalPoints++;
                    }
                  }
                }
              }
            }
          });
        });
      });

      if (totalPoints === 0) {
        container.innerHTML = '<div class="empty-message">該当するデータが見つかりませんでした（条件を見直してください）</div>';
        if (scatterInstance) scatterInstance.destroy();
        return;
      }

      container.innerHTML = `<div style="font-size:12px; color:#aaa; margin-bottom:10px; text-align:center;">分析対象データ数: ${totalPoints}件 (${selectedMatchEvent})</div>`;

      const showMax = document.getElementById('chk-max').checked;
      const showMid = document.getElementById('chk-mid').checked;
      const showMin = document.getElementById('chk-min').checked;
      const showAvg = document.getElementById('chk-avg').checked;

      let datasets = [];
      if (showMax) datasets.push({ label: '最高値', data: scatterDatasetsData.max, backgroundColor: '#00ff88', pointRadius: 7 });
      if (showMid) datasets.push({ label: '中間値', data: scatterDatasetsData.mid, backgroundColor: '#4dabf7', pointRadius: 7 });
      if (showMin) datasets.push({ label: '最低値', data: scatterDatasetsData.min, backgroundColor: '#ff4757', pointRadius: 7 });
      if (showAvg) datasets.push({ label: '平均値', data: scatterDatasetsData.avg, backgroundColor: '#ff9f43', pointRadius: 7 });

      const metricLabelName = matchMetric === 'max' ? '大会中の最高記録' : '大会中の平均記録';

      const ctx = document.getElementById('matchScatterChart').getContext('2d');
      if (scatterInstance) scatterInstance.destroy();

      scatterInstance = new Chart(ctx, {
        type: 'scatter',
        data: { datasets: datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: '#fff', font: { size: 11 } } },
            tooltip: {
              callbacks: {
                label: function(context) {
                  const pt = context.raw;
                  return `${pt.user} / ${pt.label} [練習数値: ${pt.x} ⇔ 試合(${metricLabelName}): ${pt.y}]`;
                }
              }
            }
          },
          scales: {
            x: { 
              title: { display: true, text: `練習メニュー (${selectedTrainingMenu}) の数値`, color: '#aaa' },
              ticks: { color: '#aaa', font: { size: 10 } }, 
              grid: { color: '#222' } 
            },
            y: { 
              title: { display: true, text: `試合結果 (${metricLabelName}) - ${selectedMatchEvent}`, color: '#aaa' },
              ticks: { color: '#aaa', font: { size: 10 } }, 
              grid: { color: '#333' } 
            }
          }
        }
      });
    };
  </script>
</body>
</html>
