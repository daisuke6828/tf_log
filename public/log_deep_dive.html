<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>練習日誌 深掘り＆分析</title>
  <!-- Chart.js CDNの読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Firebase SDK の読み込み (コンパット版) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <!-- 共通のFirebase設定ファイル -->
  <script src="firebase-config.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { background: #121212; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 12px; margin: 0; padding-bottom: 80px; }
    
    .page-title { display: flex; align-items: center; gap: 6px; font-size: 18px; font-weight: bold; color: #00e676; margin-bottom: 16px; justify-content: center; }

    .filter-card { background: #1e1e1e; border-radius: 12px; padding: 14px; margin-bottom: 16px; border: 1px solid #333; display: flex; flex-direction: column; gap: 10px; }
    .filter-row { display: flex; gap: 8px; align-items: center; }
    .filter-group { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .filter-label { font-size: 11px; color: #aaa; font-weight: bold; }
    .range-tilde { font-size: 14px; color: #aaa; align-self: flex-end; padding-bottom: 10px; }
    
    select { background: #222; border: 1px solid #444; border-radius: 8px; padding: 10px; color: #fff; font-size: 14px; width: 100%; outline: none; -webkit-appearance: none; appearance: none; }
    select:focus { border-color: #00e676; }

    .control-panel { background: #252525; border: 1px solid #444; padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 11px; }
    .control-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
    .control-row select { margin: 0; padding: 6px; font-size: 11px; height: 32px; }
    
    .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
    .checkbox-group label { display: flex; align-items: center; gap: 4px; cursor: pointer; color: #ddd; font-size: 11px; }

    .chart-card { background: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #333; display: none; }
    .chart-title { font-size: 14px; font-weight: bold; color: #00e676; margin-bottom: 10px; }
    .chart-container { position: relative; width: 100%; height: 220px; }

    #deep-dive-container {
      max-height: 42vh;
      overflow-y: auto;
      padding-right: 4px;
    }
    #deep-dive-container::-webkit-scrollbar { width: 6px; }
    #deep-dive-container::-webkit-scrollbar-track { background: #161616; border-radius: 4px; }
    #deep-dive-container::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

    .menu-accordion-card { background: #1e1e1e; border-radius: 12px; margin-bottom: 12px; border: 1px solid #333; overflow: hidden; }
    .accordion-header { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: #1a1a1a; transition: 0.2s; }
    .accordion-header:hover { background: #252525; }
    .accordion-title { font-size: 15px; font-weight: bold; color: #00e676; display: flex; align-items: center; gap: 8px; }
    .accordion-count { font-size: 12px; background: #333; color: #aaa; padding: 2px 8px; border-radius: 10px; }
    .accordion-arrow { font-size: 12px; color: #888; }
    .accordion-content { display: none; padding: 12px 16px; background: #161616; border-top: 1px solid #333; }

    .log-item-card { background: #222; border-radius: 8px; padding: 12px; margin-bottom: 10px; border: 1px solid #333; }
    .log-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; }
    .log-date-link { color: #00e676; text-decoration: none; font-weight: bold; }
    .log-date-link:hover { text-decoration: underline; }
    .log-location-tag { font-size: 10px; background: #333; color: #ccc; padding: 2px 6px; border-radius: 4px; }
    .log-details-text { font-size: 13px; color: #ddd; margin-top: 4px; }
    .set-row-view { font-size: 12px; color: #ccc; background: #2a2a2a; padding: 4px 8px; border-radius: 4px; margin-top: 4px; display: flex; justify-content: space-between; }

    .empty-message { text-align: center; color: #777; padding: 40px 0; font-size: 14px; }

    /* ボトムナビゲーション */
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #1a1a1a; border-top: 1px solid #333; display: flex; justify-content: space-around; padding: 6px 0; z-index: 1000; }
    .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #777; font-size: 9px; font-weight: bold; gap: 2px; flex: 1; }
    .nav-item.active { color: #00e676; }
    .nav-icon { font-size: 16px; }
  </style>
</head>
<body>

  <div class="page-title">
    <span>📈</span> 練習日誌 深掘り＆分析
  </div>

  <div class="filter-card">
    <div class="filter-row">
      <div class="filter-group">
        <span class="filter-label">期間の絞り込み方法</span>
        <select id="filter-period-type" onchange="handlePeriodTypeChange()">
          <option value="all">全期間</option>
          <option value="single_year">特定の年を指定</option>
          <option value="year_range">年の範囲を指定 (〇年 〜 〇年)</option>
          <option value="single_month">特定の月を指定 (〇年〇月)</option>
          <option value="month_range">月の範囲を指定 (〇月 〜 〇月)</option>
        </select>
      </div>
    </div>

    <div class="filter-row" id="single-year-row" style="display:none;">
      <div class="filter-group">
        <span class="filter-label">対象の年</span>
        <select id="filter-single-year" onchange="renderDeepDive()"></select>
      </div>
    </div>

    <div class="filter-row" id="year-range-row" style="display:none;">
      <div class="filter-group">
        <span class="filter-label">開始年</span>
        <select id="filter-start-year" onchange="renderDeepDive()"></select>
      </div>
      <div class="range-tilde">〜</div>
      <div class="filter-group">
        <span class="filter-label">終了年</span>
        <select id="filter-end-year" onchange="renderDeepDive()"></select>
      </div>
    </div>

    <div class="filter-row" id="single-month-row" style="display:none;">
      <div class="filter-group">
        <span class="filter-label">対象の月 (年月)</span>
        <select id="filter-single-month" onchange="renderDeepDive()"></select>
      </div>
    </div>

    <div class="filter-row" id="month-range-row" style="display:none;">
      <div class="filter-group">
        <span class="filter-label">開始月</span>
        <select id="filter-start-month" onchange="renderDeepDive()"></select>
      </div>
      <div class="range-tilde">〜</div>
      <div class="filter-group">
        <span class="filter-label">終了月</span>
        <select id="filter-end-month" onchange="renderDeepDive()"></select>
      </div>
    </div>

    <div class="filter-row">
      <div class="filter-group">
        <span class="filter-label">メニュー毎に絞り込み</span>
        <select id="filter-menu" onchange="renderDeepDive()">
          <option value="all">すべてのメニュー (折りたたみ一覧)</option>
        </select>
      </div>
    </div>

    <div class="filter-row">
      <div class="filter-group">
        <span class="filter-label">グラフの表示パターン</span>
        <select id="filter-graph-display" onchange="renderDeepDive()">
          <option value="both">折れ線 ＆ 分布図（両方上下に並べる）</option>
          <option value="line">折れ線グラフのみ表示</option>
          <option value="scatter">分布図のみ表示</option>
        </select>
      </div>
    </div>
  </div>

  <div class="chart-card" id="chart-card-wrapper">
    <div class="chart-title">📊 成長推移グラフ (折れ線)</div>
    
    <div class="control-panel">
      <div class="control-row">
        <div style="font-weight:bold; color:#aaa; white-space:nowrap;">データの並び順（ソート）:</div>
        <select id="sortOrder" onchange="renderDeepDive()">
          <option value="date-asc">日付順（古い順）</option>
          <option value="date-desc">日付順（新しい順）</option>
          <option value="val-desc">記録が高い順</option>
          <option value="val-asc">記録が低い順</option>
        </select>
      </div>

      <div style="font-weight:bold; color:#aaa; margin-top:4px;">表示するラインを選択:</div>
      <div class="checkbox-group">
        <label><input type="checkbox" id="chk-max" checked onchange="renderDeepDive()"> 最高</label>
        <label><input type="checkbox" id="chk-mid" checked onchange="renderDeepDive()"> 中間</label>
        <label><input type="checkbox" id="chk-min" checked onchange="renderDeepDive()"> 最低</label>
        <label><input type="checkbox" id="chk-avg" checked onchange="renderDeepDive()"> 平均</label>
      </div>
    </div>

    <div class="chart-container">
      <canvas id="trendChart"></canvas>
    </div>
  </div>

  <div class="chart-card" id="scatter-card-wrapper">
    <div class="chart-title">📉 分布図 (コンディション相関)</div>
    <div class="chart-container">
      <canvas id="scatterChart"></canvas>
    </div>
  </div>

  <div id="deep-dive-container">
    <div class="empty-message">データを読み込み中...</div>
  </div>

  <!-- ボトムナビゲーション -->
  <nav class="bottom-nav">
    <a href="history.html" class="nav-item">
      <span class="nav-icon">📋</span>
      <span>履歴</span>
    </a>
    <a href="vital_deep_dive.html" class="nav-item">
      <span class="nav-icon">⚖️</span>
      <span>バイタル</span>
    </a>
    <a href="log_deep_dive.html" class="nav-item active">
      <span class="nav-icon">📈</span>
      <span>日誌詳細</span>
    </a>
    <a href="match_deep_dive.html" class="nav-item">
      <span class="nav-icon">🎯</span>
      <span>試合詳細</span>
    </a>
  </nav>

  <script>
    const auth = firebase.auth();
    const db = firebase.firestore();
    let currentUserId = null;

    const DEFAULT_LOG_MENUS = ["30m", "60m", "80m", "100m", "120m", "150m", "20+40", "30+30", "40+20", "短助走跳躍", "中助走跳躍", "全助走跳躍"];
    const DEFAULT_SLOPE_MENUS = ["急勾配 50m", "緩勾配 100m", "階段ダッシュ"];
    const DEFAULT_WEIGHT_MENUS = ["ベンチプレス", "クリーン", "フルスクワット", "ハーフスクワット", "クォータースクワット"];

    let lineChartInstance = null;
    let scatterChartInstance = null;
    let cachedLogs = [];

    function getCustomMenus(key) { try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) { return []; } }

    async function getAllLogs() {
      if (cachedLogs.length > 0) return cachedLogs;
      let logs = [];
      if (!currentUserId) return logs;

      try {
        const querySnapshot = await db.collection("users").doc(currentUserId).collection("track_logs").get();
        querySnapshot.forEach((docSnap) => {
          const dateStr = docSnap.id;
          const data = docSnap.data();
          if (data) {
            const logData = data['練習日誌'] ? data['練習日誌'] : data;
            
            // 💡 locations（複数場所）または旧 menus からメニューを安全に回収してまとめる
            let unifiedMenus = [];
            if (logData.locations && logData.locations.length > 0) {
              logData.locations.forEach(loc => {
                if (loc.menus && loc.menus.length > 0) {
                  loc.menus.forEach(m => {
                    unifiedMenus.push({ ...m, location: loc.location });
                  });
                }
              });
            } else if (logData.menus && logData.menus.length > 0) {
              unifiedMenus = logData.menus;
            }

            if (unifiedMenus.length > 0 || logData.rpe || logData.condition) {
              logs.push({ 
                date: dateStr, 
                log: { 
                  ...logData, 
                  menus: unifiedMenus, 
                  location: logData.location || (logData.locations && logData.locations[0] ? logData.locations[0].location : '競技場') 
                } 
              });
            }
          }
        });
        logs.sort((a, b) => b.date.localeCompare(a.date));
        cachedLogs = logs;
      } catch (e) {
        console.error("Firebaseからの練習日誌取得に失敗しました:", e);
      }
      return cachedLogs;
    }

    function initFilters(logs) {
      const years = new Set();
      const yearMonths = new Set();
      
      logs.forEach(item => { 
        const parts = item.date.split('-');
        if (parts.length >= 2) {
          years.add(parts[0]);
          yearMonths.add(`${parts[0]}-${parts[1]}`);
        }
      });

      const sortedYears = Array.from(years).sort(); 
      const sortedYearMonths = Array.from(yearMonths).sort();

      const singleYearSel = document.getElementById('filter-single-year');
      const startYearSel = document.getElementById('filter-start-year');
      const endYearSel = document.getElementById('filter-end-year');
      const singleMonthSel = document.getElementById('filter-single-month');
      const startMonthSel = document.getElementById('filter-start-month');
      const endMonthSel = document.getElementById('filter-end-month');

      singleYearSel.innerHTML = '';
      startYearSel.innerHTML = ''; endYearSel.innerHTML = '';
      singleMonthSel.innerHTML = '';
      startMonthSel.innerHTML = ''; endMonthSel.innerHTML = '';

      sortedYears.forEach(y => {
        singleYearSel.add(new Option(`${y}年`, y));
        startYearSel.add(new Option(`${y}年`, y));
        endYearSel.add(new Option(`${y}年`, y));
      });
      if (sortedYears.length > 0) {
        singleYearSel.value = sortedYears[sortedYears.length - 1];
        startYearSel.value = sortedYears[0];
        endYearSel.value = sortedYears[sortedYears.length - 1];
      }

      sortedYearMonths.forEach(ym => {
        const [y, m] = ym.split('-');
        const label = `${y}年${m}月`;
        singleMonthSel.add(new Option(label, ym));
        startMonthSel.add(new Option(label, ym));
        endMonthSel.add(new Option(label, ym));
      });
      if (sortedYearMonths.length > 0) {
        singleMonthSel.value = sortedYearMonths[sortedYearMonths.length - 1];
        startMonthSel.value = sortedYearMonths[0];
        endMonthSel.value = sortedYearMonths[sortedYearMonths.length - 1];
      }

      const menuSelect = document.getElementById('filter-menu');
      const allMenuNames = new Set([
        ...DEFAULT_LOG_MENUS, ...getCustomMenus('custom_log_menus'),
        ...DEFAULT_SLOPE_MENUS, ...getCustomMenus('custom_slope_menus'),
        ...DEFAULT_WEIGHT_MENUS, ...getCustomMenus('custom_weight_menus')
      ]);

      logs.forEach(item => {
        if (item.log.menus) {
          item.log.menus.forEach(m => { if (m.menuName) allMenuNames.add(m.menuName); });
        }
      });

      menuSelect.innerHTML = '<option value="all">すべてのメニュー (折りたたみ一覧)</option>';
      Array.from(allMenuNames).sort().forEach(menuName => {
        menuSelect.add(new Option(menuName, menuName));
      });
    }

    async function handlePeriodTypeChange() {
      const type = document.getElementById('filter-period-type').value;
      document.getElementById('single-year-row').style.display = (type === 'single_year') ? 'flex' : 'none';
      document.getElementById('year-range-row').style.display = (type === 'year_range') ? 'flex' : 'none';
      document.getElementById('single-month-row').style.display = (type === 'single_month') ? 'flex' : 'none';
      document.getElementById('month-range-row').style.display = (type === 'month_range') ? 'flex' : 'none';
      await renderDeepDive();
    }

    function formatMenuDetails(m) {
      if (m.sets && m.sets.length > 0) {
        return m.sets.map((s, idx) => `<div class="set-row-view"><span>Set ${idx + 1}</span><span>${s.weight || 0} kg × ${s.repsCount || 0} レップ</span></div>`).join('');
      } else if (m.reps && m.reps.length > 0) {
        return `<div class="log-details-text"><b>本数詳細:</b> ${m.reps.join(' / ')}</div>`;
      }
      return '';
    }

    async function renderDeepDive() {
      const container = document.getElementById('deep-dive-container');
      const periodType = document.getElementById('filter-period-type').value;
      const singleYear = document.getElementById('filter-single-year').value;
      const startYear = document.getElementById('filter-start-year').value;
      const endYear = document.getElementById('filter-end-year').value;
      const singleMonth = document.getElementById('filter-single-month').value;
      const startMonth = document.getElementById('filter-start-month').value;
      const endMonth = document.getElementById('filter-end-month').value;
      const selectedMenu = document.getElementById('filter-menu').value;
      const graphDisplay = document.getElementById('filter-graph-display').value;

      const logs = await getAllLogs();
      if (logs.length === 0) {
        container.innerHTML = '<div class="empty-message">保存されている練習日誌がありません</div>';
        hideCharts();
        return;
      }

      const filteredLogs = logs.filter(item => {
        const [y, m, d] = item.date.split('-');
        const ym = `${y}-${m}`;

        if (periodType === 'single_year') {
          if (y !== singleYear) return false;
        } else if (periodType === 'year_range') {
          if (y < startYear || y > endYear) return false;
        } else if (periodType === 'single_month') {
          if (ym !== singleMonth) return false;
        } else if (periodType === 'month_range') {
          if (ym < startMonth || ym > endMonth) return false;
        }
        return true;
      });

      if (filteredLogs.length === 0) {
        container.innerHTML = '<div class="empty-message">指定した期間内に一致するデータはありません</div>';
        hideCharts();
        return;
      }

      const lineCard = document.getElementById('chart-card-wrapper');
      const scatterCard = document.getElementById('scatter-card-wrapper');

      if (selectedMenu !== 'all') {
        if (graphDisplay === 'both' || graphDisplay === 'line') {
          lineCard.style.display = 'block';
        } else {
          lineCard.style.display = 'none';
        }

        if (graphDisplay === 'both' || graphDisplay === 'scatter') {
          scatterCard.style.display = 'block';
        } else {
          scatterCard.style.display = 'none';
        }

        updateCharts(filteredLogs, selectedMenu);
      } else {
        hideCharts();
      }

      if (selectedMenu !== 'all') {
        let html = '';
        let count = 0;

        filteredLogs.forEach(item => {
          if (item.log.menus) {
            item.log.menus.forEach(m => {
              if (m.menuName === selectedMenu) {
                count++;
                html += `
                  <div class="log-item-card">
                    <div class="log-item-header">
                      <a href="calendar.html?date=${item.date}" class="log-date-link">📅 ${item.date}</a>
                      <span class="log-location-tag">${item.log.location || '競技場'}</span>
                    </div>
                    ${formatMenuDetails(m)}
                    ${item.log.memo ? `<div style="font-size:11px; color:#aaa; margin-top:6px;">メモ: ${item.log.memo}</div>` : ''}
                  </div>
                `;
              }
            });
          }
        });

        if (count === 0) {
          container.innerHTML = `<div class="empty-message">「${selectedMenu}」の記録は見つかりませんでした</div>`;
        } else {
          container.innerHTML = `<div style="font-size:12px; color:#aaa; margin-bottom:10px;">「${selectedMenu}」の検索結果: ${count}件</div>` + html;
        }
        return;
      }

      let menuMap = {};
      filteredLogs.forEach(item => {
        if (item.log.menus) {
          item.log.menus.forEach(m => {
            const name = m.menuName || '不明なメニュー';
            if (!menuMap[name]) menuMap[name] = [];
            menuMap[name].push({ date: item.date, location: item.log.location, menuData: m, memo: item.log.memo });
          });
        }
      });

      if (Object.keys(menuMap).length === 0) {
        container.innerHTML = '<div class="empty-message">該当するメニューデータがありません</div>';
        return;
      }

      let accordionHtml = '';
      Object.keys(menuMap).sort().forEach(menuName => {
        const historyList = menuMap[menuName];
        let itemsHtml = '';
        historyList.forEach(h => {
          itemsHtml += `
            <div class="log-item-card">
              <div class="log-item-header">
                <a href="calendar.html?date=${h.date}" class="log-date-link">📅 ${h.date}</a>
                <span class="log-location-tag">${h.location || '競技場'}</span>
              </div>
              ${formatMenuDetails(h.menuData)}
              ${h.memo ? `<div style="font-size:11px; color:#aaa; margin-top:6px;">メモ: ${h.memo}</div>` : ''}
            </div>
          `;
        });

        accordionHtml += `
          <div class="menu-accordion-card">
            <div class="accordion-header" onclick="toggleAccordion(this)">
              <div class="accordion-title">
                <span>⚡ ${menuName}</span>
                <span class="accordion-count">${historyList.length}回</span>
              </div>
              <span class="accordion-arrow">▼ 展開</span>
            </div>
            <div class="accordion-content">
              ${itemsHtml}
            </div>
          </div>
        `;
      });

      container.innerHTML = accordionHtml;
    }

    function hideCharts() {
      document.getElementById('chart-card-wrapper').style.display = 'none';
      document.getElementById('scatter-card-wrapper').style.display = 'none';
    }

    function updateCharts(filteredLogs, menuName) {
      let menuDataPoints = [];
      filteredLogs.forEach(item => {
        if (item.log.menus) {
          item.log.menus.forEach(m => {
            if (m.menuName === menuName) {
              let val = null;
              if (m.sets && m.sets.length > 0) {
                val = Math.max(...m.sets.map(s => parseFloat(s.weight) || 0));
              } else if (m.reps && m.reps.length > 0) {
                let firstRepStr = m.reps[0] || "";
                let numMatch = firstRepStr.match(/[\d.]+/);
                val = numMatch ? parseFloat(numMatch[0]) : null;
              }

              if (val !== null && !isNaN(val)) {
                menuDataPoints.push({
                  date: item.date,
                  value: val,
                  condition: Number(item.log.condition) || 5
                });
              }
            }
          });
        }
      });

      if (menuDataPoints.length === 0) return;

      const sortOrder = document.getElementById('sortOrder').value;
      menuDataPoints.sort((a, b) => {
        if (sortOrder === 'date-asc') {
          return a.date.localeCompare(b.date);
        } else if (sortOrder === 'date-desc') {
          return b.date.localeCompare(a.date);
        } else if (sortOrder === 'val-desc') {
          return b.value - a.value;
        } else if (sortOrder === 'val-asc') {
          return a.value - b.value;
        }
      });

      // スプリント種目（タイム計測系：メニュー名に "m" が含まれる、または m/s ではないものなど）の判定
      const isTimeUnit = menuName.includes('m') && !menuName.includes('m/s');

      const graphDisplay = document.getElementById('filter-graph-display').value;

      if (graphDisplay === 'both' || graphDisplay === 'line') {
        const labels = menuDataPoints.map(d => d.date);
        const rawValues = menuDataPoints.map(d => d.value);

        let maxArr = [];
        let minArr = [];
        let avgArr = [];
        let midArr = [];

        let runningMax = isTimeUnit ? Infinity : -Infinity;
        let runningMin = isTimeUnit ? -Infinity : Infinity;
        let runningSum = 0;

        rawValues.forEach((val, idx) => {
          if (isTimeUnit) {
            // タイム系：小さい方が速い（最高）
            if (val < runningMax) runningMax = val;
            if (val > runningMin) runningMin = val;
          } else {
            // 重量・回数系：大きい方が最高
            if (val > runningMax) runningMax = val;
            if (val < runningMin) runningMin = val;
          }

          runningSum += val;
          const runningAvg = runningSum / (idx + 1);
          const runningMid = (runningMax + runningMin) / 2;

          maxArr.push(runningMax);
          minArr.push(runningMin);
          avgArr.push(Number(runningAvg.toFixed(2)));
          midArr.push(Number(runningMid.toFixed(2)));
        });

        const showMax = document.getElementById('chk-max').checked;
        const showMid = document.getElementById('chk-mid').checked;
        const showMin = document.getElementById('chk-min').checked;
        const showAvg = document.getElementById('chk-avg').checked;

        const lineDatasets = [];
        if (showMax) lineDatasets.push({ label: isTimeUnit ? '最速 (最高)' : '最高', data: maxArr, borderColor: '#00ff88', backgroundColor: '#00ff88', tension: 0.2 });
        if (showMid) lineDatasets.push({ label: '中間', data: midArr, borderColor: '#4dabf7', backgroundColor: '#4dabf7', tension: 0.2, borderDash: [4, 4] });
        if (showMin) lineDatasets.push({ label: isTimeUnit ? '最遅 (最低)' : '最低', data: minArr, borderColor: '#ff4757', backgroundColor: '#ff4757', tension: 0.2 });
        if (showAvg) lineDatasets.push({ label: '平均', data: avgArr, borderColor: '#ff9f43', backgroundColor: '#ff9f43', tension: 0.2, borderWidth: 3 });

        const ctxLine = document.getElementById('trendChart').getContext('2d');
        if (lineChartInstance) lineChartInstance.destroy();

        lineChartInstance = new Chart(ctxLine, {
          type: 'line',
          data: { labels: labels, datasets: lineDatasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#fff', font: { size: 11 } } } },
            scales: {
              x: { ticks: { color: '#aaa', font: { size: 10 } }, grid: { color: '#222' } },
              y: { 
                reverse: isTimeUnit, // タイム系ならY軸を反転させて速いタイムを上に配置！
                ticks: { color: '#aaa', font: { size: 10 } }, 
                grid: { color: '#333' } 
              }
            }
          }
        });
      }

      if (graphDisplay === 'both' || graphDisplay === 'scatter') {
        const scatterData = menuDataPoints.map(d => ({
          x: d.condition,
          y: d.value,
          date: d.date
        }));

        const ctxScatter = document.getElementById('scatterChart').getContext('2d');
        if (scatterChartInstance) scatterChartInstance.destroy();

        scatterChartInstance = new Chart(ctxScatter, {
          type: 'scatter',
          data: {
            datasets: [{
              label: `${menuName} の分布`,
              data: scatterData,
              backgroundColor: '#4dabf7',
              pointRadius: 6,
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { labels: { color: '#fff', font: { size: 11 } } },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    const point = context.raw;
                    return `日付: ${point.date} / コンディション: ${point.x} / 記録: ${point.y}`;
                  }
                }
              }
            },
            scales: {
              x: { 
                type: 'linear',
                position: 'bottom',
                min: 0.5,
                max: 10.5,
                title: { display: true, text: 'コンディション (1:悪 〜 10:良)', color: '#aaa' },
                ticks: { 
                  stepSize: 1,
                  color: '#aaa', 
                  font: { size: 10 }
                }, 
                grid: { color: '#222' } 
              },
              y: { 
                reverse: isTimeUnit, // 分布図側もタイム系なら上下反転して直感的にする
                title: { display: true, text: '記録', color: '#aaa' },
                ticks: { color: '#aaa', font: { size: 10 } }, 
                grid: { color: '#333' } 
              }
            }
          }
        });
      }
    }

    window.toggleAccordion = function(headerEl) {
      const contentEl = headerEl.nextElementSibling;
      const arrowEl = headerEl.querySelector('.accordion-arrow');
      if (contentEl.style.display === 'block') {
        contentEl.style.display = 'none';
        arrowEl.innerText = '▼ 展開';
      } else {
        contentEl.style.display = 'block';
        arrowEl.innerText = '▲ 閉じる';
      }
    };

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUserId = user.uid;
      } else {
        currentUserId = null;
        console.warn('ユーザーがログインしていません');
      }
      
      cachedLogs = [];
      const logs = await getAllLogs();
      initFilters(logs);
      await renderDeepDive();
    });
  </script>
</body>
</html>
