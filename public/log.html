<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Training LOG</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { background: #121212; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 12px; margin: 0; padding-bottom: 40px; width: 100%; max-width: 100%; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid #333; }
    .green { color: #00e676; }
    .btn-back { display: inline-flex; align-items: center; margin-bottom: 14px; color: #00e676; text-decoration: none; font-weight: bold; font-size: 13px; background: transparent; border: 1.5px solid #00e676; padding: 6px 14px; border-radius: 20px; }
    .btn-save { width: 100%; padding: 14px; background: #00e676; color: #000; font-weight: bold; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; margin-top: 10px; }
    .btn-save:hover { background: #00c853; }
    .btn-delete { width: 100%; padding: 12px; background: transparent; color: #ff5252; border: 1px solid #ff5252; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-add { width: 100%; padding: 14px; background: transparent; color: #00e676; border: 1.5px dashed #00e676; border-radius: 10px; font-weight: bold; font-size: 14px; margin-top: 10px; cursor: pointer; }
    .btn-small-add { width: 100%; padding: 12px; background: transparent; color: #00e676; border: 1.5px dashed #00e676; border-radius: 10px; font-size: 13px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .rpe-tags { display: flex; justify-content: space-between; font-size: 11px; color: #888888; margin-top: 6px; }
    .rpe-val-display { font-weight: bold; color: #00e676; font-size: 16px; }
    .menu-block { border: 1px solid #333333; border-left: 3.5px solid #00e676; padding: 14px; border-radius: 8px; margin-bottom: 14px; background: #161616; position: relative; }
    .menu-top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; color: #aaa; }
    .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .input-wrapper { display: flex; align-items: center; background: #262626; border: 1px solid #444444; border-radius: 6px; padding: 6px 10px; flex: 1; }
    .input-wrapper input { background: transparent; border: none; outline: none; width: 100%; color: #fff; font-size: 14px; }
    .unit { font-size: 12px; color: #aaaaaa; margin-left: 4px; white-space: nowrap; }
    select, input[type="text"], input[type="date"], input[type="range"] { padding: 10px; border: 1px solid #444444; border-radius: 8px; width: 100%; box-sizing: border-box; font-size: 14px; background: #262626; color: #fff; margin-bottom: 8px; }
    select:focus, input:focus { outline: none; border-color: #00e676; }
    label { font-size: 12px; color: #00e676; display: block; margin-bottom: 4px; font-weight: 600; }
    .inline-set-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .inline-set-row label { width: 60px; margin-bottom: 0; font-size: 13px; color: #00e676; white-space: nowrap; }
  </style>
</head>
<body>

  <a href="calendar.html" class="btn-back">◀ カレンダーへ戻る</a>
  <h3 style="text-align:center; color:#00e676; margin: 4px 0 16px; font-size: 20px;">🏃‍♂️ Training LOG</h3>

  <div class="card">
    <label>記録日</label>
    <input type="date" id="log-date">

    <div style="font-weight:bold; margin:14px 0 8px; font-size:14px; display:flex; justify-content:space-between;">
      <span>1. 本日のコンディション</span>
      <span id="rpe-text" class="rpe-val-display">7 / 10 (かなりきつい)</span>
    </div>
    <label>自覚疲労度 (RPE)</label>
    <input type="range" min="1" max="10" value="7" id="rpe-range">
    <div class="rpe-tags"><span>1: 非常に楽</span><span>5: 普通</span><span>10: 限界</span></div>
  </div>

  <div class="card">
    <div style="font-weight:bold; margin-bottom:12px; font-size:14px;">2. 練習メニューの入力</div>
    <div id="menu-container"></div>
    <button class="btn-add" onclick="window.addMenuBlock()">＋ 次のメニューを追加する</button>
  </div>

  <input type="hidden" id="log-original-date" value="">
  <button class="btn-save" onclick="window.saveData()">【 本日の記録を一括保存 】</button>
  <div id="log-delete-area" style="display:none; margin-top: 10px;">
    <button class="btn-delete" onclick="window.deleteData()">🗑️ 練習日誌を削除する</button>
  </div>

  <script>
    const DEFAULT_LOG_MENUS = ["30m", "60m", "80m", "100m", "120m", "150m", "20+40", "30+30", "40+20", "短助走跳躍", "中助走跳躍", "全助走跳躍"];
    const DEFAULT_WEIGHT_MENUS = ["ベンチプレス", "クリーン", "フルスクワット", "ハーフスクワット", "クォータースクワット"];

    function getCustomLogMenus() { try { return JSON.parse(localStorage.getItem('custom_log_menus') || '[]'); } catch (e) { return []; } }
    function addCustomLogMenuIfNeeded(val) {
      const trimmed = val ? val.trim() : "";
      if (!trimmed || DEFAULT_LOG_MENUS.includes(trimmed)) return;
      let custom = getCustomLogMenus();
      if (!custom.includes(trimmed)) { custom.push(trimmed); localStorage.setItem('custom_log_menus', JSON.stringify(custom)); }
    }
    function getCustomWeightMenus() { try { return JSON.parse(localStorage.getItem('custom_weight_menus') || '[]'); } catch (e) { return []; } }
    function addCustomWeightMenuIfNeeded(val) {
      const trimmed = val ? val.trim() : "";
      if (!trimmed || DEFAULT_WEIGHT_MENUS.includes(trimmed) || trimmed === '手入力') return;
      let custom = getCustomWeightMenus();
      if (!custom.includes(trimmed)) { custom.push(trimmed); localStorage.setItem('custom_weight_menus', JSON.stringify(custom)); }
    }
    function buildLogMenuSelectOptions(selectedVal = "") {
      const custom = getCustomLogMenus();
      const baseList = [...DEFAULT_LOG_MENUS, ...custom];
      let isCustomVal = selectedVal && !baseList.includes(selectedVal);
      let html = "";
      baseList.forEach(opt => { html += `<option value="${opt}" ${opt === selectedVal ? 'selected' : ''}>${opt}</option>`; });
      html += `<option value="__custom__" ${isCustomVal ? 'selected' : ''}>＋ 手入力する...</option>`;
      return html;
    }
    function buildWeightSelectOptions(selectedVal = "") {
      const custom = getCustomWeightMenus();
      const baseList = [...DEFAULT_WEIGHT_MENUS, ...custom];
      let isCustomVal = selectedVal && !baseList.includes(selectedVal);
      let html = "";
      baseList.forEach(opt => { html += `<option value="${opt}" ${opt === selectedVal ? 'selected' : ''}>${opt}</option>`; });
      html += `<option value="手入力" ${isCustomVal ? 'selected' : ''}>＋ 手入力する</option>`;
      return html;
    }

    const rpeLabelsMap = { 1: "非常に楽", 2: "楽", 3: "やや楽", 4: "普通", 5: "普通", 6: "ややきつい", 7: "かなりきつい", 8: "非常にきつい", 9: "ほぼ限界", 10: "限界" };
    window.updateRpeText = function(val) {
      const displayEl = document.getElementById('rpe-text');
      if (displayEl) { displayEl.innerText = `${val} / 10 (${rpeLabelsMap[val] || ''})`; }
    };
    document.getElementById('rpe-range').addEventListener('input', (e) => window.updateRpeText(e.target.value));

    window.handleAreaTypeChange = function(selectEl) {
      const areaType = selectEl.value;
      const parentBlock = selectEl.closest('.menu-block');
      parentBlock.querySelector('.area-track-section').style.display = (areaType === '競技場') ? 'block' : 'none';
      parentBlock.querySelector('.area-weight-section').style.display = (areaType === 'ウエイト') ? 'block' : 'none';
      parentBlock.querySelector('.area-slope-section').style.display = (areaType === '坂') ? 'block' : 'none';
    };
    window.handleWeightMenuChange = function(selectEl) {
      const val = selectEl.value;
      const weightSection = selectEl.closest('.area-weight-section');
      const customInput = weightSection.querySelector('.weight-custom-input');
      customInput.style.display = (val === '手入力') ? 'block' : 'none';
      if (val === '手入力') customInput.focus(); else customInput.value = '';
    };
    window.handleMenuSelectChange = function(selectEl) {
      const val = selectEl.value;
      const parentBlock = selectEl.closest('.area-track-section');
      const customInput = parentBlock.querySelector('.log-menu-custom-input');
      customInput.style.display = (val === '__custom__') ? 'block' : 'none';
      if (val === '__custom__') { customInput.value = ''; customInput.focus(); } else { customInput.value = ''; }
    };
    window.addTrackRepRow = function(btn) {
      const container = btn.parentElement.querySelector('.track-reps-container');
      const count = container.querySelectorAll('.inline-set-row').length + 1;
      const div = document.createElement('div');
      div.className = 'inline-set-row';
      div.innerHTML = `
        <label>${count}本目</label>
        <input type="text" class="log-menu-val" placeholder="タイム/レップ詳細" style="margin-bottom:0;">
        <button type="button" onclick="this.closest('.inline-set-row').remove()" style="background:transparent; border:none; color:#ff5252; font-size:11px; cursor:pointer;">削除</button>
      `;
      container.appendChild(div);
    };
    window.addWeightSet = function(btn) {
      const container = btn.parentElement.querySelector('.weight-sets-container');
      const count = container.querySelectorAll('.row').length + 1;
      const div = document.createElement('div');
      div.className = 'row';
      div.innerHTML = `
        <div style="width:48px; font-size:12px; color:#aaa;">set ${count}</div>
        <div style="flex:1;" class="input-wrapper"><input type="number" step="0.5" class="weight-set-load" placeholder="0"><span class="unit">kg</span></div>
        <div style="flex:1;" class="input-wrapper"><input type="number" class="weight-set-reps" placeholder="0"><span class="unit">レップ</span></div>
        <button type="button" onclick="this.closest('.row').remove()" style="background:transparent; border:none; color:#ff5252; font-size:11px; cursor:pointer;">削除</button>
      `;
      container.appendChild(div);
    };

    window.buildMenuBlockHtml = function(idx, m = {}) {
      const areaType = m.areaType || '競技場';
      const isCustomTrack = m.menuName && !([...DEFAULT_LOG_MENUS, ...getCustomLogMenus()].includes(m.menuName));
      const trackVal = isCustomTrack ? '__custom__' : (m.menuName || '30m');
      const customTrackDisplay = isCustomTrack ? 'block' : 'none';

      const isCustomWeight = m.menuName && !([...DEFAULT_WEIGHT_MENUS, ...getCustomWeightMenus()].includes(m.menuName));
      const weightVal = isCustomWeight ? '手入力' : (m.menuName || 'フルスクワット');
      const customWeightDisplay = isCustomWeight ? 'block' : 'none';

      const reps = m.reps && m.reps.length > 0 ? m.reps : [''];
      let repsHtml = '';
      reps.forEach((r, rIdx) => {
        repsHtml += `
          <div class="inline-set-row">
            <label>${rIdx + 1}本目</label>
            <input type="text" class="log-menu-val" value="${r||''}" placeholder="タイム/レップ詳細" style="margin-bottom:0;">
            ${rIdx > 0 ? `<button type="button" onclick="this.closest('.inline-set-row').remove()" style="background:transparent; border:none; color:#ff5252; font-size:11px; cursor:pointer;">削除</button>` : ''}
          </div>
        `;
      });

      const sets = m.sets && m.sets.length > 0 ? m.sets : [{ weight: '', repsCount: '' }];
      let setsHtml = '';
      sets.forEach((s, sIdx) => {
        setsHtml += `
          <div class="row">
            <div style="width:48px; font-size:12px; color:#aaa;">set ${sIdx + 1}</div>
            <div style="flex:1;" class="input-wrapper"><input type="number" step="0.5" class="weight-set-load" placeholder="0" value="${s.weight||''}"><span class="unit">kg</span></div>
            <div style="flex:1;" class="input-wrapper"><input type="number" class="weight-set-reps" placeholder="0" value="${s.repsCount||''}"><span class="unit">レップ</span></div>
            ${sIdx > 0 ? `<button type="button" onclick="this.closest('.row').remove()" style="background:transparent; border:none; color:#ff5252; font-size:11px; cursor:pointer;">削除</button>` : ''}
          </div>
        `;
      });

      return `<div class="menu-block">
        <div class="menu-top-row">
          <span>種別：</span>
          <button type="button" onclick="this.closest('.menu-block').remove()" style="background:transparent; border:none; color:#ff5252; font-size:14px; cursor:pointer;">×</button>
        </div>
        <select class="log-area-type-select" onchange="window.handleAreaTypeChange(this)">
          <option value="競技場" ${areaType==='競技場'?'selected':''}>競技場</option>
          <option value="ウエイト" ${areaType==='ウエイト'?'selected':''}>ウエイト</option>
          <option value="坂" ${areaType==='坂'?'selected':''}>坂</option>
        </select>
        
        <div class="area-track-section" style="display:${areaType==='競技場'?'block':'none'};">
          <select class="log-menu-select" onchange="window.handleMenuSelectChange(this)">
            ${buildLogMenuSelectOptions(trackVal)}
          </select>
          <input type="text" class="log-menu-custom-input" value="${isCustomTrack?(m.menuName||''):''}" placeholder="カスタムメニュー名" style="display:${customTrackDisplay};">
          <div class="track-reps-container">${repsHtml}</div>
          <button type="button" class="btn-small-add" onclick="window.addTrackRepRow(this)">＋ 本数を追加 (2本目...)</button>
        </div>

        <div class="area-weight-section" style="display:${areaType==='ウエイト'?'block':'none'};">
          <select class="weight-menu-select" onchange="window.handleWeightMenuChange(this)">
            ${buildWeightSelectOptions(weightVal)}
          </select>
          <input type="text" class="weight-custom-input" value="${isCustomWeight?(m.menuName||''):''}" placeholder="カスタム種目名" style="display:${customWeightDisplay};">
          <div class="weight-sets-container">${setsHtml}</div>
          <button type="button" class="btn-small-add" onclick="window.addWeightSet(this)">＋ 本数を追加 (2本目...)</button>
        </div>

        <div class="area-slope-section" style="display:${areaType==='坂'?'block':'none'};">
          <input type="text" class="slope-memo-input" value="${m.slopeContent||''}" placeholder="坂の勾配・本数などメモ">
        </div>
      </div>`;
    };

    window.addMenuBlock = function() {
      const container = document.getElementById('menu-container');
      if (!container) return;
      const div = document.createElement('div');
      div.innerHTML = buildMenuBlockHtml(0, { areaType: '競技場', menuName: '30m', reps: [''] });
      container.appendChild(div.firstElementChild);
    };

    function initPage() {
      const params = new URLSearchParams(window.location.search);
      const dateParam = params.get('date') || new Date().toISOString().split('T')[0];

      document.getElementById('log-date').value = dateParam;
      document.getElementById('log-original-date').value = dateParam;

      const storageKey = `track_log_${dateParam}`;
      const savedDataStr = localStorage.getItem(storageKey);
      const dayData = savedDataStr ? JSON.parse(savedDataStr) : {};
      const l = dayData['練習日誌'];

      const container = document.getElementById('menu-container');
      container.innerHTML = '';
      const deleteArea = document.getElementById('log-delete-area');

      if (l) {
        const val = l.rpe || 7;
        document.getElementById('rpe-range').value = val;
        window.updateRpeText(val);

        if (l.menus && l.menus.length > 0) {
          l.menus.forEach((m, idx) => {
            const div = document.createElement('div');
            div.innerHTML = buildMenuBlockHtml(idx, m);
            container.appendChild(div.firstElementChild);
          });
        }
        deleteArea.style.display = 'block';
      } else {
        document.getElementById('rpe-range').value = 7;
        window.updateRpeText(7);
        const div = document.createElement('div');
        div.innerHTML = buildMenuBlockHtml(0, { areaType: '競技場', menuName: '30m', reps: [''] });
        container.appendChild(div.firstElementChild);
        deleteArea.style.display = 'none';
      }
    }

    window.saveData = function() {
      let dateVal = document.getElementById('log-date').value;
      if (!dateVal) { alert('日付を選択してください'); return; }

      const menus = [];
      document.querySelectorAll('.menu-block').forEach(block => {
        const areaType = block.querySelector('.log-area-type-select').value;
        if (areaType === '競技場') {
          const selectEl = block.querySelector('.log-menu-select');
          const customInput = block.querySelector('.log-menu-custom-input');
          const menuName = selectEl.value === '__custom__' ? (customInput ? customInput.value.trim() : '') : selectEl.value;
          addCustomLogMenuIfNeeded(menuName);
          menus.push({ areaType, menuName, reps: Array.from(block.querySelectorAll('.log-menu-val')).map(inp => inp.value) });
        } else if (areaType === 'ウエイト') {
          const selectEl = block.querySelector('.weight-menu-select');
          const customInput = block.querySelector('.weight-custom-input');
          const menuName = selectEl.value === '手入力' ? (customInput ? customInput.value.trim() : '') : selectEl.value;
          addCustomWeightMenuIfNeeded(menuName);
          const sets = Array.from(block.querySelectorAll('.row')).filter(r => r.querySelector('.weight-set-load')).map(row => ({
            weight: row.querySelector('.weight-set-load')?.value || '',
            repsCount: row.querySelector('.weight-set-reps')?.value || ''
          }));
          menus.push({ areaType, menuName, sets });
        } else if (areaType === '坂') {
          menus.push({ areaType, slopeContent: block.querySelector('.slope-memo-input')?.value || '' });
        }
      });
      const dataObj = { rpe: document.getElementById('rpe-range').value, menus };

      const originalDate = document.getElementById('log-original-date').value;
      if (originalDate && originalDate !== dateVal) {
        let oldDayKey = `track_log_${originalDate}`, oldDayData = JSON.parse(localStorage.getItem(oldDayKey) || '{}');
        delete oldDayData['練習日誌'];
        Object.keys(oldDayData).length === 0 ? localStorage.removeItem(oldDayKey) : localStorage.setItem(oldDayKey, JSON.stringify(oldDayData));
      }

      let dayKey = `track_log_${dateVal}`, dayData = JSON.parse(localStorage.getItem(dayKey) || '{}');
      dayData['練習日誌'] = dataObj;
      localStorage.setItem(dayKey, JSON.stringify(dayData));
      alert(`${dateVal} の【 練習日誌 】を保存しました！`);
      window.location.href = `calendar.html?date=${dateVal}`;
    };

    window.deleteData = function() {
      const targetDate = document.getElementById('log-date').value;
      if (!targetDate) return;
      if (confirm(`${targetDate} の練習日誌を削除してもよろしいですか？`)) {
        let dayKey = `track_log_${targetDate}`, dayData = JSON.parse(localStorage.getItem(targetDate) || '{}');
        delete dayData['練習日誌'];
        Object.keys(dayData).length === 0 ? localStorage.removeItem(dayKey) : localStorage.setItem(dayKey, JSON.stringify(dayData));
        alert('削除しました');
        window.location.href = `calendar.html?date=${targetDate}`;
      }
    };

    window.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
