<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陸上チーム データ & ランキング</title>
    
    <!-- Firebase SDK の読み込み (コンパット版) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <style>
      body { background: #121212; color: #fff; font-family: sans-serif; padding: 12px; margin: 0; }
      .btn-back-top { background: #00e5ff33; color: #00e5ff; border: 1px solid #00e5ff; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; margin-bottom: 10px; }
      .btn-back-top:hover { background: #00e5ff55; color: #fff; }
      .cyan-title { color: #00e5ff; text-align: center; margin-top: 0; }

      .card { background: #1e1e1e; border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid #333; }
      .green { color: #00ff88; }
      .text-gray { color: #aaa; }
      
      /* タブUI */
      .tab-group { display: flex; gap: 4px; background: #2a2a2a; padding: 4px; border-radius: 8px; margin-bottom: 12px; }
      .tab-btn { flex: 1; background: transparent; color: #aaa; border: none; padding: 8px 4px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
      .tab-btn.active { background: #00e5ff; color: #000; }

      /* プルダウンセレクト・入力 */
      select, input[type="text"] { width: 100%; box-sizing: border-box; background: #252525; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 10px; cursor: pointer; }

      /* メンバーカード・ランキング行 */
      .member-card { background: #252525; border: 1px solid #333; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
      .rank-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: #252525; border-radius: 6px; margin-bottom: 6px; border: 1px solid #333; }
      
      .tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; background: #333; color: #00e5ff; border: 1px solid #00e5ff; }
    </style>
</head>
<body>

<div>
  <a href="team_top.html" class="btn-back-top">← トップへ戻る</a>
</div>
<h3 class="cyan-title">📊 チームデータ & ランキング</h3>

<!-- モード切り替えタブ -->
<div class="tab-group">
  <button class="tab-btn active" onclick="switchTab('ranking', this)">🏆 種目別ランキング</button>
  <button class="tab-btn" onclick="switchTab('members', this)">👥 メンバー別PB一覧</button>
</div>

<!-- ================= 1. 種目別ランキングタブ ================= -->
<div id="tab-ranking" class="card">
  <div style="font-weight:bold; font-size:13px; margin-bottom:6px;">種目を選択</div>
  
  <select id="event-select" onchange="onEventChange(this.value)">
    <option value="">読み込み中...</option>
  </select>

  <div id="ranking-list">
    読み込み中...
  </div>
</div>

<!-- ================= 2. メンバー別PB一覧タブ ================= -->
<div id="tab-members" class="card" style="display:none;">
  <div style="font-weight:bold; font-size:13px; margin-bottom:6px;">メンバーを選択または検索</div>
  
  <!-- メンバー選択プルダウン -->
  <select id="member-select" onchange="onMemberSelectChange(this.value)">
    <option value="all">すべてのメンバーを表示</option>
  </select>

  <!-- 文字検索用入力フィールド -->
  <input type="text" id="search-input" placeholder="またはメンバー名で検索..." oninput="onSearchInput()">

  <div id="member-list-container">
    読み込み中...
  </div>
</div>

<script>
  const auth = firebase.auth();
  const db = firebase.firestore();

  let teamData = [];
  let currentTeamId = null;

  // 1. ログイン認証とチームIDの取得
  auth.onAuthStateChanged(async (user) => {
    if (!user) {
      alert("ログインセッションが見つかりません。ログイン画面へ移動します。");
      location.href = 'index.html';
      return;
    }

    try {
      const userDoc = await db.collection("users").doc(user.uid).get();
      if (!userDoc.exists || !userDoc.data().teamId) {
        alert("所属チーム情報が見つかりません。チーム参加画面へ移動します。");
        location.href = 'team_entry.html';
        return;
      }

      currentTeamId = userDoc.data().teamId;
      fetchTeamMembersAndPBs();

    } catch (e) {
      console.error("認証エラー:", e);
      alert("チーム情報の取得に失敗しました。");
    }
  });

  // 2. 所属チームのメンバー全員と、それぞれの personal_bests を取得
  async function fetchTeamMembersAndPBs() {
    try {
      const usersSnapshot = await db.collection("users").where("teamId", "==", currentTeamId).get();
      
      if (usersSnapshot.empty) {
        document.getElementById('ranking-list').innerHTML = '<div class="text-gray" style="font-size:12px; text-align:center; padding:10px;">チームメンバーが見つかりません</div>';
        document.getElementById('member-list-container').innerHTML = '<div class="text-gray" style="font-size:12px; text-align:center; padding:10px;">チームメンバーが見つかりません</div>';
        return;
      }

      let membersList = [];

      for (const userDoc of usersSnapshot.docs) {
        const userData = userDoc.data();
        const userId = userDoc.id;
        const name = userData.name || userData.displayName || "名前未設定";

        try {
          const pbSnapshot = await db.collection("users").doc(userId).collection("personal_bests").get();
          let records = [];
          pbSnapshot.forEach(pbDoc => {
            records.push(pbDoc.data());
          });

          membersList.push({
            id: userId,
            name: name,
            records: records
          });
        } catch (pbErr) {
          console.error(`${name} のPB取得エラー:`, pbErr);
          membersList.push({ id: userId, name: name, records: [] });
        }
      }

      teamData = membersList;

      const selectEventElem = document.getElementById('event-select');
      updateEventDropdown(selectEventElem.value);

      const selectMemberElem = document.getElementById('member-select');
      updateMemberDropdown(selectMemberElem.value);

      renderMembers();

    } catch (error) {
      console.error("チームデータ取得エラー: ", error);
      document.getElementById('ranking-list').innerHTML = '<div class="text-gray" style="font-size:12px; text-align:center; padding:10px;">データの読み込みに失敗しました</div>';
      document.getElementById('member-list-container').innerHTML = '<div class="text-gray" style="font-size:12px; text-align:center; padding:10px;">データの読み込みに失敗しました</div>';
    }
  }

  window.switchTab = function(tabName, btn) {
    document.querySelectorAll('.tab-group:first-of-type .tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    document.getElementById('tab-ranking').style.display = tabName === 'ranking' ? 'block' : 'none';
    document.getElementById('tab-members').style.display = tabName === 'members' ? 'block' : 'none';
  };

  window.onEventChange = function(eventTarget) {
    renderRanking(eventTarget);
  };

  window.onMemberSelectChange = function(selectedName) {
    document.getElementById('search-input').value = '';
    renderMembers();
  };

  window.onSearchInput = function() {
    document.getElementById('member-select').value = 'all';
    renderMembers();
  };

  function updateEventDropdown(previousValue) {
    const eventsSet = new Set();
    teamData.forEach(m => {
      if (m.records && Array.isArray(m.records)) {
        m.records.forEach(r => { if (r.event) eventsSet.add(r.event); });
      }
    });

    const selectElem = document.getElementById('event-select');
    const eventsArray = Array.from(eventsSet);

    if (eventsArray.length === 0) {
      selectElem.innerHTML = '<option value="">登録されている記録がありません</option>';
      document.getElementById('ranking-list').innerHTML = '<div class="text-gray" style="font-size:12px; text-align:center; padding:10px;">記録がありません</div>';
      return;
    }

    selectElem.innerHTML = eventsArray.map(ev => `<option value="${ev}">${ev}</option>`).join('');
    if (eventsArray.includes(previousValue)) {
      selectElem.value = previousValue;
    } else {
      selectElem.value = eventsArray[0];
    }

    renderRanking(selectElem.value);
  }

  function updateMemberDropdown(previousValue) {
    const selectElem = document.getElementById('member-select');
    let optionsHtml = '<option value="all">すべてのメンバーを表示</option>';
    
    teamData.forEach(m => {
      if (m.name) {
        optionsHtml += `<option value="${m.name}">${m.name}</option>`;
      }
    });

    selectElem.innerHTML = optionsHtml;
    selectElem.value = previousValue || 'all';
  }

  function renderRanking(eventTarget) {
    let list = [];
    teamData.forEach(m => {
      if (!m.records) return;
      const rec = m.records.find(r => r.event === eventTarget);
      if (rec) {
        const val = rec.recordDisplay || rec.record;
        list.push({ name: m.name, result: val, date: rec.date });
      }
    });

    const container = document.getElementById('ranking-list');
    if (list.length === 0) {
      container.innerHTML = '<div class="text-gray" style="font-size:12px; text-align:center; padding:10px;">この種目の記録がありません</div>';
      return;
    }

    let html = '';
    list.forEach((item, index) => {
      const rankColor = index === 0 ? 'color: #ffd700;' : index === 1 ? 'color: #c0c0c0;' : index === 2 ? 'color: #cd7f32;' : 'color: #aaa;';
      html += `
        <div class="rank-row">
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="font-weight:bold; font-size:13px; ${rankColor}">#${index + 1}</span>
            <span style="font-size:13px; font-weight:bold;">${item.name}</span>
          </div>
          <div>
            <span style="font-size:14px; font-weight:bold;" class="green">${item.result}</span>
            <span style="font-size:10px; color:#888; margin-left:4px;">(${item.date || '日付不明'})</span>
          </div>
        </div>
      `;
    });
    container.innerHTML = html;
  }

  function renderMembers() {
    const container = document.getElementById('member-list-container');
    const selectedMember = document.getElementById('member-select').value;
    const searchQuery = document.getElementById('search-input').value.trim();

    let filtered = teamData.filter(m => m.name);

    if (searchQuery !== '') {
      filtered = filtered.filter(m => m.name.includes(searchQuery));
    } else if (selectedMember !== 'all') {
      filtered = filtered.filter(m => m.name === selectedMember);
    }
    
    if (filtered.length === 0) {
      container.innerHTML = '<div class="text-gray" style="font-size:12px; text-align:center; padding:10px;">メンバーが見つかりません</div>';
      return;
    }

    let html = '';
    filtered.forEach(m => {
      let recsHtml = '';
      if (m.records && m.records.length > 0) {
        m.records.forEach(r => {
          const val = r.recordDisplay || r.record;
          const windStr = r.wind ? ` (${r.wind})` : '';
          const compStr = r.competition ? `大会: ${r.competition}` : (r.place ? `場所: ${r.place}` : '記録会・練習');
          const dateStr = r.date ? r.date.replace(/-/g, '/') : '';

          recsHtml += `
            <div style="background: #1a1a1a; border: 1px solid #333; border-left: 3px solid #00e5ff; border-radius: 6px; padding: 8px 10px; margin-bottom: 6px;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                <span style="font-size: 13px; font-weight: bold; color: #fff;">${r.event}</span>
                <div>
                  <span style="font-size: 15px; font-weight: bold;" class="green">${val}</span>
                  <span style="font-size: 11px; color: #aaa;">${windStr}</span>
                </div>
              </div>
              <div style="display: flex; justify-content: space-between; font-size: 10px; color: #888;">
                <span>📅 ${dateStr}</span>
                <span>🏷️ ${compStr}</span>
              </div>
            </div>
          `;
        });
      } else {
        recsHtml = '<div style="font-size: 11px; color: #888; text-align: center; padding: 6px;">登録された自己ベストはありません</div>';
      }

      html += `
        <div class="member-card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 6px;">
            <strong style="font-size: 14px; color: #ffd700;">👤 ${m.name}</strong>
            <span class="tag">選手</span>
          </div>
          <div>
            ${recsHtml}
          </div>
        </div>
      `;
    });
    container.innerHTML = html;
  }
</script>

</body>
</html>
