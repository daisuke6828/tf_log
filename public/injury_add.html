<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRACK & FIELD APP - INJURY LOG</title>
  
  <!-- Firebase (App, Firestore, Auth) の SDK読み込み (v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAb2u6KAqvesS0ruc8npdwZlDiWUpQywQQ",
      authDomain: "tf-log.firebaseapp.com",
      projectId: "tf-log",
      storageBucket: "tf-log.firebasestorage.app",
      messagingSenderId: "469720285191",
      appId: "1:469720285191:web:302849209f97b010b62aa2",
      measurementId: "G-NE1RQKENVR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUserId = null;

    window.addEventListener('DOMContentLoaded', () => {
      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          try {
            const cred = await signInAnonymously(auth);
            currentUserId = cred.user.uid;
          } catch (e) {
            console.error("匿名ログイン失敗:", e);
          }
        } else {
          currentUserId = user.uid;
        }
      });
    });

    // グローバルに保存関数を公開
    window.saveInjuryDataToCloud = async function(injuryData) {
      if (!currentUserId) {
        console.warn("ユーザーIDがまだ取得できていませんが、ローカルに保存します。");
        return;
      }

      try {
        const injuryRef = collection(db, "users", currentUserId, "injuries");
        await addDoc(injuryRef, injuryData);
        console.log("Firestoreへの保存成功");
      } catch (e) {
        console.error("Firestore保存エラー: ", e);
      }
    };
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { background: #121212; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 16px; margin: 0; padding-bottom: 90px; }
    
    .top-nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .back-btn { display: inline-flex; align-items: center; gap: 4px; background: #1e1e1e; color: #00ff88; border: 1px solid #333; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; text-decoration: none; cursor: pointer; }
    .back-btn:hover { border-color: #00ff88; background: #252525; }

    /* タイトルを真ん中揃え */
    h2 { color: #00ff88; font-size: 18px; margin: 0 0 16px 0; text-align: center; }

    /* カードコンテナ */
    .card { background: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 14px; border: 1px solid #333; }
    .section-label { font-size: 12px; color: #aaa; margin-bottom: 8px; font-weight: bold; }

    /* 部位入力・チップス */
    .input-box { background: #121212; border: 1px solid #333; border-radius: 10px; padding: 12px; margin-bottom: 4px; }
    .input-box input { background: transparent; border: none; color: #fff; font-size: 14px; width: 100%; outline: none; }
    .input-box input::placeholder { color: #666; }
    
    .chips-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; white-space: nowrap; -webkit-overflow-scrolling: touch; margin-top: 6px; }
    .chips-scroll::-webkit-scrollbar { display: none; }
    .chip { background: #121212; border: 1px solid #333; color: #ccc; padding: 6px 12px; border-radius: 16px; font-size: 11px; cursor: pointer; user-select: none; flex-shrink: 0; transition: 0.2s; }
    .chip:hover { border-color: #00ff88; }
    .chip.selected { background: #16261e; border-color: #00ff88; color: #00ff88; font-weight: bold; }

    /* 状況・原因ボックス（2段） */
    .stacked-box { background: #121212; border: 1px solid #333; border-radius: 10px; padding: 4px 12px; }
    .stacked-input { background: transparent; border: none; color: #fff; font-size: 13px; width: 100%; outline: none; padding: 10px 0; }
    .stacked-input:not(:last-child) { border-bottom: 1px solid #252525; }
    .stacked-input::placeholder { color: #666; }

    /* 痛みレベル（カウンター式 + / -） */
    .pain-control-row { display: flex; justify-content: space-between; align-items: center; background: #121212; border: 1px solid #333; border-radius: 10px; padding: 10px 14px; }
    .pain-value-text { font-size: 15px; font-weight: bold; color: #ff5252; }
    .counter-group { display: flex; align-items: center; background: #1e1e1e; border-radius: 8px; overflow: hidden; border: 1px solid #444; }
    .counter-btn { background: transparent; border: none; color: #fff; font-size: 18px; width: 36px; height: 34px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .counter-btn:active { background: #333; }
    .counter-divider { width: 1px; height: 18px; background: #444; }

    /* 状態切り替えボタン（3択） */
    .status-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: #121212; border: 1px solid #333; border-radius: 10px; padding: 4px; }
    .status-tab { background: transparent; border: none; color: #888; padding: 8px 0; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; text-align: center; transition: all 0.2s; }
    .status-tab.active { background: #00ff88; color: #000; box-shadow: 0 2px 6px rgba(0,255,136,0.3); }

    /* メモエリア */
    textarea.memo-input { background: #121212; border: 1px solid #333; border-radius: 10px; padding: 12px; color: #fff; font-size: 13px; width: 100%; min-height: 80px; resize: vertical; outline: none; }
    textarea.memo-input::placeholder { color: #666; }
    textarea.memo-input:focus { border-color: #00ff88; }

    /* 固定保存ボタン */
    .submit-fixed { position: fixed; bottom: 0; left: 0; right: 0; background: #121212; padding: 12px 16px; border-top: 1px solid #222; z-index: 100; display: flex; justify-content: center; }
    .submit-btn { background: #00ff88; color: #000; border: none; border-radius: 20px; padding: 12px; font-size: 14px; font-weight: bold; width: 100%; max-width: 500px; cursor: pointer; text-align: center; box-shadow: 0 4px 12px rgba(0,255,136,0.2); }
    .submit-btn:hover { background: #00cc6a; }
  </style>
</head>
<body>

  <!-- 上部ナビゲーション（左：バイタルへ戻る / 右：一覧へ戻る） -->
  <div class="top-nav-bar">
    <a href="vital.html" id="back-link" class="back-btn">◀ 身体バイタルへ戻る</a>
    <a href="injury.html" class="back-btn">一覧へ戻る ▶</a>
  </div>

  <h2>🩹 怪我・痛みの記録</h2>

  <!-- 部位 -->
  <div class="card">
    <div class="section-label">部位</div>
    <div class="input-box">
      <input type="text" id="injury-part-input" placeholder="例: アキレス腱、腰 など">
    </div>
    <div style="font-size: 10px; color: #888; margin-bottom: 8px;">入力・選択可</div>
    
    <div class="chips-scroll">
      <div class="chip" onclick="selectPartChip(this)">肩</div>
      <div class="chip" onclick="selectPartChip(this)">背中</div>
      <div class="chip" onclick="selectPartChip(this)">腰</div>
      <div class="chip" onclick="selectPartChip(this)">ハムストリング</div>
      <div class="chip" onclick="selectPartChip(this)">前もも</div>
      <div class="chip" onclick="selectPartChip(this)">ふくらはぎ</div>
      <div class="chip" onclick="selectPartChip(this)">足首</div>
      <div class="chip" onclick="selectPartChip(this)">アキレス腱</div>
      <div class="chip" onclick="selectPartChip(this)">足部</div>
    </div>
  </div>

  <!-- 怪我をした日 -->
  <div class="card">
    <div class="section-label">怪我をした日</div>
    <div class="input-box" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0;">
      <span style="color: #aaa; font-size: 13px;">日付選択</span>
      <input type="date" id="injury-date" style="width: auto; color-scheme: dark; font-weight: bold;" onchange="updateBackLinkDate()">
    </div>
  </div>

  <!-- 状況・原因 -->
  <div class="card">
    <div class="section-label">状況・原因</div>
    <div class="stacked-box">
      <input type="text" id="injury-situation" class="stacked-input" placeholder="どこで（練習 / 試合 / 補強 など）">
      <input type="text" id="injury-cause" class="stacked-input" placeholder="なぜ怪我したか（負荷の蓄積、踏切時の違和感 など）">
    </div>
  </div>

  <!-- 痛みレベル -->
  <div class="card">
    <div class="section-label" id="pain-label-title">痛みレベル（3・中程度）</div>
    <div class="pain-control-row">
      <span class="pain-value-text" id="pain-display">3 / 5</span>
      <div class="counter-group">
        <button class="counter-btn" onclick="changePain(-1)">-</button>
        <div class="counter-divider"></div>
        <button class="counter-btn" onclick="changePain(1)">+</button>
      </div>
    </div>
  </div>

  <!-- 状態 -->
  <div class="card">
    <div class="section-label">状態</div>
    <div class="status-grid">
      <button class="status-tab active" onclick="setStatus(this, '治療中')">治療中</button>
      <button class="status-tab" onclick="setStatus(this, '回復中')">回復中</button>
      <button class="status-tab" onclick="setStatus(this, '完治')">完治</button>
    </div>
  </div>

  <!-- メモ -->
  <div class="card" style="margin-bottom: 80px;">
    <div class="section-label">メモ (処置内容など・任意)</div>
    <textarea class="memo-input" id="injury-memo" placeholder="アイシング実施、RICE対応、病院の診断名など"></textarea>
  </div>

  <div class="submit-fixed">
    <button class="submit-btn" onclick="saveInjuryData()">怪我の記録を保存する</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const dateParam = urlParams.get('date');
    const todayStr = dateParam || new Date().toISOString().split('T')[0];
    
    document.getElementById('injury-date').value = todayStr;
    updateBackLinkDate();

    function updateBackLinkDate() {
      const selectedDate = document.getElementById('injury-date').value;
      document.getElementById('back-link').href = `vital.html?date=${selectedDate}`;
    }

    let currentPain = 3;
    const painDescriptions = {
      1: '1・違和感',
      2: '2・弱い',
      3: '3・中程度',
      4: '4・強い',
      5: '5・非常に強い'
    };

    function changePain(delta) {
      currentPain += delta;
      if (currentPain < 1) currentPain = 1;
      if (currentPain > 5) currentPain = 5;

      document.getElementById('pain-display').innerText = `${currentPain} / 5`;
      document.getElementById('pain-label-title').innerText = `痛みレベル（${painDescriptions[currentPain]}）`;
    }

    function selectPartChip(el) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      document.getElementById('injury-part-input').value = el.innerText;
    }

    let currentStatus = '治療中';
    function setStatus(el, statusText) {
      document.querySelectorAll('.status-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      currentStatus = statusText;
    }

    async function saveInjuryData() {
      const part = document.getElementById('injury-part-input').value;
      if (!part) {
        alert('部位を入力してください');
        return;
      }

      const selectedDate = document.getElementById('injury-date').value;
      const injuryData = {
        part: part,
        date: selectedDate,
        situation: document.getElementById('injury-situation').value,
        cause: document.getElementById('injury-cause').value,
        painLevel: currentPain,
        painText: painDescriptions[currentPain],
        status: currentStatus,
        memo: document.getElementById('injury-memo').value,
        updatedAt: new Date().toISOString()
      };

      // 1. ローカルストレージへの保存
      try {
        const storageKey = `track_log_${selectedDate}`;
        let existingData = JSON.parse(localStorage.getItem(storageKey)) || {};
        existingData['怪我・痛み'] = injuryData;
        localStorage.setItem(storageKey, JSON.stringify(existingData));
      } catch (e) {
        console.error("ローカルストレージ保存エラー:", e);
      }

      // 2. Firebase (Firestore) への保存
      if (typeof window.saveInjuryDataToCloud === 'function') {
        await window.saveInjuryDataToCloud(injuryData);
      }

      alert('怪我の記録を保存しました！');
      window.location.href = `vital.html?date=${selectedDate}`;
    }
  </script>
</body>
</html>
