<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プロフィール設定・編集</title>

  <!-- OneSignal SDK の読み込みと初期化 -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "ccfac500-7f25-457f-820f-4a70536e9e37",
      });

      // トグルスイッチの状態を初期化・同期
      try {
        const isOptedOut = OneSignal.User.PushSubscription.optedOut;
        const permission = await OneSignal.Notifications.permission;
        const toggleEl = document.getElementById('push-notification-toggle');
        if (toggleEl) {
          toggleEl.checked = (permission && !isOptedOut);
        }
      } catch (e) {
        console.log("OneSignal初期状態取得エラー:", e);
      }

      OneSignal.User.PushSubscription.addEventListener("change", async (event) => {
        const toggleEl = document.getElementById('push-notification-toggle');
        const permission = await OneSignal.Notifications.permission;
        if (toggleEl) {
          toggleEl.checked = (permission && !OneSignal.User.PushSubscription.optedOut);
        }
      });
    });

    async function handleNotificationToggle(checkbox) {
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(async function(OneSignal) {
        if (checkbox.checked) {
          try {
            await OneSignal.User.PushSubscription.optIn();
            const permission = await OneSignal.Notifications.permission;
            if (!permission) {
              await OneSignal.Slidedown.promptPush();
            }
            console.log("プッシュ通知を有効化しました");
          } catch (e) {
            console.error("通知有効化エラー:", e);
            checkbox.checked = false;
          }
        } else {
          try {
            await OneSignal.User.PushSubscription.optOut();
            console.log("プッシュ通知を無効化しました");
          } catch (e) {
            console.error("通知無効化エラー:", e);
            checkbox.checked = true;
          }
        }
      });
    }
  </script>

  <style>
    body { background: #121212; color: #fff; font-family: sans-serif; padding: 12px; margin: 0; padding-bottom: 50px; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid #333; }
    .green { color: #00ff88; }
    
    select, input { width: 100%; box-sizing: border-box; background: #252525; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 6px; margin: 4px 0 10px; font-size: 12px; }
    .input-wrapper { display: flex; align-items: center; background: #252525; border: 1px solid #444; border-radius: 6px; padding: 0 8px; margin: 4px 0 10px; }
    .input-wrapper input { border: none; background: transparent; margin: 0; padding: 8px 0; }
    .unit { font-size: 11px; color: #888; font-weight: bold; margin-left: 4px; }
    
    .btn-save { background: #00ff88; color: #000; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; margin-top: 8px; }
    .btn-link { background: #2a2a2a; color: #00ff88; border: 1px solid #00ff88; width: 100%; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; margin-top: 6px; }
    .btn-back { background: #2a2a2a; color: #00ff88; border: 1px solid #00ff88; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; margin-bottom: 12px; display: none; align-items: center; gap: 4px; }
    
    .custom-input { display: none; margin-top: -6px; margin-bottom: 10px; }

    /* トグルスイッチ用スタイル */
    .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .3s; border-radius: 24px; border: 1px solid #444; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 2px; bottom: 2px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #00ff88; border-color: #00ff88; }
    input:checked + .slider:before { transform: translateX(22px); background-color: #000; }
  </style>

  <!-- Firebase SDK（グローバル版 v11.1.0） -->
  <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore-compat.js"></script>
  
  <script src="firebase-config.js"></script>

  <script>
    const db = firebase.firestore();
    const auth = firebase.auth();

    const urlParams = new URLSearchParams(window.location.search);
    const isEditMode = urlParams.get('mode') === 'edit';

    window.addEventListener('DOMContentLoaded', () => {
      if (isEditMode) {
        const backBtn = document.getElementById('backBtn');
        if (backBtn) backBtn.style.display = 'inline-flex';
      }
    });

    const defaultEvents = [
      "100m", "200m", "400m", "800m", "1500m",
      "走幅跳", "三段跳", "走高跳",
      "やり投げ", "砲丸投げ", "円盤投", "なし"
    ];

    function setupEventField(selectId, inputId, customWrapperId, value) {
      const select = document.getElementById(selectId);
      const customInput = document.getElementById(inputId);
      const customWrapper = document.getElementById(customWrapperId);

      const isPreset = defaultEvents.includes(value);

      if (isPreset || !value) {
        select.value = value || (selectId.includes('sub') ? 'なし' : '100m');
        customWrapper.style.display = 'none';
        customInput.value = '';
      } else {
        select.value = 'other';
        customWrapper.style.display = 'block';
        customInput.value = value;
      }
    }

    function getEventValue(selectId, inputId) {
      const select = document.getElementById(selectId);
      if (select.value === 'other') {
        return document.getElementById(inputId).value.trim();
      }
      return select.value;
    }

    window.toggleCustomEvent = function(selectId, wrapperId) {
      const select = document.getElementById(selectId);
      const wrapper = document.getElementById(wrapperId);
      if (select.value === 'other') {
        wrapper.style.display = 'block';
      } else {
        wrapper.style.display = 'none';
      }
    };

    window.goBack = function() {
      location.href = 'personal.html';
    };

    window.onload = async function() {
      auth.onAuthStateChanged(async (user) => {
        if (!user) {
          try {
            await auth.signInAnonymously();
          } catch (e) {
            console.error("匿名ログイン失敗:", e);
          }
          return;
        }

        // --- 認証状態（匿名か、メール連携済みか）によって表示を切り替え ---
        const unlinkedArea = document.getElementById('auth-unlinked-area');
        const linkedArea = document.getElementById('auth-linked-area');
        
        // ユーザーのプロバイダ情報をチェック（passwordプロバイダが含まれていればメール設定済み）
        const isEmailLinked = user.providerData.some(p => p.providerId === 'password');

        if (isEmailLinked) {
          if (unlinkedArea) unlinkedArea.style.display = 'none';
          if (linkedArea) {
            linkedArea.style.display = 'block';
            const currentEmailSpan = document.getElementById('current-linked-email');
            if (currentEmailSpan) currentEmailSpan.textContent = user.email || '登録済み';
          }
        } else {
          if (unlinkedArea) unlinkedArea.style.display = 'block';
          if (linkedArea) linkedArea.style.display = 'none';
        }

        const userId = user.uid;
        try {
          const docRef = db.collection("users").doc(userId);
          const docSnap = await docRef.get();

          if (docSnap.exists) {
            const data = docSnap.data();

            if (data.name && data.name !== '' && data.name !== 'No Name' && !isEditMode) {
              location.replace('personal.html');
              return;
            }

            document.getElementById('user-name').value = data.name || '';
            setupEventField('main-event', 'main-event-custom', 'main-custom-wrapper', data.mainEvent);
            setupEventField('sub-event', 'sub-event-custom', 'sub-custom-wrapper', data.subEvent);
            if (data.height) document.getElementById('height').value = data.height;
            return;
          }
        } catch (e) {
          console.error("データ取得エラー:", e);
        }

        document.getElementById('user-name').value = '';
        setupEventField('main-event', 'main-event-custom', 'main-custom-wrapper', '100m');
        setupEventField('sub-event', 'sub-event-custom', 'sub-custom-wrapper', 'なし');
      });
    };

    // 匿名アカウントにメールアドレスとパスワードを紐づける処理
    window.linkEmailPassword = async function() {
      const user = auth.currentUser;
      if (!user) {
        alert('認証セッションがありません。');
        return;
      }

      const email = document.getElementById('link-email').value.trim();
      const password = document.getElementById('link-password').value;

      if (!email || !password) {
        alert('メールアドレスとパスワードを入力してください！');
        return;
      }

      if (password.length < 6) {
        alert('パスワードは6文字以上で入力してください！');
        return;
      }

      try {
        const credential = firebase.auth.EmailAuthProvider.credential(email, password);
        await user.linkWithCredential(credential);
        alert('メールアドレスの連携が完了しました！');
        location.reload();
      } catch (error) {
        console.error("連携エラー:", error);
        if (error.code === 'auth/email-already-in-use') {
          alert('このメールアドレスはすでに別のカウントで使用されています。');
        } else {
          alert('連携に失敗しました: ' + error.message);
        }
      }
    };

    // パスワード変更メールを送信する処理
    window.sendPasswordReset = async function() {
      const user = auth.currentUser;
      if (!user || !user.email) {
        alert('メールアドレスが取得できません。');
        return;
      }

      if (confirm(`${user.email} 宛にパスワード再設定用のメールを送信しますか？`)) {
        try {
          await auth.sendPasswordResetEmail(user.email);
          alert('パスワード再設定メールを送信しました。メールの指示に従って変更してください。');
        } catch (e) {
          console.error("パスワードリセット送信エラー:", e);
          alert('送信に失敗しました: ' + e.message);
        }
      }
    };

    window.saveProfile = async function() {
      const user = auth.currentUser;
      if (!user) {
        alert('認証セッション初期化中です。もう一度お試しください。');
        return;
      }

      const name = document.getElementById('user-name').value.trim();
      if (!name) {
        alert('名前（ニックネーム）を入力してください！');
        return;
      }

      const mainVal = getEventValue('main-event', 'main-event-custom');
      const subVal = getEventValue('sub-event', 'sub-event-custom');

      if (!mainVal) {
        alert('メイン種目を選択または入力してください！');
        return;
      }

      const userId = user.uid;

      const profileData = {
        id: userId,
        name: name,
        mainEvent: mainVal,
        subEvent: subVal,
        height: document.getElementById('height').value,
        updatedAt: new Date()
      };

      try {
        await db.collection("users").doc(userId).set(profileData, { merge: true });
        
        localStorage.setItem('user_id', userId);
        localStorage.setItem('user_name', name);

        alert('プロフィールを保存しました！');
        location.href = 'personal.html';
      } catch (error) {
        console.error("エラー詳細: ", error);
        alert('データベースへの保存に失敗しました。');
      }
    };
  </script>
</head>
<body>

<button id="backBtn" class="btn-back" onclick="goBack()">← トップへ戻る</button>

<h3 class="green" style="text-align:center; margin-top:0; font-size:16px;">👤 PROFILE SETTINGS</h3>

<!-- 選手プロフィール情報カード -->
<div class="card">
  <div style="font-weight:bold; margin-bottom:10px; font-size:13px;">選手プロフィール情報</div>

  <label style="font-size:11px; color:#aaa;">名前（ニックネーム）</label>
  <input type="text" placeholder="" id="user-name">

  <label style="font-size:11px; color:#aaa;">メイン種目</label>
  <select id="main-event" onchange="toggleCustomEvent('main-event', 'main-custom-wrapper')">
    <option value="100m">100m</option>
    <option value="200m">200m</option>
    <option value="400m">400m</option>
    <option value="800m">800m</option>
    <option value="1500m">1500m</option>
    <option value="走幅跳">走幅跳</option>
    <option value="三段跳">三段跳</option>
    <option value="走高跳">走高跳</option>
    <option value="やり投げ">やり投げ</option>
    <option value="砲丸投げ">砲丸投げ</option>
    <option value="円盤投">円盤投</option>
    <option value="other">✏️️ その他（自由入力）</option>
  </select>
  <div class="custom-input" id="main-custom-wrapper">
    <input type="text" placeholder="例: 110mH" id="main-event-custom">
  </div>

  <label style="font-size:11px; color:#aaa;">サブ種目</label>
  <select id="sub-event" onchange="toggleCustomEvent('sub-event', 'sub-custom-wrapper')">
    <option value="100m">100m</option>
    <option value="200m">200m</option>
    <option value="400m">400m</option>
    <option value="800m">800m</option>
    <option value="1500m">1500m</option>
    <option value="走幅跳">走幅跳</option>
    <option value="三段跳">三段跳</option>
    <option value="走高跳">走高跳</option>
    <option value="やり投げ">やり投げ</option>
    <option value="砲丸投げ">砲丸投げ</option>
    <option value="円盤投">円盤投</option>
    <option value="なし">なし</option>
    <option value="other">✏️ その他（自由入力）</option>
  </select>
  <div class="custom-input" id="sub-custom-wrapper">
    <input type="text" placeholder="例: 110mH" id="sub-event-custom">
  </div>

  <label style="font-size:11px; color:#aaa;">身長</label>
  <div class="input-wrapper">
    <input type="number" step="0.1" inputmode="decimal" placeholder="例: 175.0" id="height">
    <span class="unit">cm</span>
  </div>
</div>

<!-- ① 未登録（匿名）ユーザー向けの引き継ぎ登録カード -->
<div id="auth-unlinked-area" class="card" style="display: none;">
  <div style="font-weight:bold; margin-bottom:6px; font-size:13px;">🔐 機種変更の引き継ぎ設定（任意）</div>
  <p style="font-size:11px; color:#888; margin-bottom:10px; line-height:1.4;">
    メールアドレスとパスワードを登録しておくと、機種変更した際にデータを引き継ぐことができます。
  </p>

  <label style="font-size:11px; color:#aaa;">連携するメールアドレス</label>
  <input type="email" id="link-email" placeholder="example@email.com">

  <label style="font-size:11px; color:#aaa;">パスワード（6文字以上）</label>
  <input type="password" id="link-password" placeholder="パスワードを入力">

  <button class="btn-link" onclick="linkEmailPassword()">メールアドレスを登録（連携）する</button>
</div>

<!-- ② 既に登録（メール連携済み）ユーザー向けの管理カード -->
<div id="auth-linked-area" class="card" style="display: none; border-color: #00ff88; background: #16261e;">
  <div style="font-weight:bold; margin-bottom:6px; font-size:13px; color: #00ff88;">🔐 機種変更の引き継ぎ設定（登録済み）</div>
  <p style="font-size:11px; color:#ccc; margin-bottom:10px; line-height:1.4;">
    現在、以下のメールアドレスでアカウントが保護されています。
  </p>
  
  <div style="font-size: 12px; background: #111; padding: 8px 10px; border-radius: 6px; margin-bottom: 10px; color: #fff; font-weight: bold;">
    📧 <span id="current-linked-email">-</span>
  </div>

  <button class="btn-link" onclick="sendPasswordReset()" style="background: #1e1e1e; border-color: #00ff88; color: #00ff88;">
    🔑 パスワードの再設定メールを送信する
  </button>
</div>

<!-- プッシュ通知設定カード（トグルスイッチ） -->
<div class="card" style="display: flex; justify-content: space-between; align-items: center; background: #161b22; border-color: #30363d;">
  <div>
    <div style="font-size: 13px; font-weight: bold; color: #58a6ff;">🔔 プッシュ通知の受信設定</div>
    <div style="font-size: 10px; color: #8b949e; margin-top: 3px;">試合の直前通知やチームの連絡を受け取る</div>
  </div>
  <label class="switch">
    <input type="checkbox" id="push-notification-toggle" onchange="handleNotificationToggle(this)">
    <span class="slider"></span>
  </label>
</div>

<button class="btn-save" onclick="saveProfile()">プロフィールを保存する</button>

</body>
</html>
