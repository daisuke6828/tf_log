<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>試合総合分析ハブ</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Firebase SDK の読み込み (コンパット版) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <!-- 共通のFirebase設定ファイル -->
  <script src="firebase-config.js"></script>

  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      padding-bottom: calc(70px + env(safe-area-inset-bottom, 20px));
    }
    .page-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #ffd700; 
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 16px;
      text-align: center;
    }
    .hub-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .hub-tab {
      background: #1e1e1e;
      border: 1px solid #333;
      color: #aaa;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: block;
    }
    .hub-tab.active {
      background: #ffd700;
      color: #121212;
      border-color: #ffd700;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .filter-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    .filter-group {
      margin-bottom: 10px;
    }
    .filter-group label {
      display: block;
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
    }
    select {
      width: 100%;
      background: #1e1e1e;
      border: 1px solid #333;
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
    }
    .chart-container-wrapper {
      position: relative;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
      height: 300px;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .data-table th, .data-table td {
      border: 1px solid #333;
      padding: 8px;
      text-align: left;
    }
    .data-table th {
      background: #222;
      color: #00e676;
    }
    .empty-message {
      text-align: center;
      color: #777;
      padding: 20px;
      font-size: 12px;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #1a1a1a;
      border-top: 1px solid #333;
      display: flex;
      justify-content: space-around;
      padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 20px)) 0;
      z-index: 1000;
      box-sizing: border-box;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #777;
      font-size: 9px;
      font-weight: bold;
      gap: 2px;
      flex: 1;
    }
    .nav-item.active {
      color: #ff6b6b;
    }
    .nav-icon {
      font-size: 16px;
    }
  </style>

  <script>
    const auth = firebase.auth();
    const db = firebase.firestore();
    let currentUserId = null;

    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUserId = user.uid;
        if (typeof window.initApp === 'function') {
          window.initApp(currentUserId);
        }
      } else {
        currentUserId = null;
        const container = document.getElementById('match-list-view');
        if (container) {
          container.innerHTML = '<div class="empty-message">ログインしてください</div>';
        }
      }
    });
  </script>
</head>
<body>

  <div class="page-title">🏆 試合総合分析ハブ</div>

  <div class="hub-tabs">
    <div class="hub-tab active" onclick="switchTab(0)">📋 試合結果一覧</div>
    <div class="hub-tab" onclick="switchTab(1)">📈 試合結果グラフ</div>
    <div class="hub-tab" onclick="switchTab(2)">❤️ 試合 vs バイタル</div>
    <a href="match_analysis.html" class="hub-tab">⚖️ 試合 vs 練習数値</a>
  </div>

  <!-- タブ0: 試合結果一覧 -->
  <div id="tab-0" class="tab-content active">
    <div class="filter-row">
      <div class="filter-group">
        <label>開始年</label>
        <select id="filter-start-year-tab0" onchange="renderTab0List()"></select>
      </div>
      <div class="filter-group">
        <label>終了年</label>
        <select id="filter-end-year-tab0" onchange="renderTab0List()"></select>
      </div>
    </div>
    <div id="match-list-view"></div>
  </div>

  <!-- タブ1: 試合結果グラフ -->
  <div id="tab-1" class="tab-content">
    <div class="filter-group">
      <label>分析する種目</label>
      <select id="filter-event-tab1" onchange="renderTab1Chart()"></select>
    </div>

    <div class="chart-container-wrapper" style="display:flex; padding:10px 0; overflow:hidden;">
      <div style="width:58px; flex-shrink:0; position:relative;">
        <canvas id="yAxisLeftTab1" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></canvas>
      </div>
      <div style="flex-grow:1; overflow-x:auto; position:relative;">
        <div id="wrapper-tab1" style="height:280px; position:relative;">
          <canvas id="matchOnlyChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- タブ2: 試合 vs バイタル (散布図) -->
  <div id="tab-2" class="tab-content">
    <div class="filter-row">
      <div class="filter-group">
        <label>分析する種目</label>
        <select id="filter-event-tab2" onchange="renderTab2Chart()"></select>
      </div>
      <div class="filter-group">
        <label>横軸にするバイタル項目</label>
        <select id="filter-vital-mode" onchange="renderTab2Chart()">
          <option value="condition">コンディション (1〜5)</option>
          <option value="weight">体重 (kg)</option>
        </select>
      </div>
    </div>

    <div class="chart-container-wrapper">
      <canvas id="matchVitalScatterChart"></canvas>
    </div>
  </div>

  <!-- ボトムナビゲーション -->
  <nav class="bottom-nav">
    <a href="history.html" class="nav-item">
      <span class="nav-icon">📋</span>
      <span>履歴</span>
    </a>
    <a href="vital_deep_dive.html" class="nav-item">
      <span class="nav-icon">⚖️</span>
      <span>バイタル</span>
    </a>
    <a href="log_deep_dive.html" class="nav-item">
      <span class="nav-icon">📈</span>
      <span>日誌詳細</span>
    </a>
    <a href="match_deep_dive.html" class="nav-item active">
      <span class="nav-icon">🎯</span>
      <span>試合詳細</span>
    </a>
  </nav>

  <script>
    let chartTab1 = null, yAxisChart1 = null;
    let chartTab2Scatter = null;
    let cachedMatches = [];

    window.initApp = async function(userId) {
      if (!userId) return;
      await loadData(userId);
      initAllFilters();
      renderTab0List();
      renderTab1Chart();
    };

    function formatEventDisplay(ev) {
      if (!ev) return '---';
      if (ev.rounds && Array.isArray(ev.rounds) && ev.rounds.length > 0) {
        return ev.rounds.map(r => {
          let roundName = r.round || 'ラウンド';
          let timeVal = r.time || '---';
          let windVal = r.wind ? ` (${r.wind})` : '';
          let placeVal = r.place ? ` [${r.place}]` : '';
          return `${roundName}: ${timeVal}${windVal}${placeVal}`;
        }).join(' / ');
      }
      if (ev.trials && Array.isArray(ev.trials) && ev.trials.length > 0) {
        let validTrials = ev.trials.map((t, i) => {
          if (!t) return null;
          let w = (ev.trialWinds && ev.trialWinds[i]) ? `(${ev.trialWinds[i]})` : '';
          return `${i+1}本目: ${t}${w}`;
        }).filter(Boolean);
        if (validTrials.length > 0) return validTrials.join(' / ');
      }
      if (ev.simpleRecord) return `記録: ${ev.simpleRecord}`;
      if (ev.time) {
        let p = ev.place ? ` (${ev.place})` : '';
        return `${ev.round || '決勝'}: ${ev.time}${p}`;
      }
      return '---';
    }

    async function loadData(userId) {
      let matchMap = {};
      try {
        // track_logs から試合結果とバイタルデータを同時に取得する
        const trackLogSnap = await db.collection('users').doc(userId).collection('track_logs').get();
        trackLogSnap.forEach(docSnap => {
          const dateStr = docSnap.id; 
          const data = docSnap.data();
          
          const m = data['試合結果'] || data['試合结果'];
          const v = data['バイタル'] || {};

          if (m && m.events && m.events.length > 0) {
            matchMap[dateStr] = {
              matchId: dateStr,
              name: m.name || '試合',
              date: dateStr,
              // バイタルデータ（体重やコンディション）を同じ日付のデータとして紐づける
              weight: (v.weight !== undefined && v.weight !== '') ? parseFloat(v.weight) : null,
              condition: (v.fatigue !== undefined && v.fatigue !== '') ? parseInt(v.fatigue, 10) : (m.condition !== undefined ? m.condition : null),
              events: m.events
            };
          }
        });
      } catch (e) {
        console.error("Firebase track_logs load error:", e);
      }

      cachedMatches = Object.values(matchMap);
      cachedMatches.sort((a, b) => a.date.localeCompare(b.date));
    }

    window.switchTab = function(index) {
      document.querySelectorAll('.hub-tab').forEach((tab, idx) => {
        if (tab.tagName === 'DIV') {
          tab.classList.toggle('active', idx === index);
        }
      });
      document.querySelectorAll('.tab-content').forEach((content, idx) => {
        content.classList.toggle('active', idx === index);
      });
      if (index === 0) renderTab0List();
      if (index === 1) renderTab1Chart();
      if (index === 2) renderTab2Chart();
    };

    function initAllFilters() {
      const years = new Set();
      cachedMatches.forEach(m => {
        if (m.date && m.date.length >= 4) years.add(m.date.substring(0, 4));
      });
      const sortedYears = Array.from(years).sort();
      const yOpt = '<option value="all">指定なし</option>' + sortedYears.map(y => `<option value="${y}">${y}年</option>`).join('');

      ['tab0'].forEach(t => {
        const startY = document.getElementById(`filter-start-year-${t}`);
        const endY = document.getElementById(`filter-end-year-${t}`);
        if(startY) startY.innerHTML = yOpt;
        if(endY) endY.innerHTML = yOpt;
      });

      const matchEvents = new Set();
      cachedMatches.forEach(m => {
        if (m.events) {
          m.events.forEach(ev => { if (ev.type) matchEvents.add(ev.type); });
        }
      });
      const evOpts = Array.from(matchEvents).sort().map(e => `<option value="${e}">${e}</option>`).join('');
      const ev1 = document.getElementById('filter-event-tab1');
      const ev2 = document.getElementById('filter-event-tab2');
      if(ev1) ev1.innerHTML = evOpts;
      if(ev2) ev2.innerHTML = evOpts;
    }

    window.renderTab0List = function() {
      const container = document.getElementById('match-list-view');
      if (cachedMatches.length === 0) {
        container.innerHTML = '<div class="empty-message">試合データがありません</div>';
        return;
      }
      let html = '';
      cachedMatches.forEach(match => {
        html += `<div style="margin-bottom:12px; background:#252525; padding:10px; border-radius:8px;"><div style="color:#ffd700; font-weight:bold; font-size:12px; margin-bottom: 6px;">📅 ${match.date} - ${match.name}</div><table class="data-table"><thead><tr><th>種目 ＆ 記録</th></tr></thead><tbody>`;
        let evText = '';
        if (match.events) {
          match.events.forEach(ev => {
            const name = ev.type || '';
            const val = formatEventDisplay(ev);
            if (name) evText += `<div style="margin-bottom:4px;"><strong>${name}</strong>: ${val}</div>`;
          });
        }
        html += `<tr><td>${evText || 'データなし'}</td></tr>`;
        html += `</tbody></table></div>`;
      });
      container.innerHTML = html;
    };

    function updateWidth(wrapperId, count) {
      const el = document.getElementById(wrapperId);
      if(el) el.style.width = Math.max(100, count * 70) + '%';
    }

    function getNumericValue(ev) {
      if (!ev) return null;
      let textToParse = '';
      if (ev.rounds && ev.rounds.length > 0) {
        textToParse = ev.rounds[ev.rounds.length - 1].time || '';
      } else if (ev.trials && ev.trials.length > 0) {
        let valid = ev.trials.filter(Boolean);
        textToParse = valid[valid.length - 1] || '';
      } else if (ev.simpleRecord) {
        textToParse = ev.simpleRecord;
      } else if (ev.time) {
        textToParse = ev.time;
      }
      const match = String(textToParse).match(/[\d.]+/);
      return match ? parseFloat(match[0]) : null;
    }

    window.renderTab1Chart = function() {
      const evSelect = document.getElementById('filter-event-tab1');
      if (!evSelect || !evSelect.value) return;
      const evName = evSelect.value;

      let labels = [], dataPoints = [];
      cachedMatches.forEach(match => {
        if (match.events) {
          match.events.forEach(ev => {
            if (ev.type === evName) {
              const val = getNumericValue(ev);
              if (val !== null) {
                labels.push(match.date);
                dataPoints.push(val);
              }
            }
          });
        }
      });

      updateWidth('wrapper-tab1', dataPoints.length);

      if (chartTab1) chartTab1.destroy();
      if (yAxisChart1) yAxisChart1.destroy();

      chartTab1 = new Chart(document.getElementById('matchOnlyChart').getContext('2d'), {
        type: 'line',
        data: { labels: labels, datasets: [{ data: dataPoints, borderColor: '#00e676', backgroundColor: '#00e67633', tension: 0.1 }] },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#aaa', font: { size: 9 } }, grid: { color: '#252525' } },
            y: { display: false, grid: { display: false } }
          }
        }
      });

      yAxisChart1 = new Chart(document.getElementById('yAxisLeftTab1').getContext('2d'), {
        type: 'line',
        data: { labels: labels, datasets: [{ data: dataPoints, borderColor: 'transparent', pointRadius: 0 }] },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { enabled: false } },
          scales: {
            x: { display: false },
            y: {
              display: true, position: 'left',
              ticks: { color: '#00e676', font: { size: 9 }, maxTicksLimit: 6, padding: 2, callback: v => v.toFixed(2) },
              grid: { display: false }
            }
          }
        }
      });
    };

    // タブ2: 試合 vs バイタル（散布図の描画）
    window.renderTab2Chart = function() {
      const evSelect = document.getElementById('filter-event-tab2');
      const modeSelect = document.getElementById('filter-vital-mode');
      if (!evSelect || !evSelect.value) return;
      const evName = evSelect.value;
      const mode = modeSelect ? modeSelect.value : 'condition';

      let scatterData = [];
      cachedMatches.forEach(match => {
        let vitalX = null;
        if (mode === 'condition') {
          vitalX = match.condition !== null ? parseFloat(match.condition) : null;
        } else if (mode === 'weight') {
          vitalX = match.weight !== null ? parseFloat(match.weight) : null;
        }

        if (vitalX === null || isNaN(vitalX)) return;

        if (match.events) {
          match.events.forEach(ev => {
            if (ev.type === evName) {
              const recordY = getNumericValue(ev);
              if (recordY !== null) {
                scatterData.push({
                  x: vitalX,
                  y: recordY,
                  date: match.date,
                  matchName: match.name
                });
              }
            }
          });
        }
      });

      if (chartTab2Scatter) chartTab2Scatter.destroy();

      chartTab2Scatter = new Chart(document.getElementById('matchVitalScatterChart').getContext('2d'), {
        type: 'scatter',
        data: {
          datasets: [{
            label: `${evName} vs ${mode === 'condition' ? 'コンディション' : '体重'}`,
            data: scatterData,
            backgroundColor: '#00e676',
            borderColor: '#00e676',
            pointRadius: 6,
            pointHoverRadius: 8
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function(context) {
                  const pt = context.raw;
                  return [`日付: ${pt.date} (${pt.matchName})`, `横軸(${mode === 'condition' ? 'コンディション' : '体重'}): ${pt.x}`, `縦軸(記録): ${pt.y}`];
                }
              }
            }
          },
          scales: {
            x: {
              title: {
                display: true,
                text: mode === 'condition' ? 'コンディション (1〜5)' : '体重 (kg)',
                color: '#aaa',
                font: { size: 11 }
              },
              ticks: { color: '#aaa', font: { size: 10 } },
              grid: { color: '#252525' }
            },
            y: {
              title: {
                display: true,
                text: '記録 / タイム',
                color: '#00e676',
                font: { size: 11 }
              },
              ticks: { 
                color: '#00e676', 
                font: { size: 10 },
                callback: v => v.toFixed(2)
              },
              grid: { color: '#252525' }
            }
          }
        }
      });
    };
  </script>
</body>
</html>
