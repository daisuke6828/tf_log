<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALL DATA HISTORY</title>
  
  <!-- Firebase SDK の読み込み (compat版) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { background: #121212; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 12px; margin: 0; padding-bottom: 80px; }
    
    .back-btn-container { margin-bottom: 12px; }
    .back-btn { display: inline-flex; align-items: center; gap: 4px; background: #1e1e1e; color: #00e676; border: 1px solid #00e676; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; text-decoration: none; cursor: pointer; }
    .back-btn:hover { background: #00e676; color: #121212; }

    .page-title { display: flex; align-items: center; gap: 6px; font-size: 18px; font-weight: bold; color: #00e676; margin-bottom: 16px; justify-content: center; }

    .filter-card { background: #1e1e1e; border-radius: 12px; padding: 14px; margin-bottom: 16px; border: 1px solid #333; display: flex; flex-direction: column; gap: 10px; }
    .filter-row { display: flex; gap: 10px; }
    .filter-group { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .filter-label { font-size: 11px; color: #aaa; font-weight: bold; }
    
    select { background: #222; border: 1px solid #444; border-radius: 8px; padding: 10px; color: #fff; font-size: 14px; width: 100%; outline: none; -webkit-appearance: none; appearance: none; }
    select:focus { border-color: #00e676; }

    .history-card { background: #1e1e1e; border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid #333; cursor: pointer; display: block; transition: 0.2s; }
    .history-card:hover { border-color: #00e676; background: #222; }

    .history-date { font-size: 15px; font-weight: bold; color: #00e676; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .badge-container { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge { font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: bold; }
    .badge-log { background: #1a2e22; color: #00e676; border: 1px solid #00e676; }
    .badge-vital { background: #1a2238; color: #4dabf7; border: 1px solid #4dabf7; }
    .badge-test { background: #382e1a; color: #ffd43b; border: 1px solid #ffd43b; }
    .badge-match { background: #381a1a; color: #ff6b6b; border: 1px solid #ff6b6b; }
    
    /* calendar.html と同等の詳細カード内デザイン */
    .detail-content-area { margin-top: 12px; border-top: 1px solid #333; padding-top: 12px; display: none; }
    .history-card.expanded .detail-content-area { display: block; }

    .item-block { background: #262626; border-left: 3px solid #00e676; padding: 12px 14px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; border-top: 1px solid #333; border-right: 1px solid #333; border-bottom: 1px solid #333; }
    .item-block.schedule { border-left-color: #528aff; }
    .item-block.match-event { border-left-color: #ffa502; } 
    .item-block.match { border-left-color: #d4af37; }
    .item-block.vital { border-left-color: #00d2d3; }
    .item-block.test { border-left-color: #e040fb; }
    .item-block.injury { border-left-color: #ff5252; }

    .detail-table { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; font-size: 12px; }
    .detail-row { display: flex; justify-content: space-between; background: #1e1e1e; padding: 6px 8px; border-radius: 4px; border: 1px solid #333; }
    .detail-label-item { color: #aaa; }
    .detail-val-item { color: #fff; font-weight: bold; text-align: right; }

    .empty-message { text-align: center; color: #777; padding: 40px 0; font-size: 14px; }

    /* ボトムナビゲーション */
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #1a1a1a; border-top: 1px solid #333; display: flex; justify-content: space-around; padding: 6px 0; z-index: 1000; }
    .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #777; font-size: 9px; font-weight: bold; gap: 2px; flex: 1; }
    .nav-item.active { color: #00e676; }
    .nav-icon { font-size: 16px; }
  </style>
</head>
<body>

  <div class="back-btn-container">
    <a href="personal.html" id="back-to-top" class="back-btn">◀ トップへ戻る</a>
  </div>

  <div class="page-title">
    <span>📋</span> すべての記録一覧
  </div>

  <div class="filter-card">
    <div class="filter-row">
      <div class="filter-group">
        <span class="filter-label">年で絞り込み</span>
        <select id="filter-year" onchange="renderHistory()">
          <option value="all">すべての年</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-label">月で絞り込み</span>
        <select id="filter-month" onchange="renderHistory()">
          <option value="all">すべての月</option>
          <option value="01">1月</option><option value="02">2月</option><option value="03">3月</option>
          <option value="04">4月</option><option value="05">5月</option><option value="06">6月</option>
          <option value="07">7月</option><option value="08">8月</option><option value="09">9月</option>
          <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
        </select>
      </div>
    </div>
    <div class="filter-row">
      <div class="filter-group">
        <span class="filter-label">内容で絞り込み</span>
        <select id="filter-type" onchange="renderHistory()">
          <option value="all">全て</option>
          <option value="log">練習日誌</option>
          <option value="vital">バイタル</option>
          <option value="match">試合結果</option>
          <option value="test">コントロールテストの結果</option>
        </select>
      </div>
    </div>
  </div>

  <div id="history-container">
    <div class="empty-message">データを読み込み中...</div>
  </div>

  <!-- ボトムナビゲーション -->
  <nav class="bottom-nav">
    <a href="history.html" class="nav-item active">
      <span class="nav-icon">📋</span>
      <span>履歴</span>
    </a>
    <a href="vital_deep_dive.html" class="nav-item">
      <span class="nav-icon">⚖️</span>
      <span>バイタル</span>
    </a>
    <a href="log_deep_dive.html" class="nav-item">
      <span class="nav-icon">📈</span>
      <span>日誌詳細</span>
    </a>
    <a href="match_deep_dive.html" class="nav-item">
      <span class="nav-icon">🎯</span>
      <span>試合詳細</span>
    </a>
  </nav>

  <script>
    const auth = firebase.auth();
    const db = firebase.firestore();
    let currentUserId = null;
    let cachedLogsMap = {};

    const fatigueTexts = { 1: "1：疲労なし", 2: "2：軽く疲労を感じる", 3: "3：疲労を感じる", 4: "4：疲労を強く感じる", 5: "5：練習不可" };
    const painDescriptions = { 1: '1・違和感', 2: '2・弱い', 3: '3・中程度', 4: '4・強い', 5: '5・非常に強い' };

    // URLからuserIdを引き継いでトップに戻るボタンのリンクを調整
    const urlParams = new URLSearchParams(window.location.search);
    const userIdParam = urlParams.get('userId');
    const backBtn = document.getElementById('back-to-top');
    if (backBtn && userIdParam) {
      backBtn.href = `personal.html?userId=${encodeURIComponent(userIdParam)}`;
    }

    async function loadFirestoreLogData() {
      if (Object.keys(cachedLogsMap).length > 0) return cachedLogsMap;
      let logsMap = {};

      if (!currentUserId) return logsMap;

      try {
        const querySnapshot = await db.collection("users").doc(currentUserId).collection("track_logs").get();
        querySnapshot.forEach((docSnap) => {
          const dateStr = docSnap.id; 
          const firestoreData = docSnap.data();
          if (firestoreData) {
            logsMap[dateStr] = firestoreData;
          }
        });
        cachedLogsMap = logsMap;
      } catch (e) {
        console.error("Firestoreからのデータ取得に失敗しました:", e);
      }

      return cachedLogsMap;
    }

    function initYearFilter(logsArray) {
      const yearSelect = document.getElementById('filter-year');
      yearSelect.innerHTML = '<option value="all">すべての年</option>';
      
      const years = new Set();
      logsArray.forEach(item => {
        const y = item.date.split('-')[0];
        if (y) years.add(y);
      });
      
      Array.from(years).sort().reverse().forEach(y => {
        const opt = document.createElement('option');
        opt.value = y;
        opt.innerText = `${y}年`;
        yearSelect.appendChild(opt);
      });
    }

    // calendar.html と同じ構造で、詳細カードの中身を組み立てるHTML生成関数
    function generateDayDetailHtml(parsed) {
      if (!parsed || Object.keys(parsed).length === 0) {
        return `<div style="color:#888; font-size:13px; text-align:center; padding: 10px 0;">この日の詳細データはありません</div>`;
      }

      let detailHtml = '';

      // 1. 怪我・痛み
      if (parsed['怪我・痛み']) {
        const injury = parsed['怪我・痛み'];
        const partName = injury.part || '部位未設定';
        const pNum = injury.painLevel || 3;
        const pText = painDescriptions[pNum] ? painDescriptions[pNum] : `${pNum} / 5`;
        const statusStr = injury.status || '治療中';

        detailHtml += `
          <div class="item-block injury">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
              <div style="font-weight:bold; color:#ff5252;">🩹 痛み・怪我の記録</div>
              <span style="font-size:11px; color:#ff5252; background:#222; padding:2px 6px; border-radius:4px;">${statusStr}</span>
            </div>
            <div class="detail-table">
              <div class="detail-row"><span class="detail-label-item">部位</span><span class="detail-val-item">${partName}</span></div>
              <div class="detail-row"><span class="detail-label-item">痛みレベル</span><span class="detail-val-item">${pText}</span></div>
              ${injury.memo ? `<div class="detail-row"><span class="detail-label-item">メモ</span><span class="detail-val-item">${injury.memo}</span></div>` : ''}
            </div>
          </div>
        `;
      }

      // 2. 陸上スケジュール / 試合予定
      if (parsed['陸上スケジュール']) {
        const s = parsed['陸上スケジュール'];
        const eventsStr = s.events && s.events.length > 0 ? s.events.join(', ') : 'なし';
        const titleText = s.isMatch ? `🔥 試合予定: ${s.name}` : `📅 予定: ${s.name}`;
        const blockClass = s.isMatch ? 'item-block match-event' : 'item-block schedule';
        
        let rowsHtml = '';
        if (s.time) rowsHtml += `<div class="detail-row"><span class="detail-label-item">時間</span><span class="detail-val-item">${s.time}</span></div>`;
        if (s.place) rowsHtml += `<div class="detail-row"><span class="detail-label-item">場所</span><span class="detail-val-item">${s.place}</span></div>`;
        if (s.isMatch) rowsHtml += `<div class="detail-row"><span class="detail-label-item">出場種目</span><span class="detail-val-item">${eventsStr}</span></div>`;
        if (s.memo) rowsHtml += `<div class="detail-row"><span class="detail-label-item">メモ</span><span class="detail-val-item">${s.memo}</span></div>`;

        detailHtml += `
          <div class="${blockClass}">
            <div style="font-weight:bold; ${s.isMatch ? 'color:#ffa502;' : 'color:#528aff;'} margin-bottom:6px;">${titleText}</div>
            <div class="detail-table">${rowsHtml}</div>
          </div>
        `;
      }

      // 3. 試合結果
      if (parsed['試合結果'] || parsed['試合结果']) {
        const m = parsed['試合結果'] || parsed['試合结果'];
        const matchName = m.name || '大会名未設定';
        
        let eventDetailsHtml = '';
        if (m.events && m.events.length > 0) {
          m.events.forEach(ev => {
            let recStr = '-';
            if (ev.rounds && ev.rounds.length > 0) {
              recStr = ev.rounds.map(r => r.time).filter(Boolean).join(' / ');
            } else if (ev.trials && ev.trials.length > 0) {
              recStr = ev.trials.filter(Boolean).join(', ');
            } else if (ev.simpleRecord) {
              recStr = ev.simpleRecord;
            } else if (ev.time) {
              recStr = ev.time;
            }
            eventDetailsHtml += `<div class="detail-row"><span class="detail-label-item">${ev.type || '種目'}</span><span class="detail-val-item">${recStr}</span></div>`;
          });
        } else {
          eventDetailsHtml = `<div class="detail-row"><span class="detail-label-item">出場種目</span><span class="detail-val-item">なし</span></div>`;
        }

        let matchRowsHtml = '';
        if (m.place) matchRowsHtml += `<div class="detail-row"><span class="detail-label-item">会場</span><span class="detail-val-item">${m.place}</span></div>`;
        if (m.weather) matchRowsHtml += `<div class="detail-row"><span class="detail-label-item">天候</span><span class="detail-val-item">${m.weather}</span></div>`;

        detailHtml += `
          <div class="item-block match">
            <div style="font-weight:bold; color:#d4af37; margin-bottom:6px;">🏆 試合結果: ${matchName}</div>
            <div class="detail-table">
              ${matchRowsHtml}
              ${eventDetailsHtml}
            </div>
          </div>
        `;
      }

      // 4. 練習日誌
      if (parsed['練習日誌']) {
        const logData = parsed['練習日誌'];
        const rpeVal = logData.rpe ? `RPE ${logData.rpe}` : 'RPE未設定';
        
        let menuRowsHtml = '';
        if (logData.menus && logData.menus.length > 0) {
          logData.menus.forEach(menu => {
            let detailText = menu.menuName || 'メニュー';
            if (menu.reps && menu.reps.length > 0) {
              detailText += ` (${menu.reps.join(', ')})`;
            } else if (menu.sets && menu.sets.length > 0) {
              let setSummary = menu.sets.map(s => `${s.weight || 0}kg×${s.repsCount !== undefined ? s.repsCount : (s.rep || s.reps || 0)}rep`).join(', ');
              detailText += ` [${setSummary}]`;
            }
            menuRowsHtml += `<div class="detail-row"><span class="detail-label-item">${menu.areaType || '練習'}</span><span class="detail-val-item">${detailText}</span></div>`;
          });
        } else {
          menuRowsHtml = `<div class="detail-row"><span class="detail-label-item">メニュー</span><span class="detail-val-item">登録なし</span></div>`;
        }

        detailHtml += `
          <div class="item-block">
            <div style="font-weight:bold; color:#00e676; margin-bottom:6px;">🏃‍♂️ 練習日誌 (${rpeVal})</div>
            <div class="detail-table">
              ${menuRowsHtml}
              ${logData.memo ? `<div class="detail-row"><span class="detail-label-item">メモ</span><span class="detail-val-item">${logData.memo}</span></div>` : ''}
            </div>
          </div>
        `;
      }

      // 5. バイタル
      if (parsed['バイタル'] || parsed['身体バイタル']) {
        const v = parsed['バイタル'] || parsed['身体バイタル'];
        let rowsHtml = '';
        if (v.fatigue !== undefined && v.fatigue !== '') {
          rowsHtml += `<div class="detail-row"><span class="detail-label-item">⚡ 疲労度</span><span class="detail-val-item">${fatigueTexts[v.fatigue] || v.fatigue}</span></div>`;
        }
        if (v.sleep !== undefined && v.sleep !== '') {
          rowsHtml += `<div class="detail-row"><span class="detail-label-item">😴 睡眠時間</span><span class="detail-val-item">${v.sleep} 時間</span></div>`;
        }
        if ((v.weight !== undefined && v.weight !== '') || (v.fat !== undefined && v.fat !== '')) {
          rowsHtml += `<div class="detail-row"><span class="detail-label-item">⚖️ 体重 / 体脂肪率</span><span class="detail-val-item">${v.weight || '-'}kg / ${v.fat || '-'}%</span></div>`;
        }
        if (v.memo) {
          rowsHtml += `<div class="detail-row"><span class="detail-label-item">メモ</span><span class="detail-val-item">${v.memo}</span></div>`;
        }
        detailHtml += `
          <div class="item-block vital">
            <div style="font-weight:bold; color:#00d2d3; margin-bottom:6px;">⚖️ バイタル</div>
            <div class="detail-table">${rowsHtml}</div>
          </div>
        `;
      }

      return detailHtml;
    }

    async function renderHistory() {
      const container = document.getElementById('history-container');
      const selectedYear = document.getElementById('filter-year').value;
      const selectedMonth = document.getElementById('filter-month').value;
      const selectedType = document.getElementById('filter-type').value;

      const logsMap = await loadFirestoreLogData();
      
      let logsArray = [];
      Object.keys(logsMap).forEach(dateStr => {
        logsArray.push({ date: dateStr, data: logsMap[dateStr] });
      });
      logsArray.sort((a, b) => b.date.localeCompare(a.date));

      if (logsArray.length === 0) {
        container.innerHTML = '<div class="empty-message">保存されているデータがありません</div>';
        return;
      }

      const filtered = logsArray.filter(item => {
        const parts = item.date.split('-');
        if (parts.length < 3) return false;
        const [y, m, d] = parts;

        if (selectedYear !== 'all' && y !== selectedYear) return false;
        if (selectedMonth !== 'all' && m !== selectedMonth) return false;

        const dData = item.data;
        if (selectedType === 'log' && !dData['練習日誌']) return false;
        if (selectedType === 'vital' && !dData['バイタル'] && !dData['身体バイタル']) return false;
        if (selectedType === 'match' && !dData['試合結果'] && !dData['試合结果']) return false;
        if (selectedType === 'test' && !dData['コントロールテスト']) return false;

        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-message">条件に一致するデータはありません</div>';
        return;
      }

      let html = '';
      filtered.forEach(item => {
        const d = item.date;
        const dData = item.data;

        let badges = '';
        if (dData['練習日誌']) badges += '<span class="badge badge-log">練習日誌</span>';
        if (dData['バイタル'] || dData['身体バイタル']) badges += '<span class="badge badge-vital">バイタル</span>';
        if (dData['コントロールテスト']) badges += '<span class="badge badge-test">コントロールテスト</span>';
        if (dData['試合結果'] || dData['試合结果']) badges += '<span class="badge badge-match">試合結果</span>';

        const detailInnerHtml = generateDayDetailHtml(dData);

        html += `
          <div class="history-card" onclick="this.classList.toggle('expanded')">
            <div class="history-date">
              <span>📅 ${d}</span>
              <span style="font-size: 12px; color: #888; font-weight: normal;">タップで中身を切替 ›</span>
            </div>
            <div class="badge-container">
              ${badges || '<span style="font-size:11px; color:#777;">データなし</span>'}
            </div>
            <div class="detail-content-area" onclick="event.stopPropagation()">
              ${detailInnerHtml}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUserId = user.uid;
      } else {
        currentUserId = null;
        console.warn('ユーザーがログインしていません');
      }

      cachedLogsMap = {};
      const logsMap = await loadFirestoreLogData();
      
      let logsArray = [];
      Object.keys(logsMap).forEach(dateStr => {
        logsArray.push({ date: dateStr, data: logsMap[dateStr] });
      });
      logsArray.sort((a, b) => b.date.localeCompare(a.date));

      initYearFilter(logsArray);
      await renderHistory();
    });
  </script>
</body>
</html>
